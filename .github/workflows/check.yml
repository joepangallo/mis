name: Check the generated modules and the standalone pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per module. The empty string is Module 1, whose sources live
        # directly in src/. Adding a module here is the only step needed to put
        # its committed page under the same guard as the others.
        module: ["", "--module=modules/02", "--module=modules/03", "--module=modules/04", "--module=modules/05"]
    name: Verify ${{ matrix.module == '' && 'module 1' || matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify generated page, schemas, provenance, accessibility, and hygiene
        run: node src/check.mjs ${{ matrix.module }}

  standalone:
    runs-on: ubuntu-latest
    name: Verify the standalone pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The workshop, the quiz and the two review games are hand-written rather
      # than generated, so check.mjs never sees them. Their contract tests are
      # what stops a board drifting out of shape or a link going stale, and they
      # are listed one by one for the same reason the module matrix is: adding a
      # page should be a deliberate line in this file.
      - name: Run the contract tests for every self-contained page
        run: >
          node --test
          five-forces-and-value-chain.test.mjs
          five-forces-and-value-chain-quiz.test.mjs
          five-forces-and-value-chain-jeopardy.test.mjs
          modules-1-3-jeopardy.test.mjs
          practice-final.test.mjs
