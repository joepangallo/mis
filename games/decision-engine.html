<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decision Engine</title>
<meta name="description" content="An eight-quarter management game for Chapter 7, Enhancing Organizational Decision Making. You run the analytics, AI and knowledge programme of an invented distributor: sort the four kinds of analytics question, slice a real OLAP cube, build an executive dashboard and a working what-if model, mine unlabelled data, train and honestly test a supervised model, choose a generative AI deployment model and the governance around it, place the human review gate in an agent's pipeline, and site a depot with map layers and a knowledge network.">
<style>
/* ============================================================================
   THEME TOKENS — the study modules' palette, so arriving here from a module
   does not feel like a different product. The one addition is the "console"
   family: the darker chrome the simulation itself runs in, which separates
   the game from the reading around it.
   ========================================================================== */
:root{
  --bg:#efe7d9; --bg-soft:#e8dfcd; --panel:#faf5ec; --panel-2:#f2ebdd;
  --border:#ddd0b8; --border-soft:#e7dcc8;
  --text:#2f2a22; --text-dim:#554d40; --muted:#6b6153;
  --accent:#1d5d8c; --accent-strong:#17506f; --accent-soft:#1d5d8c1a; --accent-line:#1d5d8c45;
  --good:#0e6b4d; --good-soft:#0e6b4d1a;
  --bad:#b3282f;  --bad-soft:#b3282f1a;
  --warn:#8a5300; --warn-soft:#8a53001a;
  --plum:#7a3d86; --plum-soft:#7a3d861a;
  --teal:#0f6d72; --teal-soft:#0f6d721a;
  --console:#1b2a45; --console-2:#25395e; --console-text:#f4f7fc; --console-dim:#9fb0cc;
  --grid-line:#d7c9ae;
  --shadow:0 8px 22px rgba(96,74,40,.11);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#1e2433; --bg-soft:#242b3c; --panel:#293042; --panel-2:#323950;
  --border:#46506c; --border-soft:#394157;
  --text:#f2f4fa; --text-dim:#c8cfe0; --muted:#a6aec4;
  --accent:#7cc7f0; --accent-strong:#1d5d8c; --accent-soft:#7cc7f022; --accent-line:#7cc7f055;
  --good:#2fd39f; --good-soft:#2fd39f22;
  --bad:#ff8a94;  --bad-soft:#ff8a9422;
  --warn:#f5a524; --warn-soft:#f5a52422;
  --plum:#d8a6e4; --plum-soft:#d8a6e422;
  --teal:#5fd6d8; --teal-soft:#5fd6d822;
  --console:#141c30; --console-2:#1d2a4a; --console-text:#eef3fb; --console-dim:#8c9dbb;
  --grid-line:#414b66;
  --shadow:0 10px 28px rgba(0,0,0,.32);
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light} html[data-theme="dark"]{color-scheme:dark}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--text); min-height:100%;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.sr-only{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
/* A display rule on a flex container beats the user agent's [hidden] rule, so
   say it once here rather than remembering it at every toggle. */
[hidden]{display:none !important}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,
a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ------------------------------------------------------------------ chrome */
.app{min-height:100%; display:flex; flex-direction:column}
.topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:6}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:1.02rem; letter-spacing:-.01em; white-space:nowrap}
.brand span{font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.meters{display:flex; gap:7px; flex-wrap:wrap}
.meter{display:flex; align-items:baseline; gap:6px; padding:4px 10px; border-radius:99px;
  background:var(--panel-2); border:1px solid var(--border-soft); white-space:nowrap}
.meter i{font-style:normal; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.meter b{font-size:.9rem; font-variant-numeric:tabular-nums}
.meter.up b{color:var(--good)} .meter.down b{color:var(--bad)}
.btn{border:1px solid var(--border); background:var(--panel-2); border-radius:10px;
  padding:8px 14px; cursor:pointer; font-weight:650; font-size:.85rem;
  transition:transform .1s, border-color .15s, background .15s}
.btn:hover{border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-strong); border-color:var(--accent-strong); color:#fff}
.btn.good{background:var(--good); border-color:var(--good); color:#fff}
.btn.sm{padding:5px 11px; font-size:.77rem}
.btn[disabled]{opacity:.45; cursor:default; transform:none}
.btn[disabled]:hover{border-color:var(--border)}

.stage{flex:1; padding:16px 16px 44px; display:flex; flex-direction:column; align-items:center}
.wrap{width:100%; max-width:1020px}
.foot{padding:10px 16px 18px; border-top:1px solid var(--border-soft);
  font-size:.74rem; color:var(--muted); display:flex; gap:15px; flex-wrap:wrap; justify-content:center}
.foot a{font-weight:700}

/* --------------------------------------------------------------- the rail */
.rail{display:flex; gap:4px; margin:0 0 14px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.rail-step{flex:1 0 auto; min-width:92px; background:var(--panel-2); border:1px solid var(--border-soft);
  border-radius:9px; padding:7px 9px; font-size:.68rem; line-height:1.3; color:var(--muted)}
.rail-step b{display:block; font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
.rail-step.now{background:var(--accent-soft); border-color:var(--accent-line); color:var(--text)}
.rail-step.done{background:var(--good-soft); border-color:var(--good); color:var(--text)}
.rail-step.done b::after{content:" \2713"}

/* -------------------------------------------------------------- the panels */
.panel{background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow); width:100%}
.panel + .panel{margin-top:13px}
.panel > h2{margin:0 0 9px; font-size:1.08rem; letter-spacing:-.01em}
.panel > h3{margin:16px 0 7px; font-size:.95rem}
.panel p{margin:0 0 9px}
.panel p:last-child{margin-bottom:0}
.eyebrow{display:inline-block; font-size:.66rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); margin-bottom:6px}
.hero{text-align:center; margin:6px 0 18px}
.hero h1{margin:0 0 8px; font-size:1.95rem; letter-spacing:-.02em}
.hero p{margin:0 auto; max-width:64ch; color:var(--text-dim); font-size:.95rem}
.lede{font-size:.97rem; color:var(--text-dim)}
.grid2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid3{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.center-row{display:flex; justify-content:center; gap:11px; margin-top:16px; flex-wrap:wrap}
.right-row{display:flex; justify-content:flex-end; gap:11px; margin-top:16px; flex-wrap:wrap; align-items:center}
.spacer{margin-right:auto}

.callout{border-left:4px solid var(--accent); background:var(--accent-soft);
  border-radius:10px; padding:11px 13px; margin:11px 0 0; font-size:.89rem}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout.good{border-left-color:var(--good); background:var(--good-soft)}
.callout.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.callout b.tagline{display:block; margin-bottom:3px}
.callout p{margin:0 0 7px} .callout p:last-child{margin-bottom:0}

/* the field manual — the concept, available but never in the way */
details.manual{margin:12px 0 0; border:1px solid var(--border-soft); border-radius:11px;
  background:var(--panel-2); overflow:hidden}
details.manual > summary{cursor:pointer; padding:9px 13px; font-weight:700; font-size:.84rem;
  list-style:none; display:flex; align-items:center; gap:8px}
details.manual > summary::-webkit-details-marker{display:none}
details.manual > summary::before{content:"\25B8"; color:var(--accent); font-size:.8rem; transition:transform .15s}
details.manual[open] > summary::before{transform:rotate(90deg)}
details.manual .manual-body{padding:0 14px 13px; font-size:.87rem; color:var(--text-dim)}
details.manual .manual-body p{margin:0 0 8px}
details.manual .manual-body ul{margin:0 0 8px; padding-left:20px}
details.manual .manual-body li{margin:4px 0}
details.manual .manual-body b{color:var(--text)}
.chapter-note{font-size:.8rem; color:var(--muted); border-top:1px dashed var(--border);
  padding-top:8px; margin-top:4px}

/* --------------------------------------------------------------- the brief */
.brief{background:var(--console); color:var(--console-text); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow)}
.brief .eyebrow{color:#8fd0f5}
.brief h2{margin:0 0 9px; font-size:1.18rem; letter-spacing:-.01em}
.brief p{margin:0 0 9px; color:#dbe5f3; font-size:.93rem}
.brief p:last-child{margin-bottom:0}
.brief .from{font-size:.75rem; color:var(--console-dim); text-transform:uppercase;
  letter-spacing:.09em; font-weight:800; margin-bottom:7px}
.brief .ask{background:rgba(255,255,255,.08); border-left:3px solid #8fd0f5; border-radius:8px;
  padding:10px 12px; margin-top:11px; font-size:.9rem}
.brief .ask b{color:#fff}

/* an answered question: marked the moment it is answered, then locked */
.mark{margin:10px 0 0; border-radius:10px; padding:11px 13px; font-size:.88rem;
  border-left:4px solid var(--good); background:var(--good-soft)}
.mark.partial{border-left-color:var(--warn); background:var(--warn-soft)}
.mark.no{border-left-color:var(--bad); background:var(--bad-soft)}
.mark .verdictline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 6px}
.mark .verdictline b{font-size:.95rem}
.mark .pts{font-size:.66rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 8px; border-radius:99px; background:var(--good); color:#fff; white-space:nowrap}
.mark.partial .pts{background:var(--warn)}
.mark.no .pts{background:var(--bad)}
.mark .whytext{color:var(--text-dim)}
.mark .whytext p{margin:0 0 7px} .mark .whytext p:last-child{margin-bottom:0}
.mark .whytext ul{margin:0 0 7px; padding-left:20px}
.qcard.answered{opacity:.97}
.qcard.answered .pill:not([aria-pressed="true"]),
.qcard.answered .opt:not([aria-pressed="true"]){opacity:.5}
.worth{font-size:.66rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--border-soft); border-radius:99px;
  padding:2px 8px; margin-left:8px; white-space:nowrap}

/* the try-it card: the whole game in one card, playable before any reading */
.tryit{background:var(--panel); border:2px solid var(--accent); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow); width:100%}
.tryit .tag-try{display:inline-block; font-size:.66rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:#fff; background:var(--accent); padding:3px 10px;
  border-radius:99px; margin-bottom:10px}
.tryit .who{font-size:.8rem; color:var(--muted); font-weight:700; margin:0 0 4px}
.tryit .req{font-size:1.05rem; margin:0 0 14px; line-height:1.45}
.tryit .verdict{margin:14px 0 0; font-size:.92rem; border-left:4px solid var(--good);
  background:var(--good-soft); border-radius:10px; padding:12px 14px}
.tryit .verdict.no{border-left-color:var(--warn); background:var(--warn-soft)}
.tryit .after{margin:12px 0 0; font-size:.95rem; font-weight:650}

/* the one-line statement of the job, above every quarter's fiction */
.qbar{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  background:var(--panel-2); border:1px solid var(--border); border-left:5px solid var(--accent);
  border-radius:12px; padding:11px 15px; margin:0 0 13px}
.qbar b{font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); white-space:nowrap}
.qbar span{font-size:1rem; font-weight:650}

/* ------------------------------------------------------- how you play it
   Two components, both deliberately plain: the panel on the intro screen that
   explains the loop once, and the strip at the top of every quarter that says
   what to do on that screen in order. A reader who is lost should never have to
   infer the mechanics from the fiction. */
.howto{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:12px;
  padding:12px 14px; margin:0 0 14px}
.howto h3{margin:0 0 7px; font-size:.7rem; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--accent)}
.howto ol{margin:0; padding-left:20px}
.howto li{margin:4px 0; font-size:.88rem}
.howto li::marker{font-weight:800; color:var(--accent)}
.steps{counter-reset:s; margin:10px 0 0; padding:0; list-style:none}
.steps li{position:relative; padding:0 0 0 34px; margin:0 0 10px; font-size:.91rem}
.steps li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:1px;
  width:23px; height:23px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:.75rem; font-weight:800; display:flex; align-items:center; justify-content:center}
.steps li b{display:block}
.steps li span{color:var(--text-dim); font-size:.86rem}

/* the strip that says why the commit button is still locked */
.todo{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-right:auto;
  font-size:.82rem; font-weight:650; padding:6px 11px; border-radius:99px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--text)}
.todo.ready{background:var(--good-soft); border-color:var(--good)}
.todo::before{content:"\2022"; color:var(--warn); font-weight:900; font-size:1.1rem; line-height:1}
.todo.ready::before{content:"\2713"; color:var(--good); font-size:.9rem}

/* --------------------------------------------------------------- choosers */
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  background:var(--panel-2); border:1px solid var(--border-soft); border-radius:11px;
  padding:10px 12px; cursor:pointer; margin:0 0 8px; transition:border-color .13s, background .13s}
.opt:hover{border-color:var(--accent-line)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
.opt .tick{flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:2px solid var(--border);
  margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:900}
.opt[aria-pressed="true"] .tick{background:var(--accent); border-color:var(--accent); color:#fff}
.opt[aria-pressed="true"] .tick::after{content:"\2713"}
.opt .otext{min-width:0}
.opt .otext b{display:block; font-size:.9rem; margin-bottom:2px}
.opt .otext span{font-size:.82rem; color:var(--text-dim)}
.opt .price{margin-left:auto; font-size:.78rem; font-weight:800; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:8px}
.opt.correct{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--border-soft)}
.opt.correct[disabled]:hover{border-color:var(--good)}
.opt.wrong[disabled]:hover{border-color:var(--bad)}

.pills{display:flex; gap:6px; flex-wrap:wrap}
.pill{border:1px solid var(--border); background:var(--panel-2); border-radius:99px;
  padding:5px 12px; cursor:pointer; font-size:.79rem; font-weight:700; transition:.13s}
.pill:hover{border-color:var(--accent-line)}
.pill[aria-pressed="true"]{background:var(--accent-strong); border-color:var(--accent-strong); color:#fff}
.pill.k-desc[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
.pill.k-diag[aria-pressed="true"]{background:var(--plum); border-color:var(--plum)}
.pill.k-pred[aria-pressed="true"]{background:var(--teal); border-color:var(--teal)}
.pill.k-pres[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
.pill.correct{border-color:var(--good); background:var(--good-soft); color:var(--text)}
.pill.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--text)}

.tag{display:inline-block; font-size:.63rem; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:99px;
  background:var(--panel-2); border:1px solid var(--border-soft); color:var(--muted)}
.tag.ok{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.tag.no{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.tag.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.tag.lo{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}

/* ----------------------------------------------------------------- tables */
.tblwrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 10px}
table.data{border-collapse:collapse; width:100%; font-size:.83rem; min-width:420px}
table.data th,table.data td{border:1px solid var(--border-soft); padding:6px 9px; text-align:left}
table.data th{background:var(--panel-2); font-size:.71rem; text-transform:uppercase;
  letter-spacing:.06em; color:var(--muted); font-weight:800; white-space:nowrap}
table.data td.num,table.data th.num{text-align:right; font-variant-numeric:tabular-nums}
table.data tr.hi td{background:var(--accent-soft)}
table.data tr.flagged td{background:var(--warn-soft)}
table.data tbody tr.pickable{cursor:pointer}
table.data tbody tr.pickable:hover td{background:var(--accent-soft)}
table.data tbody tr.picked td{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
table.data tbody tr.right td{background:var(--good-soft); box-shadow:inset 3px 0 0 var(--good)}
table.data tbody tr.miss td{background:var(--bad-soft); box-shadow:inset 3px 0 0 var(--bad)}
caption.cap{caption-side:top; text-align:left; font-size:.75rem; color:var(--muted);
  padding:0 0 6px; font-weight:700}

/* ------------------------------------------------------------- the console */
.console{background:var(--console); color:var(--console-text); border-radius:14px; padding:14px 16px}
.console h3{margin:0 0 9px; font-size:.86rem; letter-spacing:.06em; text-transform:uppercase; color:#8fd0f5}
.console .readout{font-variant-numeric:tabular-nums; font-size:1.5rem; font-weight:800}
.console .sub{font-size:.78rem; color:var(--console-dim)}
.console .row{display:flex; justify-content:space-between; gap:12px; padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.1); font-size:.85rem}
.console .row:last-child{border-bottom:none}
.console .row b{font-variant-numeric:tabular-nums}

/* sliders */
.slider-row{margin:0 0 12px}
.slider-row label{display:flex; justify-content:space-between; gap:12px; font-size:.83rem;
  font-weight:700; margin-bottom:4px}
.slider-row label span{font-variant-numeric:tabular-nums; color:var(--accent); font-weight:800}
.slider-row input[type=range]{width:100%; accent-color:var(--accent)}
.slider-row .hint{font-size:.74rem; color:var(--muted)}

/* number answers */
.answer-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:8px 0 0}
.answer-row input[type=text],.answer-row input[type=number],.answer-row select{
  background:var(--panel); border:1px solid var(--border); border-radius:9px;
  padding:7px 10px; font-size:.88rem; min-width:112px}
.answer-row input.ok{border-color:var(--good); background:var(--good-soft)}
.answer-row input.no{border-color:var(--bad); background:var(--bad-soft)}
.qcard{border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px;
  background:var(--panel-2); margin:0 0 10px}
.qcard > p{margin:0 0 4px; font-size:.9rem}
.qcard .qwhy{font-size:.82rem; color:var(--text-dim); margin-top:8px;
  border-top:1px dashed var(--border); padding-top:7px}

/* --------------------------------------------------------------- the cube */
.cube-ctl{display:flex; gap:12px; flex-wrap:wrap; margin:0 0 12px}
.cube-ctl .dim{min-width:132px}
.cube-ctl .dim b{display:block; font-size:.66rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.cube-ctl select{width:100%; background:var(--panel); border:1px solid var(--border);
  border-radius:9px; padding:6px 9px; font-size:.84rem}
.querybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.78rem;
  color:var(--muted); margin:0 0 10px}
.querybar .lat{font-variant-numeric:tabular-nums; font-weight:800}
.querybar .lat.slow{color:var(--warn)} .querybar .lat.fast{color:var(--good)}
.cube-out{position:relative; min-height:96px}
.cube-out.busy{opacity:.35}
.spin{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.8rem; color:var(--muted); font-weight:700}

/* -------------------------------------------------------- the dashboard bay */
.bay{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:0 0 10px}
.bay-slot{border:2px dashed var(--border); border-radius:11px; min-height:64px; padding:8px 10px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:.76rem; color:var(--muted); background:var(--panel-2)}
.bay-slot.filled{border-style:solid; border-color:var(--accent-line); background:var(--accent-soft);
  color:var(--text); font-weight:700; cursor:pointer}

.pipe-step b{display:block; font-size:.64rem; font-weight:800; letter-spacing:.07em;

.gate-btn{flex:0 0 auto; align-self:center; width:34px; height:44px; margin:0 2px; border-radius:8px;
  border:2px dashed var(--border); background:transparent; cursor:pointer; color:var(--muted);
  font-size:.66rem; font-weight:800; line-height:1.05; padding:2px}
.gate-btn:hover{border-color:var(--accent); color:var(--accent)}

/* ------------------------------------------------------------------- SVGs */
.figwrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
svg.fig{display:block; width:100%; height:auto; max-width:100%}
svg.fig text{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  fill:var(--text)}
svg.fig text.dim{fill:var(--muted); font-weight:600}
.layer-toggles{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.node{cursor:pointer}
.node circle{transition:.13s}
.node:hover circle{stroke:var(--accent); stroke-width:3}
.node.picked circle{stroke:var(--accent); stroke-width:4}
.node.right circle{stroke:var(--good); stroke-width:4}
.node.miss circle{stroke:var(--bad); stroke-width:4}
.site{cursor:pointer}
.site:hover rect,.site:hover circle{stroke:var(--accent); stroke-width:3}

/* --------------------------------------------------------------- scoreboard */
.score-line{display:flex; align-items:center; gap:10px; margin:0 0 7px; font-size:.86rem}

.hr{height:1px; background:var(--border-soft); margin:16px 0}

ul.tight{margin:0 0 9px; padding-left:20px} ul.tight li{margin:4px 0}

<script>
/* ============================================================================
   DECISION ENGINE — an eight-quarter management game for Chapter 7.

   The whole game is one file with no network of any kind. Everything below is
   plain ES5-flavoured JavaScript so the page runs from a flash drive, a hard
   drive or a static host without a build step.

   Reading order:
     1. DATA        — the learning objectives, the cube, the baskets, every
                      mission's briefing and scoring key. Contract-tested.
     2. ENGINE      — meters, the rail, screen routing, scoring, the ledger.
     3. MISSIONS    — one builder and one grader per quarter.
     4. REVIEW      — the board's verdict.
   ========================================================================== */

/* ============================================================================
   1. DATA
   ========================================================================== */

/* The chapter's own four learning objectives. A miss is reported against these
   because they are what a reader goes back and rereads. */
var LOS = {
  "7.1": "The need for business intelligence, advanced analytics and AI in making better decisions",
  "7.2": "Applying business intelligence, advanced analytics and AI for competitive advantage",
  "7.3": "Implementing and using generative AI in organizations",
  "7.4": "Enhancing decisions with knowledge management and geographic information systems"
};

/* The course objectives this chapter can honestly claim, and the ones it
   cannot. Stated on the intro screen rather than quietly implied. */
var COURSE_OBJECTIVES = {
  claimed: [
    { n: 2, text: "How companies use information systems to manage internal operations and make decisions." },
    { n: 3, text: "How companies use information technology for competitive advantage." },
    { n: 7, text: "Recognising a business problem that information technology could solve, then working with the technical team to build and deploy the solution." },
    { n: 8, text: "The individual and organizational consequences of using information technology." },
    { n: 9, text: "Recognising security breaches and computer crimes." }
  ],
  notClaimed: [
    { n: 1, text: "What an MIS department does." },
    { n: 4, text: "Hardware, software, database technology and networks as a working skill." },
    { n: 5, text: "Internet technology for electronic commerce and working with partners." },
    { n: 6, text: "The life cycle of an information system." },
    { n: 10, text: "Building a database application in SQLite." },
    { n: 11, text: "Building a decision support system in a spreadsheet — this game teaches what a DSS does, in quarter three, but the spreadsheet itself belongs to the separate coursework." }
  ]
};

/* ------------------------------------------------------------ the OLAP cube
   Revenue and margin in thousands of dollars, indexed
   [product][region][quarter]. Hard-coded rather than generated so that the
   contract test can recompute every stated answer from the same numbers. */
var CUBE = {
  measures: [
    { id:"rev", name:"Revenue", unit:"$000" },

  ],

    [[377,435,467,402],[327,376,405,348],[274,316,340,292],[241,278,299,257]],
    [[297,279,271,323],[341,321,311,371],[253,239,231,276],[211,199,193,230]],
    [[172,220,237,178],[197,251,271,204],[157,199,215,162],[212,270,292,219]],
    [[144,150,155,185],[112,117,120,144],[159,165,170,204],[127,133,137,163]]
  ],

    [[41,48,51,44],[43,49,53,45],[44,51,54,47],[22,25,27,23]],

    [[15,20,21,16],[28,35,38,29],[19,24,26,19],[36,46,50,37]],
    [[37,39,40,48],[32,34,35,42],[35,36,37,45],[39,41,42,51]]
  ]
};

/* ------------------------------------------------------- the basket receipts
   Twenty orders from independent restaurants. Support and confidence are
   computed from this table live, so the numbers on screen are arithmetic the
   reader can check by counting rows rather than figures we assert. */
var BASKET_ITEMS = ["Coffee","Sugar","Paper cups","Cooking oil","Flour","Chicken","Dish soap","Saffron"];
var BASKETS = [
  ["Coffee","Sugar","Paper cups"],
  ["Coffee","Sugar"],
  ["Coffee","Sugar","Paper cups","Dish soap"],
  ["Cooking oil","Flour","Chicken"],
  ["Coffee","Paper cups"],
  ["Coffee","Sugar","Dish soap"],
  ["Cooking oil","Chicken"],
  ["Flour","Cooking oil"],
  ["Coffee","Sugar","Paper cups"],
  ["Chicken","Cooking oil","Dish soap"],
  ["Coffee","Paper cups","Dish soap"],
  ["Sugar","Flour"],
  ["Coffee","Sugar"],
  ["Cooking oil","Flour","Chicken","Dish soap"],
  ["Saffron","Cooking oil"],
  ["Coffee","Sugar","Paper cups"],
  ["Dish soap","Paper cups"],
  ["Chicken","Cooking oil"],
  ["Coffee","Sugar","Paper cups","Cooking oil"],
  ["Flour","Chicken","Cooking oil"]
];

/* --------------------------------------------------------- the firm itself
   Every organization, person and figure in this game is invented. Nothing
   here reports the affairs of a real company. */
var FIRM = {
  name: "Fairmount Provisions",
  what: "a regional food and household goods distributor",
  depots: 40,
  staff: 1100,
  customers: "independent grocers, school kitchens and restaurants"
};

/* The try-it card on the intro screen. It is not one of the eight in quarter
   one: nothing here is spoiled by playing it, and it is chosen to be the
   easiest call in the chapter so a new player's first click succeeds. */
var DEMO = {
  from: "Regional manager, North",
  text: "Sales in the North fell 9% last quarter while every other region grew. Find out why it happened.",
  answer: "diag",
  right: "Exactly. Something has already happened and you want the reason behind it \u2014 that is " +
    "<b>diagnostic</b> work. The other three would give you the size of the fall, a forecast of the next " +
    "one, or an instruction about what to do.",
  wrong: "Close. This one is <b>Diagnose</b>: the fall has already happened and what is wanted is the " +
    "reason behind it. Describe would give you the size of it, Predict the next quarter, Prescribe an " +
    "action to take."
};

var START = { cash: 4000000, trust: 60, capability: 20 };

var THEME_KEY = "mis-decision-engine-theme-v1";
var BEST_KEY = "mis-decision-engine-best-v1";

/* ============================================================================
   2. ENGINE
   ========================================================================== */

var $ = function(id){ return document.getElementById(id); };
var stage = $("stage");

function el(tag, attrs, html){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){ if(attrs.hasOwnProperty(k)){
    if(k === "class") n.className = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }}
  if(html != null) n.innerHTML = html;
  return n;
}
function money(n){
  var sign = n < 0 ? "-" : "";
  var a = Math.abs(Math.round(n));
  if(a >= 1000000) return sign + "$" + (a / 1000000).toFixed(a % 1000000 === 0 ? 1 : 2) + "m";
  if(a >= 1000) return sign + "$" + Math.round(a / 1000) + "k";
  return sign + "$" + a;
}
function dollars(n){ return (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString(); }
function pct(n){ return Math.round(n) + "%"; }
function announce(t){ $("liveStatus").textContent = t; }
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------------------------------------------------------- the theme
   This page's own saved choice wins; failing that it inherits whatever theme
   the reader last set on a study module, so the game does not flip back to
   light after a dark reading session. */
function applyTheme(theme){
  var dark = theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("themeBtn").textContent = dark ? "Light" : "Dark";
  $("themeBtn").setAttribute("aria-label", dark ? "Switch to the light theme" : "Switch to the dark theme");
}
(function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved === "dark" || saved === "light"){ applyTheme(saved); return; }
  var moduleTheme = null;
  try{ moduleTheme = localStorage.getItem("mis-ch1-theme-v1"); }catch(e){}
  applyTheme(moduleTheme === "dark" ? "dark" : "light");
})();
$("themeBtn").addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});

/* ------------------------------------------------------------- the best run */
function loadBest(){
  var raw = null;
  try{ raw = localStorage.getItem(BEST_KEY); }catch(e){}
  if(!raw) return null;
  try{
    var o = JSON.parse(raw);
    if(o && typeof o.percent === "number") return o;
  }catch(e){}
  return null;
}
function saveBest(run){
  var best = loadBest();
  if(best && best.percent >= run.percent) return false;
  try{ localStorage.setItem(BEST_KEY, JSON.stringify(run)); }catch(e){}
  return true;
}

/* ------------------------------------------------------------- game state */
var game = null;

function newGame(){
  return {
    quarter: 0,            /* index into MISSIONS */
    cash: START.cash,
    trust: START.trust,
    capability: START.capability,
    ledger: [],            /* every scored decision, in order */
    events: [],            /* the narrative line items that moved a meter */
    carry: {               /* what one quarter hands to the next */
      misfiled: 0,         /* Q1 requests sent to the wrong kind of analysis */
      inMemory: false,     /* the OLAP upgrade bought in Q2 */
      modelAccuracy: null, /* the true accuracy of the Q5 model */
      leakedTestSet: false,/* Q5 tested on its own training data */
      controls: [],        /* the GenAI controls bought in Q6 */
      badSource: false     /* the data file of unclear provenance */
    },
    done: false
  };
}

function spend(amount, why){
  game.cash -= amount;
  if(why) game.events.push({ kind:"cash", amount:-amount, why:why });
}
function moveTrust(delta, why){
  game.trust = clamp(game.trust + delta, 0, 100);
  if(why) game.events.push({ kind:"trust", amount:delta, why:why });
}
function moveCapability(delta, why){
  game.capability = clamp(game.capability + delta, 0, 100);
  if(why) game.events.push({ kind:"capability", amount:delta, why:why });
}

function scoreSoFar(){
  var got = 0, max = 0;
  for(var i = 0; i < game.ledger.length; i++){ got += game.ledger[i].points; max += game.ledger[i].max; }
  return { got: got, max: max };
}

function refreshMeters(){
  var m = $("meters");
  if(!game){ m.hidden = true; $("restartBtn").hidden = true; return; }
  m.hidden = false;
  $("restartBtn").hidden = false;
  /* Cash, trust and capability still move, and every quarter's results report
     what they did. They are not in the top bar because they read as three more
     things the reader is being marked on, and only the score is. */
  var s = scoreSoFar();
  $("mScore").querySelector("b").textContent = s.got + "/" + s.max;
  $("mScore").className = "meter";
}

/* ------------------------------------------------------------------ the rail
   Eight quarters across the top of every mission, so the reader can always see
   how far through the board's window they are. */
function renderRail(currentIndex, phase){
  var rail = el("div", { class:"rail", "aria-label":"The eight quarters" });
  for(var i = 0; i < MISSIONS.length; i++){
    var cls = "rail-step";
    if(i < currentIndex) cls += " done";
    else if(i === currentIndex) cls += " now";
    var step = el("div", { class: cls },
      "<b>Q" + (i + 1) + "</b>" + esc(MISSIONS[i].railName));
    if(i === currentIndex && phase) step.setAttribute("aria-current", "step");
    rail.appendChild(step);
  }
  return rail;
}

/* -------------------------------------------------------------- the briefing */
function renderBrief(m){
  var b = el("div", { class:"brief" });
  var html = '<p class="from">' + esc(m.brief.from) + "</p>" +
             '<span class="eyebrow">Quarter ' + m.quarter + " &middot; Objective " + m.lo + "</span>" +
             "<h2>" + esc(m.brief.title) + "</h2>";
  for(var i = 0; i < m.brief.body.length; i++) html += "<p>" + m.brief.body[i] + "</p>";
  /* A briefing may carry a paragraph that depends on what earlier quarters did. */
  if(typeof m.brief.dynamic === "function") html += m.brief.dynamic();
  html += '<div class="ask"><b>What the board needs from you:</b> ' + m.brief.ask + "</div>";
  b.innerHTML = html;
  return b;
}

/* ---------------------------------------------------------- the field manual
   The concept, one fold away. A reader who can reason their way through never
   opens it; a reader who is stuck gets the chapter rather than a hint. */
function renderManual(m){
  if(!m.manual) return null;
  var d = el("details", { class:"manual" });
  d.innerHTML = "<summary>Field manual &mdash; " + esc(m.manual.title) + "</summary>" +
    '<div class="manual-body">' + m.manual.body + "</div>";
  return d;
}

/* ============================================================================
   SCREENS
   ========================================================================== */
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); window.scrollTo(0, 0); }

var mission = null;   /* the live mission object while a quarter is being played */

function showIntro(){
  game = null;
  mission = null;
  refreshMeters();
  clearStage();

  var hero = el("div", { class:"hero" });
  hero.innerHTML =
    '<span class="eyebrow">Chapter 7 &middot; Enhancing organizational decision making</span>' +
    "<h1>Decision Engine</h1>" +
    "<p>A game you learn by playing. Try one decision right now &mdash; no reading first.</p>";
  stage.appendChild(hero);

  /* ---------------------------------------------------------- try it now
     The fastest possible explanation of this game is one round of it. A new
     player clicks four buttons under a request and finds out what the game
     asks of them, before a word of scenario. */
  var demo = el("div", { class:"tryit" });
  demo.innerHTML =
    '<span class="tag-try">Try one</span>' +
    '<p class="who">' + esc(DEMO.from) + " has asked you this:</p>" +
    '<p class="req">&ldquo;' + esc(DEMO.text) + "&rdquo;</p>" +
    "<p class=\"small muted\">What kind of analysis does it need? Press one.</p>";
  var demoPills = el("div");
  demo.appendChild(demoPills);
  var demoOut = el("div");
  demo.appendChild(demoOut);
  stage.appendChild(demo);

  var answered = false;
  var group = pillGroup(demoPills, KINDS.map(function(k){ return { id:k.id, label:k.label }; }), "",
    function(v){
      if(!v) return;
      var ok = v === DEMO.answer;

        '<div class="verdict' + (ok ? "" : " no") + '">' + (ok ? DEMO.right : DEMO.wrong) + "</div>" +
        '<p class="after">That is the game. Eight quarters of decisions like that one &mdash; each with ' +
        "a real tool to make it with.</p>" +
        '<p class="small muted" style="margin-top:6px">Every decision is marked like that, and worth a ' +

      if(!answered){
        answered = true;
        var b = $("startBtn");
        if(b) b.textContent = "Start quarter 1";
      }
      announce(ok ? "Correct. That one is diagnostic." : "Not quite. That one is diagnostic.");
    });
  KINDS.forEach(function(k){ group.buttons[k.id].className = "pill " + k.cls; });

  var row = el("div", { class:"center-row" });
  var start = el("button", { class:"btn primary", id:"startBtn" }, "Skip it and start \u2014 quarter 1 of 8");
  start.addEventListener("click", function(){ game = newGame(); showMission(0); });
  row.appendChild(start);
  stage.appendChild(row);

  /* -------------------------------------------------- what you are in for
     Three short lines, then everything else folded away. A reader who wants
     the detail can open it; a reader who is lost is not made to read it. */
  var p1 = el("div", { class:"panel" });
  p1.innerHTML =
    "<h2>What you are in for</h2>" +
    '<ul class="tight">' +
      "<li><b>Eight quarters, about ten minutes each.</b> You can stop after any one of them.</li>" +
      "<li><b>Each quarter hands you a different tool</b> &mdash; a data cube, a dashboard, a " +
      "machine-learning model, an AI assistant, a map &mdash; and asks you to make the calls a real " +
      "analytics director would.</li>" +
      "<li><b>Every screen tells you what to do at the top</b>, and the button at the bottom stays " +
      "locked until you have done it.</li>" +
    "</ul>";
  stage.appendChild(p1);

  var more = el("details", { class:"manual" });
  var rows = "";
  for(var i = 0; i < MISSIONS.length; i++){
    var m = MISSIONS[i];
    rows += "<tr><td class=\"num\"><b>Q" + m.quarter + "</b></td><td>" + esc(m.name) +
            "</td><td>" + esc(m.teaches) + "</td></tr>";
  }
  var claimed = "", not = "";
  for(var c = 0; c < COURSE_OBJECTIVES.claimed.length; c++){
    claimed += "<li><b>" + COURSE_OBJECTIVES.claimed[c].n + ".</b> " + esc(COURSE_OBJECTIVES.claimed[c].text) + "</li>";
  }
  for(var d = 0; d < COURSE_OBJECTIVES.notClaimed.length; d++){
    not += "<li><b>" + COURSE_OBJECTIVES.notClaimed[d].n + ".</b> " + esc(COURSE_OBJECTIVES.notClaimed[d].text) + "</li>";
  }
  more.innerHTML =
    "<summary>The detail &mdash; the scenario, the four meters, and what this covers</summary>" +
    '<div class="manual-body">' +
      "<h3 style=\"margin:0 0 6px\">The scenario</h3>" +
      "<p>You are the new Director of Decision Support at <b>" + FIRM.name + "</b>, " + FIRM.what +
      " with " + FIRM.depots + " depots and " + FIRM.staff.toLocaleString() + " staff. The board has " +
      "given you eight quarters and " + dollars(START.cash) + ".</p>" +

      "<h3 style=\"margin:12px 0 6px\">How to play</h3>" +
      '<ol class="steps">' +
        "<li><b>Read the briefing.</b><span>The dark panel at the top of each quarter.</span></li>" +
        "<li><b>Do the work on the page.</b><span>Nothing is timed; change any answer as often as you like.</span></li>" +
        "<li><b>Press the button at the bottom right.</b><span>The badge beside it says what is still outstanding, and turns green when you are done.</span></li>" +
        "<li><b>Read what it cost you.</b><span>Every decision comes back marked, with the reasoning.</span></li>" +
      "</ol>" +
      "<p>Committing a quarter is one-way. If you get stuck, open the <b>field manual</b> folded into " +

function showMission(index){
  game.quarter = index;
  var m = MISSIONS[index];
  mission = m;
  refreshMeters();
  clearStage();

  stage.appendChild(renderRail(index, "play"));

  /* The job, in one sentence, before a word of scenario. A reader who reads
     nothing else on the screen should still know what they are being asked. */
  if(m.task){
    var bar = el("div", { class:"qbar" });
    bar.innerHTML = "<b>Quarter " + m.quarter + " of " + MISSIONS.length + "</b>" +
      "<span>" + esc(m.task) + "</span>";
    stage.appendChild(bar);
  }

  stage.appendChild(renderBrief(m));

  var work = el("div", { class:"panel" });
  work.id = "work";
  work.innerHTML = '<span class="eyebrow">Your desk</span><h2>' + esc(m.name) + "</h2>";
  stage.appendChild(work);

  /* Instructions first, then the concept behind them. A reader who knows what to
     do never needs to open the manual; a reader who is stuck should find it
     directly under the steps that stumped them. */
  if(m.howTo && m.howTo.length){
    var steps = el("div", { class:"howto" });
    steps.innerHTML = "<h3>What to do on this screen</h3><ol>" +
      m.howTo.map(function(t){ return "<li>" + t + "</li>"; }).join("") + "</ol>";
    work.appendChild(steps);
  }

  var manual = renderManual(m);
  if(manual) work.appendChild(manual);

  var board = el("div", { id:"missionBody" });
  work.appendChild(board);

  /* A builder that draws its opening state before it has finished wiring up
     would otherwise call this before it exists, and take the rest of the
     mission down with it. A no-op until build replaces it. */
  m.refreshCommit = function(){};
  m.q = new Questions();
  m.build(board);

  var row = el("div", { class:"right-row" });
  var note = el("span", { class:"todo", id:"commitNote" }, m.commitNote || "");
  note.id = "commitNote";
  row.appendChild(note);
  var commit = el("button", { class:"btn primary", id:"commitBtn" }, m.commitLabel || "Submit my answers");
  commit.addEventListener("click", function(){
    if(commit.disabled) return;
    commit.disabled = true;
    showDebrief(index, m.submit());
  });
  row.appendChild(commit);
  work.appendChild(row);

  if(m.refreshCommit) m.refreshCommit();
  announce("Quarter " + m.quarter + ". " + m.name + ".");
}

/* A quarter's result: a list of scored items, the meter movements it caused,
   and the narrative the board will read. */
function showDebrief(index, result){
  var m = MISSIONS[index];
  var i;

  for(i = 0; i < result.items.length; i++){
    var it = result.items[i];
    it.quarter = m.quarter;
    if(!it.lo) it.lo = m.lo;
    /* Anything marked as the reader worked is already in the ledger. */
    if(!result.live) game.ledger.push(it);
  }
  if(result.cash) spend(-result.cash, null);
  if(result.trust) moveTrust(result.trust, null);
  if(result.capability) moveCapability(result.capability, null);

  refreshMeters();
  clearStage();
  stage.appendChild(renderRail(index, "debrief"));

  var got = 0, max = 0, right = 0;
  for(i = 0; i < result.items.length; i++){
    got += result.items[i].points;
    max += result.items[i].max;
    if(result.items[i].points === result.items[i].max) right++;
  }
  var asked = result.items.length;
  var running = scoreSoFar();

  var head = el("div", { class:"brief" });
  var band = got === max ? "Every call was right." :
             got >= max * 0.7 ? "Most of it was right." :
             got >= max * 0.4 ? "About half of it was right." : "This one went badly.";
  head.innerHTML =
    '<p class="from">Quarter ' + m.quarter + " results</p>" +
    "<h2>" + esc(band) + "</h2>" +
    "<p>You got <b>" + right + " of " + asked + "</b> right this quarter, worth <b>" + got +
    " out of " + max + " points</b>. Running total: <b>" + running.got + " of " + running.max +
    "</b>.</p>" +
    "<p>" + result.summary + "</p>";
  stage.appendChild(head);

  var moves = [];
  if(result.cash) moves.push((result.cash > 0 ? "+" : "") + money(result.cash) + " cash");
  if(result.trust) moves.push((result.trust > 0 ? "+" : "") + result.trust + " trust");
  if(result.capability) moves.push((result.capability > 0 ? "+" : "") + result.capability + " capability");
  if(moves.length){
    var mv = el("div", { class:"panel" });
    mv.innerHTML = "<h2>What it moved</h2><p>" + moves.join(" &nbsp;&middot;&nbsp; ") + "</p>" +
      (result.moveWhy ? '<p class="small muted">' + result.moveWhy + "</p>" : "");
    stage.appendChild(mv);
  }

  var p = el("div", { class:"panel" });
  var html = "<h2>Every call, and why</h2>" +
    '<p class="small muted">Each one is marked out of the points it was worth &mdash; the harder calls ' +
    "are worth more. Green is full marks, amber is partial, red is none. The explanation under every " +
    "card is the part worth reading, whether you got it right or not.</p>";
  for(i = 0; i < result.items.length; i++){
    var item = result.items[i];
    var tagClass = item.points === item.max ? "ok" : item.points === 0 ? "no" : "mid";
    html += '<div class="qcard"><p><span class="tag ' + tagClass + '">' + item.points + "/" + item.max +
            "</span> <b>" + item.label + "</b></p>" +
            '<p class="small">' + item.chose + "</p>" +
            '<p class="qwhy">' + item.why + "</p></div>";
  }
  p.innerHTML = html;
  stage.appendChild(p);

  if(result.after){
    var a = el("div", { class:"panel" });
    a.innerHTML = "<h2>" + esc(result.after.title) + "</h2>" + result.after.body;
    stage.appendChild(a);
  }

  var row = el("div", { class:"center-row" });
  var next = el("button", { class:"btn primary" },
    index + 1 < MISSIONS.length ? "Start quarter " + (index + 2) : "Face the board");
  next.addEventListener("click", function(){
    if(index + 1 < MISSIONS.length) showMission(index + 1);
    else showReview();
  });
  row.appendChild(next);
  stage.appendChild(row);
  announce("Quarter " + m.quarter + " scored " + got + " of " + max + ".");
}

   3. MISSIONS
   ========================================================================== */
var MISSIONS = [];

/* --------------------------------------------------------- shared builders */

/* A row of mutually exclusive pills. Returns a handle whose .value is the
   chosen id, or null. */
function pillGroup(parent, options, cls, onChange){
  var row = el("div", { class:"pills", role:"group" });
  var handle = { value:null, buttons:{} };
  options.forEach(function(o){
    var b = el("button", { type:"button", class:"pill " + (cls || ""), "aria-pressed":"false" }, o.label);
    b.addEventListener("click", function(){
      handle.value = handle.value === o.id ? null : o.id;
      for(var k in handle.buttons){ if(handle.buttons.hasOwnProperty(k)){
        handle.buttons[k].setAttribute("aria-pressed", k === handle.value ? "true" : "false");
      }}
      if(onChange) onChange(handle.value);
    });
    handle.buttons[o.id] = b;
    row.appendChild(b);
  });
  parent.appendChild(row);
  return handle;
}

/* A stack of option cards. multi:true allows several, with an optional cap. */
function optionStack(parent, options, opts){
  opts = opts || {};
  var handle = { chosen:[], buttons:{} };
  options.forEach(function(o){
    var b = el("button", { type:"button", class:"opt", "aria-pressed":"false" });
    b.innerHTML = '<span class="tick"></span><span class="otext"><b>' + o.title + "</b>" +
      (o.note ? "<span>" + o.note + "</span>" : "") + "</span>" +
      (o.price ? '<span class="price">' + o.price + "</span>" : "");
    b.addEventListener("click", function(){
      var at = handle.chosen.indexOf(o.id);
      if(at >= 0) handle.chosen.splice(at, 1);
      else if(opts.multi){
        if(opts.max && handle.chosen.length >= opts.max) return;
        handle.chosen.push(o.id);
      } else handle.chosen = [o.id];
      for(var k in handle.buttons){ if(handle.buttons.hasOwnProperty(k)){
        handle.buttons[k].setAttribute("aria-pressed", handle.chosen.indexOf(k) >= 0 ? "true" : "false");
      }}
      if(opts.onChange) opts.onChange(handle.chosen);
    });
    handle.buttons[o.id] = b;
    parent.appendChild(b);
  });
  return handle;
}

function enableCommit(on, note){
  var b = $("commitBtn");
  if(b) b.disabled = !on;
  var n = $("commitNote");
  if(n && note != null){
    n.textContent = note;
    n.className = "todo" + (on ? " ready" : "");
  }
}

function item(label, chose, ok, points, max, why, lo){
  return { label:label, chose:chose, ok:!!ok, points:points, max:max, why:why, lo:lo || null };
}

/* ============================================================================
   MARKING AS YOU GO

   Every scored question registers itself here. The moment it is answered it is
   marked, explained and locked: the first choice is the one that counts, which
   is the only arrangement under which the score means anything, and the reader
   never makes ten decisions before finding out how the first one went.

   A mission's grader for a question returns the same item() the end-of-quarter
   summary uses, so there is exactly one place where any question is judged.
   ========================================================================== */
function Questions(){
  this.order = [];      /* keys, in the order they appear on the page */
  this.spec = {};       /* key -> { card, grade, worth } */
  this.marked = {};     /* key -> item, once answered */
}
Questions.prototype.register = function(key, card, worth, grade){
  if(this.order.indexOf(key) < 0) this.order.push(key);
  this.spec[key] = { card:card, grade:grade, worth:worth };
  if(card && worth){
    var h = card.querySelector("p");
    if(h && !card.querySelector(".worth")){
      h.appendChild(el("span", { class:"worth" }, worth + (worth === 1 ? " point" : " points")));
    }
  }
};
Questions.prototype.isAnswered = function(key){
  return Object.prototype.hasOwnProperty.call(this.marked, key);
};
Questions.prototype.answeredCount = function(){
  var n = 0;
  for(var k in this.marked){ if(this.marked.hasOwnProperty(k)) n++; }
  return n;
};
Questions.prototype.total = function(){ return this.order.length; };
Questions.prototype.remaining = function(){ return this.total() - this.answeredCount(); };
/* Mark one question now, render the verdict under it, and lock the controls. */
Questions.prototype.mark = function(key){
  if(this.isAnswered(key)) return;
  var spec = this.spec[key];
  if(!spec) return;
  var it = spec.grade();
  if(!it) return;
  this.marked[key] = it;

  if(spec.card){
    spec.card.classList.add("answered");
    var cls = it.points === it.max ? "" : it.points === 0 ? " no" : " partial";
    var box = el("div", { class:"mark" + cls });
    box.innerHTML =
      '<p class="verdictline"><span class="pts">' + it.points + " / " + it.max + '</span>' +
      "<b>" + (it.points === it.max ? "Right" : it.points === 0 ? "Not this one" : "Partly right") + "</b>" +
      "<span>" + it.chose + "</span></p>" +
      '<div class="whytext">' + it.why + "</div>";
    spec.card.appendChild(box);
    /* Lock every control inside the card: the first answer counts. */
    var controls = spec.card.querySelectorAll("button.pill, button.opt, input, select, tr.pickable");
    for(var i = 0; i < controls.length; i++){
      var c = controls[i];
      if(c.tagName === "TR"){ c.classList.remove("pickable"); c.setAttribute("tabindex", "-1"); }
      else c.disabled = true;
    }
  }
  /* The running score should move as the reader works, not only at the end. */
  game.ledger.push({ quarter: mission.quarter, lo: it.lo || mission.lo, points: it.points,
                     max: it.max, label: it.label, chose: it.chose, why: it.why, ok: it.ok,
                     live: true });
  refreshMeters();
  announce(it.points === it.max ? "Right. " + it.points + " points." :
           "Marked. " + it.points + " of " + it.max + " points.");
  if(mission && mission.refreshCommit) mission.refreshCommit();
};
/* Everything already marked, in page order, for the end-of-quarter summary. */
Questions.prototype.items = function(){
  var out = [], self = this;
  this.order.forEach(function(k){ if(self.marked[k]) out.push(self.marked[k]); });
  return out;
};

var KINDS = [

/* ============================================================================
   QUARTER 2 — THE CUBE
   Measures against dimensions, and slicing, dicing, drilling down and rolling
   up an actual 4x4x4 cube to answer questions that cannot be answered by
   reading a table.
   ========================================================================== */
function cubeValue(measure, pIdx, rIdx, qIdx){ return CUBE[measure][pIdx][rIdx][qIdx]; }

/* Sum the cube over whichever members are currently included. */
function cubeSum(measure, pSet, rSet, qSet){
  var total = 0;
  for(var p = 0; p < CUBE.products.length; p++){
    if(pSet.indexOf(p) < 0) continue;
    for(var r = 0; r < CUBE.regions.length; r++){
      if(rSet.indexOf(r) < 0) continue;
      for(var q = 0; q < CUBE.quarters.length; q++){
        if(qSet.indexOf(q) < 0) continue;
        total += cubeValue(measure, p, r, q);
      }
    }
  }
  return total;
}
var CUBE_ANSWERS = {
  cell:   cubeValue("rev", 2, 3, 2),                      /* Frozen, West, Q3 */
  dice:   cubeSum("rev", [0,2], [0,2], [1,2]),            /* chilled+frozen, north+east, Q2+Q3 */
  topRev: (function(){                                     /* chilled, full year, by revenue */
    var best = 0, bestI = 0;
    for(var r = 0; r < CUBE.regions.length; r++){
      var v = cubeSum("rev", [0], [r], [0,1,2,3]);
      if(v > best){ best = v; bestI = r; }
    }
    return CUBE.regions[bestI];
  })(),
  topMar: (function(){                                     /* chilled, full year, by margin */
    var best = 0, bestI = 0;
    for(var r = 0; r < CUBE.regions.length; r++){
      var v = cubeSum("mar", [0], [r], [0,1,2,3]);
      if(v > best){ best = v; bestI = r; }
    }
    return CUBE.regions[bestI];
  })()
};

          "<tr><td><b>Dice</b></td><td>Narrowed several dimensions at once to pull out a block</td><td>Comparing two things under two conditions</td></tr>" +
          "</tbody></table></div>" +
          "<p>A cube pre-aggregates so that only the subset a query needs is read. That is the difference " +
          "between a multidimensional question taking hours and taking a moment, and it is why the chapter " +
          "treats online analytical processing as a category of its own rather than as a bigger spreadsheet.</p>" +
          (game.carry.inMemory
            ? "<p>You moved it into memory. Memory got cheap; the bottleneck of reading and writing a slow disk went with it, and the same infrastructure can now serve transactions and analysis at once.</p>"
            : "<p class=\"muted\">You left it on disk. That was free this quarter. It is not free in a meeting where the third follow-up question is the one that matters.</p>")
      }
    };
  }
});

var DSS = {
  fixedCost: 340000,
  baseVariable: 29.00,
  contractVolume: 52000,
  fuel: { rise:{ label:"Fuel rises 18%", cost:32.20, p:0.30 },
          flat:{ label:"Fuel unchanged", cost:29.00, p:0.50 },
          fall:{ label:"Fuel falls 6%",  cost:27.95, p:0.20 } },
  target: 440000,
  priceCap: 47.00,
  fleetCap: 62000,
  demandIntercept: 210900,
  demandSlope: 3700
};
function dssMargin(price, volume, variable){ return volume * (price - variable) - DSS.fixedCost; }
function dssAttainable(price){ return Math.min(DSS.fleetCap, Math.round(DSS.demandIntercept - DSS.demandSlope * price)); }
var DSS_ANSWERS = {
  whatIf: dssMargin(44, DSS.contractVolume, DSS.fuel.rise.cost),
  expected: Math.round(
    DSS.fuel.rise.p * dssMargin(44, DSS.contractVolume, DSS.fuel.rise.cost) +
    DSS.fuel.flat.p * dssMargin(44, DSS.contractVolume, DSS.fuel.flat.cost) +
    DSS.fuel.fall.p * dssMargin(44, DSS.contractVolume, DSS.fuel.fall.cost)),
  goalSeekPrice: 44.00,
  bestPrice: (function(){
    var best = null, bestP = 0;
    for(var p = 34; p <= DSS.priceCap + 0.001; p += 0.5){
      var m = dssMargin(p, dssAttainable(p), DSS.baseVariable);
      if(best === null || m > best){ best = m; bestP = Math.round(p * 2) / 2; }
    }
    return bestP;
  })(),
  bestMargin: (function(){
    var best = null;
    for(var p = 34; p <= DSS.priceCap + 0.001; p += 0.5){
      var m = dssMargin(p, dssAttainable(p), DSS.baseVariable);
      if(best === null || m > best) best = m;
    }
    return best;
  })()
};

  submit:function(){

function basketCount(item){
  var n = 0;
  for(var i = 0; i < BASKETS.length; i++) if(BASKETS[i].indexOf(item) >= 0) n++;
  return n;
}
function basketBoth(a, b){
  var n = 0;
  for(var i = 0; i < BASKETS.length; i++) if(BASKETS[i].indexOf(a) >= 0 && BASKETS[i].indexOf(b) >= 0) n++;
  return n;
}
function support(a, b){ return basketBoth(a, b) / BASKETS.length; }

function mlTrueAccuracy(sources, cleaning, label){
  var acc = ML.baseAccuracy;
  ML_SOURCES.forEach(function(s){ if(!s.fixed && sources.indexOf(s.id) >= 0) acc += s.gain; });
  ML_CLEAN.forEach(function(row){
    var chosen = cleaning[row.id];
    row.options.forEach(function(o){ if(o.id === chosen) acc += o.gain; });
  });
  ML_LABELS.forEach(function(l){ if(l.id === label) acc += l.gain; });
  return clamp(acc, 45, 93);
}
function mlSplitBand(trainPct){
  if(trainPct === 100) return { points:0, leak:true, note:"tested on the same rows it learned from" };
  if(trainPct >= 70 && trainPct <= 80) return { points:2, leak:false, note:"an honest split" };
  if(trainPct >= 85) return { points:1, leak:false, note:"a test set too small to trust" };
  return { points:1, leak:false, note:"not much left to learn from" };
}
function mlMatrix(testN, reportedAcc){
  var actualLate = Math.round(testN * ML.lateRate);
  var actualOn = testN - actualLate;
  var correct = Math.round(testN * reportedAcc / 100);
  var errors = testN - correct;
  var fn = Math.min(actualLate, Math.round(errors * 0.62));
  var fp = Math.min(actualOn, errors - fn);
  return { testN:testN, actualLate:actualLate, actualOn:actualOn,
           tp:actualLate - fn, fn:fn, tn:actualOn - fp, fp:fp };
}

          self.decision === "back" ? "Went back to the data." :
          self.decision === "kill" ? "Stopped the project." : "Deployed it quietly.",
          ok, ok ? 2 : 0, 2, why, "7.2");
      });
      self.refreshCommit();
    }

    self.refreshCommit = function(){
      var left = q.remaining();
      var note = left === 0 ? "All answered." :
        (self.trained ? left + " still to answer." : "Work down the steps, then train.");
      enableCommit(left === 0, note);
    };
  },
  submit:function(){
    var self = this, q = this.q;
    var items = q.items();
    var t = self.trained;
    var acc = t.trueAcc;
    var cleanPts = ML_CLEAN.filter(function(r){ return q.marked[r.id] && q.marked[r.id].points === 1; }).length;

    var cashDelta = -(self.dataCost || 0);
    var finalAcc = acc;
    if(self.decision === "back"){ cashDelta -= ML.extraDataCost; finalAcc = clamp(acc + ML.extraDataGain, 45, 95); }
    if(self.decision === "kill") game.carry.modelAccuracy = null;
    else game.carry.modelAccuracy = finalAcc;
    game.carry.leakedTestSet = t.band.leak;
    game.carry.badSource = self.sources.indexOf("sentiment") >= 0;

    var trustDelta = 0;
    if(self.decision === "quiet") trustDelta -= 10;
    if(game.carry.badSource) trustDelta -= 8;
    if(self.decision === "kill") trustDelta += 3;
    if(q.marked.decide && q.marked.decide.ok && self.decision !== "kill") trustDelta += 4;

    var summary;
    if(self.decision === "kill"){
      summary = "You stopped it. There is no late-delivery model, and quarter seven's agent will have to run " +
        "on hand-written rules instead \u2014 which is a worse tool, honestly labelled.";
    } else if(self.decision === "back"){
      summary = "Another pass at the data brought the model from " + acc + "% to <b>" + finalAcc + "%</b>" +
        (finalAcc >= ML.threshold
          ? ", which clears the " + ML.threshold + "% bar, so it went to dispatch."
          : " \u2014 still short of the " + ML.threshold + "% bar, so it has not gone to dispatch and the " +
            "project is back in front of you next quarter.") +
        " That loop is the dashed line on the workflow diagram, and it cost " + money(ML.extraDataCost) + ".";
    } else {
      summary = "The model is live at a true accuracy of <b>" + finalAcc + "%</b>" +
        (t.band.leak ? ", not the " + t.reported + "% it reported" : "") +
        ". Quarter seven will be built on top of it, and will inherit exactly this much reliability.";
    }

    return {
      items: items,
      live: true,
      cash: cashDelta,
      trust: trustDelta,
      capability: cleanPts >= 5 ? 10 : cleanPts >= 3 ? 5 : 1,
      moveWhy: "Data readiness is not a phase that finishes. It is the ceiling on everything built afterwards.",
      summary: summary,
      after: {
        title: t.band.leak ? "The number on the slide and the number in the world" : "Classification, and what the errors cost",
        body: t.band.leak
          ? "<p>Your model reported <b>" + t.reported + "%</b> and is really <b>" + t.trueAcc + "%</b>. " +
            "Both numbers are honest answers to different questions. The first is &ldquo;how well do you " +
            "remember the rows I showed you?&rdquo; The second is &ldquo;how well will you do on Monday?&rdquo; " +
            "Only the second one is a forecast, and only the second one belongs in front of a board.</p>" +
            "<p>This is the one mistake in the whole workflow that produces <i>better</i> results the more " +
            "carelessly you make it, which is why the split is a rule rather than a judgement call.</p>"
          : "<p>This is a <b>classification</b> model: the outcome is a category &mdash; late or not late. " +
            "Predicting a delivery's arrival <i>time</i> in minutes would be a <b>prediction</b> problem with a " +
            "continuous outcome, and would use a different family of algorithms.</p>" +
            "<p>Notice that the two kinds of error are not the same cost to you. A <b>missed late delivery</b> " +
            "is a customer who was not warned. A <b>false alarm</b> is a van re-sequenced for nothing. Overall " +
            "accuracy averages those together as though they were interchangeable, and they never are &mdash; " +
            "which is why the table above is worth more than the single percentage above it.</p>"
      }
    };
  }
});

function verdictFor(percent){
  for(var i = 0; i < ENDINGS.length; i++) if(percent >= ENDINGS[i].min) return ENDINGS[i];
  return ENDINGS[ENDINGS.length - 1];
}

    "<p class=\"small muted\">Reported per objective rather than as one number, because an average hides " +
    "the one you should reread.</p>";
  Object.keys(LOS).forEach(function(k){
    var b = byLo[k];
    var p = b.max ? Math.round(b.got / b.max * 100) : 0;
    var cls = b.max === 0 ? "" : p >= 80 ? "ok" : p >= 55 ? "mid" : "no";
    /* An objective the run never reached is not one to reread; say so instead. */
    var verdict = b.max === 0 ? "Not reached" : p >= 80 ? "Solid" : p >= 55 ? "Shaky" : "Reread";

      '<span class="bar"><i class="' + cls + '" style="width:' + p + '%"></i></span>' +
      '<span class="val">' + b.got + "/" + b.max + " &middot; " + verdict + "</span></div>" +

  var carryPanel = el("div", { class:"panel" });

    " requests misfiled, " + money(game.carry.misfiled * 60000) + " of rework, and three weeks of a data scientist's time in quarter five.</li>");
  if(game.carry.inMemory) carries.push("<li><b>Quarter two</b> &mdash; you moved the cube into memory, and every follow-up question after that was free.</li>");
  if(game.carry.leakedTestSet) carries.push("<li><b>Quarter five</b> &mdash; the model was tested on the rows it learned from, so the accuracy you reported was never the accuracy you had.</li>");
  if(game.carry.badSource) carries.push("<li><b>Quarter five</b> &mdash; you bought a data file whose provenance nobody could establish. It added nothing to the model and it is still on your systems.</li>");
  if(game.carry.modelAccuracy === null) carries.push("<li><b>Quarter five</b> &mdash; you stopped the model, so quarter seven's agent ran on hand-written rules. Stopping a project that cannot work is a result, not a failure.</li>");
  else carries.push("<li><b>Quarter five to seven</b> &mdash; a model at " + game.carry.modelAccuracy +
    "% accuracy decided three hundred customer remedies. Everything it got wrong, it got wrong politely and in writing.</li>");
  if(game.carry.controls.length) carries.push("<li><b>Quarter six</b> &mdash; " + game.carry.controls.length +
    " governance controls in place, which is what made quarter seven's review gate a rule rather than a preference.</li>");
  carryPanel.innerHTML = "<h2>What followed you</h2>" +
    "<p>Nothing in these eight quarters reset. This is the chain:</p>" +
    '<ul class="tight ledger">' + carries.join("") + "</ul>";
  stage.appendChild(carryPanel);

  if(misses.length){
    var m = el("div", { class:"panel" });
    var mh = "<h2>Every decision that cost you, and why</h2>" +
      "<p class=\"small muted\">" + misses.length + " of " + game.ledger.length +
      " decisions scored less than full marks.</p>";
    misses.forEach(function(it){
      mh += '<div class="qcard"><p><span class="tag ' + (it.points === 0 ? "no" : "mid") + '">Q' +
        it.quarter + " &middot; " + it.points + "/" + it.max + "</span> <b>" + it.label + "</b></p>" +
        '<p class="small">' + it.chose + "</p>" +
        '<p class="qwhy">' + it.why + "</p></div>";
    });
    m.innerHTML = mh;
    stage.appendChild(m);
  } else {
    var perfect = el("div", { class:"panel" });
    perfect.innerHTML = "<h2>Nothing to reread</h2><p>Every decision in eight quarters scored full marks. " +
      "Play it again with different choices to see what the other branches cost &mdash; several of them are " +
      "more instructive than the right answer.</p>";
    stage.appendChild(perfect);
  }

  var run = { percent:percent, got:total.got, max:total.max, cash:game.cash,
              trust:game.trust, ending:ending.title };
  var isBest = saveBest(run);
  var best = loadBest();

  var close = el("div", { class:"panel" });
  close.innerHTML = "<h2>What you were actually practising</h2>" +
    "<p>Every quarter was one claim from the chapter, put somewhere it could cost you something:</p>" +
    '<div class="tblwrap"><table class="data"><thead><tr><th class="num">Q</th><th>The claim</th></tr></thead><tbody>' +
    "<tr><td class=\"num\">1</td><td>Four kinds of question need four different tools, and only one of them can act on its own.</td></tr>" +
    "<tr><td class=\"num\">2</td><td>The measure you choose changes the answer, and the four moves have names.</td></tr>" +
    "<tr><td class=\"num\">3</td><td>A dashboard without an exception or a drill-down is a report; and a model is only as honest as what it holds still.</td></tr>" +
    "<tr><td class=\"num\">4</td><td>An algorithm finds the pattern. Whether it is worth acting on is two numbers and a person.</td></tr>" +
    "<tr><td class=\"num\">5</td><td>The accuracy at the end was decided by the data decisions at the start, and testing on your training data is the mistake that rewards carelessness.</td></tr>" +
    "<tr><td class=\"num\">6</td><td>The deployment ladder is a menu, not a ranking, and a fluent answer is not a true one.</td></tr>" +
    "<tr><td class=\"num\">7</td><td>Oversight belongs where the machine's judgement first becomes visible, and a perfect voice is not evidence.</td></tr>" +
    "<tr><td class=\"num\">8</td><td>A site is only as good as the layer you forgot, and the knowledge you most need to keep is in somebody's head.</td></tr>" +
    "</tbody></table></div>" +
    (isBest ? "<p><b>That is your best run.</b> It is saved in this browser only.</p>"
            : best ? "<p>Your best run remains " + best.percent + "% (" + best.got + " of " + best.max + ").</p>" : "");
  stage.appendChild(close);

  var row = el("div", { class:"center-row" });
  var again = el("button", { class:"btn primary" }, "Run the eight quarters again");
  again.addEventListener("click", function(){ game = newGame(); showMission(0); });
  row.appendChild(again);
  var home = el("button", { class:"btn" }, "Back to the start");
  home.addEventListener("click", showIntro);
  row.appendChild(home);
  stage.appendChild(row);

  announce("Final result: " + percent + " per cent. " + ending.title + ".");
}

/* ============================================================================
   BOOT
   ========================================================================== */
showIntro();

</script>
</body>
</html>
