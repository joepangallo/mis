<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocks in the River</title>
<meta name="description" content="A seven-round learning game for Chapter 8, Enterprise Systems. You run the business-systems programme of an invented refrigeration maker: lay the order-to-cash process out and run an order down it, put eight departmental systems on the value chain and decide how data crosses between them, buy and configure an enterprise system and find the four cost lines nobody quoted, answer the phone against a stock figure exactly as stale as your own wiring made it, set a four-tier supply chain wobbling and then damp it, trace a faulty component lot through a build register, and read all five competitive forces off your own order book.">
<style>
/* ============================================================================
   THEME TOKENS — the study modules' palette, so arriving here from a module
   does not feel like a different product. The one addition is the "console"
   family: the darker chrome the simulation itself runs in, which separates
   the game from the reading around it.
   ========================================================================== */
:root{
  --bg:#efe7d9; --bg-soft:#e8dfcd; --panel:#faf5ec; --panel-2:#f2ebdd;
  --border:#ddd0b8; --border-soft:#e7dcc8;
  --text:#2f2a22; --text-dim:#554d40; --muted:#6b6153;
  --accent:#1d5d8c; --accent-strong:#17506f; --accent-soft:#1d5d8c1a; --accent-line:#1d5d8c45;
  --good:#0e6b4d; --good-soft:#0e6b4d1a;
  --bad:#b3282f;  --bad-soft:#b3282f1a;
  --warn:#8a5300; --warn-soft:#8a53001a;
  --plum:#7a3d86; --plum-soft:#7a3d861a;
  --teal:#0f6d72; --teal-soft:#0f6d721a;
  --console:#1b2a45; --console-2:#25395e; --console-text:#f4f7fc; --console-dim:#9fb0cc;
  --grid-line:#d7c9ae;
  --shadow:0 8px 22px rgba(96,74,40,.11);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#1e2433; --bg-soft:#242b3c; --panel:#293042; --panel-2:#323950;
  --border:#46506c; --border-soft:#394157;
  --text:#f2f4fa; --text-dim:#c8cfe0; --muted:#a6aec4;
  --accent:#7cc7f0; --accent-strong:#1d5d8c; --accent-soft:#7cc7f022; --accent-line:#7cc7f055;
  --good:#2fd39f; --good-soft:#2fd39f22;
  --bad:#ff8a94;  --bad-soft:#ff8a9422;
  --warn:#f5a524; --warn-soft:#f5a52422;
  --plum:#d8a6e4; --plum-soft:#d8a6e422;
  --teal:#5fd6d8; --teal-soft:#5fd6d822;
  --console:#141c30; --console-2:#1d2a4a; --console-text:#eef3fb; --console-dim:#8c9dbb;
  --grid-line:#414b66;
  --shadow:0 10px 28px rgba(0,0,0,.32);
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light} html[data-theme="dark"]{color-scheme:dark}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--text); min-height:100%;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.sr-only{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
/* A display rule on a flex container beats the user agent's [hidden] rule, so
   say it once here rather than remembering it at every toggle. */
[hidden]{display:none !important}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,
a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ------------------------------------------------------------------ chrome */
.app{min-height:100%; display:flex; flex-direction:column}
.topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:6}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:1.02rem; letter-spacing:-.01em; white-space:nowrap}
.brand span{font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.meters{display:flex; gap:7px; flex-wrap:wrap}
.meter{display:flex; align-items:baseline; gap:6px; padding:4px 10px; border-radius:99px;
  background:var(--panel-2); border:1px solid var(--border-soft); white-space:nowrap}
.meter i{font-style:normal; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.meter b{font-size:.9rem; font-variant-numeric:tabular-nums}
.meter.up b{color:var(--good)} .meter.down b{color:var(--bad)}
.btn{border:1px solid var(--border); background:var(--panel-2); border-radius:10px;
  padding:8px 14px; cursor:pointer; font-weight:650; font-size:.85rem;
  transition:transform .1s, border-color .15s, background .15s}
.btn:hover{border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-strong); border-color:var(--accent-strong); color:#fff}
.btn.good{background:var(--good); border-color:var(--good); color:#fff}
.btn.sm{padding:5px 11px; font-size:.77rem}
.btn[disabled]{opacity:.45; cursor:default; transform:none}
.btn[disabled]:hover{border-color:var(--border)}

.stage{flex:1; padding:16px 16px 44px; display:flex; flex-direction:column; align-items:center}
.wrap{width:100%; max-width:1020px}
.foot{padding:10px 16px 18px; border-top:1px solid var(--border-soft);
  font-size:.74rem; color:var(--muted); display:flex; gap:15px; flex-wrap:wrap; justify-content:center}
.foot a{font-weight:700}

/* --------------------------------------------------------------- the rail */
.rail{display:flex; gap:4px; margin:0 0 14px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.rail-step{flex:1 0 auto; min-width:92px; background:var(--panel-2); border:1px solid var(--border-soft);
  border-radius:9px; padding:7px 9px; font-size:.68rem; line-height:1.3; color:var(--muted)}
.rail-step b{display:block; font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
.rail-step.now{background:var(--accent-soft); border-color:var(--accent-line); color:var(--text)}
.rail-step.done{background:var(--good-soft); border-color:var(--good); color:var(--text)}
.rail-step.done b::after{content:" \2713"}

/* -------------------------------------------------------------- the panels */
.panel{background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow); width:100%}
.panel + .panel{margin-top:13px}
.panel > h2{margin:0 0 9px; font-size:1.08rem; letter-spacing:-.01em}
.panel > h3{margin:16px 0 7px; font-size:.95rem}
.panel p{margin:0 0 9px}
.panel p:last-child{margin-bottom:0}
.eyebrow{display:inline-block; font-size:.66rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); margin-bottom:6px}
.hero{text-align:center; margin:6px 0 18px}
.hero h1{margin:0 0 8px; font-size:1.95rem; letter-spacing:-.02em}
.hero p{margin:0 auto; max-width:64ch; color:var(--text-dim); font-size:.95rem}
.lede{font-size:.97rem; color:var(--text-dim)}
.grid2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid3{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.center-row{display:flex; justify-content:center; gap:11px; margin-top:16px; flex-wrap:wrap}
.right-row{display:flex; justify-content:flex-end; gap:11px; margin-top:16px; flex-wrap:wrap; align-items:center}
.spacer{margin-right:auto}

.callout{border-left:4px solid var(--accent); background:var(--accent-soft);
  border-radius:10px; padding:11px 13px; margin:11px 0 0; font-size:.89rem}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout.good{border-left-color:var(--good); background:var(--good-soft)}
.callout.bad{border-left-color:var(--bad); background:var(--bad-soft)}
.callout b.tagline{display:block; margin-bottom:3px}
.callout p{margin:0 0 7px} .callout p:last-child{margin-bottom:0}

/* the field manual — the concept, available but never in the way */
details.manual{margin:12px 0 0; border:1px solid var(--border-soft); border-radius:11px;
  background:var(--panel-2); overflow:hidden}
details.manual > summary{cursor:pointer; padding:9px 13px; font-weight:700; font-size:.84rem;
  list-style:none; display:flex; align-items:center; gap:8px}
details.manual > summary::-webkit-details-marker{display:none}
details.manual > summary::before{content:"\25B8"; color:var(--accent); font-size:.8rem; transition:transform .15s}
details.manual[open] > summary::before{transform:rotate(90deg)}
details.manual .manual-body{padding:0 14px 13px; font-size:.87rem; color:var(--text-dim)}
details.manual .manual-body p{margin:0 0 8px}
details.manual .manual-body ul{margin:0 0 8px; padding-left:20px}
details.manual .manual-body li{margin:4px 0}
details.manual .manual-body b{color:var(--text)}
.chapter-note{font-size:.8rem; color:var(--muted); border-top:1px dashed var(--border);
  padding-top:8px; margin-top:4px}

/* --------------------------------------------------------------- the brief */
.brief{background:var(--console); color:var(--console-text); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow)}
.brief .eyebrow{color:#8fd0f5}
.brief h2{margin:0 0 9px; font-size:1.18rem; letter-spacing:-.01em}
.brief p{margin:0 0 9px; color:#dbe5f3; font-size:.93rem}
.brief p:last-child{margin-bottom:0}
.brief .from{font-size:.75rem; color:var(--console-dim); text-transform:uppercase;
  letter-spacing:.09em; font-weight:800; margin-bottom:7px}
.brief .ask{background:rgba(255,255,255,.08); border-left:3px solid #8fd0f5; border-radius:8px;
  padding:10px 12px; margin-top:11px; font-size:.9rem}
.brief .ask b{color:#fff}

/* an answered question: marked the moment it is answered, then locked */
.mark{margin:10px 0 0; border-radius:10px; padding:11px 13px; font-size:.88rem;
  border-left:4px solid var(--good); background:var(--good-soft)}
.mark.partial{border-left-color:var(--warn); background:var(--warn-soft)}
.mark.no{border-left-color:var(--bad); background:var(--bad-soft)}
.mark .verdictline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 6px}
.mark .verdictline b{font-size:.95rem}
.mark .pts{font-size:.66rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 8px; border-radius:99px; background:var(--good); color:#fff; white-space:nowrap}
.mark.partial .pts{background:var(--warn)}
.mark.no .pts{background:var(--bad)}
.mark .whytext{color:var(--text-dim)}
.mark .whytext p{margin:0 0 7px} .mark .whytext p:last-child{margin-bottom:0}
.mark .whytext ul{margin:0 0 7px; padding-left:20px}
.qcard.answered{opacity:.97}
.qcard.answered .pill:not([aria-pressed="true"]),
.qcard.answered .opt:not([aria-pressed="true"]){opacity:.5}
.worth{font-size:.66rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--border-soft); border-radius:99px;
  padding:2px 8px; margin-left:8px; white-space:nowrap}

/* the try-it card: the whole game in one card, playable before any reading */
.tryit{background:var(--panel); border:2px solid var(--accent); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow); width:100%}
.tryit .tag-try{display:inline-block; font-size:.66rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:#fff; background:var(--accent); padding:3px 10px;
  border-radius:99px; margin-bottom:10px}
.tryit .who{font-size:.8rem; color:var(--muted); font-weight:700; margin:0 0 4px}
.tryit .req{font-size:1.05rem; margin:0 0 14px; line-height:1.45}
.tryit .verdict{margin:14px 0 0; font-size:.92rem; border-left:4px solid var(--good);
  background:var(--good-soft); border-radius:10px; padding:12px 14px}
.tryit .verdict.no{border-left-color:var(--warn); background:var(--warn-soft)}
.tryit .after{margin:12px 0 0; font-size:.95rem; font-weight:650}

/* the one-line statement of the job, above every quarter's fiction */
.qbar{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  background:var(--panel-2); border:1px solid var(--border); border-left:5px solid var(--accent);
  border-radius:12px; padding:11px 15px; margin:0 0 13px}
.qbar b{font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); white-space:nowrap}
.qbar span{font-size:1rem; font-weight:650}

/* ------------------------------------------------------- how you play it
   Two components, both deliberately plain: the panel on the intro screen that
   explains the loop once, and the strip at the top of every quarter that says
   what to do on that screen in order. A reader who is lost should never have to
   infer the mechanics from the fiction. */
.howto{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:12px;
  padding:12px 14px; margin:0 0 14px}
.howto h3{margin:0 0 7px; font-size:.7rem; font-weight:800; letter-spacing:.09em;
  text-transform:uppercase; color:var(--accent)}
.howto ol{margin:0; padding-left:20px}
.howto li{margin:4px 0; font-size:.88rem}
.howto li::marker{font-weight:800; color:var(--accent)}
.steps{counter-reset:s; margin:10px 0 0; padding:0; list-style:none}
.steps li{position:relative; padding:0 0 0 34px; margin:0 0 10px; font-size:.91rem}
.steps li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:1px;
  width:23px; height:23px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:.75rem; font-weight:800; display:flex; align-items:center; justify-content:center}
.steps li b{display:block}
.steps li span{color:var(--text-dim); font-size:.86rem}

/* the strip that says why the commit button is still locked */
.todo{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-right:auto;
  font-size:.82rem; font-weight:650; padding:6px 11px; border-radius:99px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--text)}
.todo.ready{background:var(--good-soft); border-color:var(--good)}
.todo::before{content:"\2022"; color:var(--warn); font-weight:900; font-size:1.1rem; line-height:1}
.todo.ready::before{content:"\2713"; color:var(--good); font-size:.9rem}

/* --------------------------------------------------------------- choosers */
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  background:var(--panel-2); border:1px solid var(--border-soft); border-radius:11px;
  padding:10px 12px; cursor:pointer; margin:0 0 8px; transition:border-color .13s, background .13s}
.opt:hover{border-color:var(--accent-line)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
.opt .tick{flex:0 0 auto; width:19px; height:19px; border-radius:6px; border:2px solid var(--border);
  margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:900}
.opt[aria-pressed="true"] .tick{background:var(--accent); border-color:var(--accent); color:#fff}
.opt[aria-pressed="true"] .tick::after{content:"\2713"}
.opt .otext{min-width:0}
.opt .otext b{display:block; font-size:.9rem; margin-bottom:2px}
.opt .otext span{font-size:.82rem; color:var(--text-dim)}
.opt .price{margin-left:auto; font-size:.78rem; font-weight:800; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:8px}
.opt.correct{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--border-soft)}
.opt.correct[disabled]:hover{border-color:var(--good)}
.opt.wrong[disabled]:hover{border-color:var(--bad)}

.pills{display:flex; gap:6px; flex-wrap:wrap}
.pill{border:1px solid var(--border); background:var(--panel-2); border-radius:99px;
  padding:5px 12px; cursor:pointer; font-size:.79rem; font-weight:700; transition:.13s}
.pill:hover{border-color:var(--accent-line)}
.pill[aria-pressed="true"]{background:var(--accent-strong); border-color:var(--accent-strong); color:#fff}
.pill.k-desc[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
.pill.k-diag[aria-pressed="true"]{background:var(--plum); border-color:var(--plum)}
.pill.k-pred[aria-pressed="true"]{background:var(--teal); border-color:var(--teal)}
.pill.k-pres[aria-pressed="true"]{background:var(--warn); border-color:var(--warn)}
.pill.correct{border-color:var(--good); background:var(--good-soft); color:var(--text)}
.pill.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--text)}

.tag{display:inline-block; font-size:.63rem; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:99px;
  background:var(--panel-2); border:1px solid var(--border-soft); color:var(--muted)}
.tag.ok{background:var(--good-soft); border-color:var(--good); color:var(--good)}
.tag.no{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}
.tag.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.tag.lo{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}

/* ----------------------------------------------------------------- tables */
.tblwrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 10px}
table.data{border-collapse:collapse; width:100%; font-size:.83rem; min-width:420px}
table.data th,table.data td{border:1px solid var(--border-soft); padding:6px 9px; text-align:left}
table.data th{background:var(--panel-2); font-size:.71rem; text-transform:uppercase;
  letter-spacing:.06em; color:var(--muted); font-weight:800; white-space:nowrap}
table.data td.num,table.data th.num{text-align:right; font-variant-numeric:tabular-nums}
table.data tr.hi td{background:var(--accent-soft)}
table.data tr.flagged td{background:var(--warn-soft)}
table.data tbody tr.pickable{cursor:pointer}
table.data tbody tr.pickable:hover td{background:var(--accent-soft)}
table.data tbody tr.picked td{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
table.data tbody tr.right td{background:var(--good-soft); box-shadow:inset 3px 0 0 var(--good)}
table.data tbody tr.miss td{background:var(--bad-soft); box-shadow:inset 3px 0 0 var(--bad)}
caption.cap{caption-side:top; text-align:left; font-size:.75rem; color:var(--muted);
  padding:0 0 6px; font-weight:700}

/* ------------------------------------------------------------- the console */
.console{background:var(--console); color:var(--console-text); border-radius:14px; padding:14px 16px}
.console h3{margin:0 0 9px; font-size:.86rem; letter-spacing:.06em; text-transform:uppercase; color:#8fd0f5}
.console .readout{font-variant-numeric:tabular-nums; font-size:1.5rem; font-weight:800}
.console .sub{font-size:.78rem; color:var(--console-dim)}
.console .row{display:flex; justify-content:space-between; gap:12px; padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.1); font-size:.85rem}
.console .row:last-child{border-bottom:none}
.console .row b{font-variant-numeric:tabular-nums}

/* sliders */
.slider-row{margin:0 0 12px}
.slider-row label{display:flex; justify-content:space-between; gap:12px; font-size:.83rem;
  font-weight:700; margin-bottom:4px}
.slider-row label span{font-variant-numeric:tabular-nums; color:var(--accent); font-weight:800}
.slider-row input[type=range]{width:100%; accent-color:var(--accent)}
.slider-row .hint{font-size:.74rem; color:var(--muted)}

/* number answers */
.answer-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:8px 0 0}
.answer-row input[type=text],.answer-row input[type=number],.answer-row select{
  background:var(--panel); border:1px solid var(--border); border-radius:9px;
  padding:7px 10px; font-size:.88rem; min-width:112px}
.answer-row input.ok{border-color:var(--good); background:var(--good-soft)}
.answer-row input.no{border-color:var(--bad); background:var(--bad-soft)}
.qcard{border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px;
  background:var(--panel-2); margin:0 0 10px}
.qcard > p{margin:0 0 4px; font-size:.9rem}
.qcard .qwhy{font-size:.82rem; color:var(--text-dim); margin-top:8px;
  border-top:1px dashed var(--border); padding-top:7px}

/* --------------------------------------------------------------- the cube */
.cube-ctl{display:flex; gap:12px; flex-wrap:wrap; margin:0 0 12px}
.cube-ctl .dim{min-width:132px}
.cube-ctl .dim b{display:block; font-size:.66rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.cube-ctl select{width:100%; background:var(--panel); border:1px solid var(--border);
  border-radius:9px; padding:6px 9px; font-size:.84rem}
.querybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.78rem;
  color:var(--muted); margin:0 0 10px}
.querybar .lat{font-variant-numeric:tabular-nums; font-weight:800}
.querybar .lat.slow{color:var(--warn)} .querybar .lat.fast{color:var(--good)}
.cube-out{position:relative; min-height:96px}
.cube-out.busy{opacity:.35}
.spin{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.8rem; color:var(--muted); font-weight:700}

/* -------------------------------------------------------- the dashboard bay */
.bay{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:0 0 10px}
.bay-slot{border:2px dashed var(--border); border-radius:11px; min-height:64px; padding:8px 10px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:.76rem; color:var(--muted); background:var(--panel-2)}
.bay-slot.filled{border-style:solid; border-color:var(--accent-line); background:var(--accent-soft);
  color:var(--text); font-weight:700; cursor:pointer}
.bay-slot.filled:hover{border-color:var(--bad)}

/* ------------------------------------------------------------ the pipeline */
.pipe{display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0 10px; -webkit-overflow-scrolling:touch}
.pipe-step{flex:0 0 auto; min-width:118px; background:var(--panel-2); border:1px solid var(--border-soft);
  border-radius:10px; padding:9px 10px; font-size:.77rem; line-height:1.3}
.pipe-step b{display:block; font-size:.64rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.gate-btn{flex:0 0 auto; align-self:center; width:34px; height:44px; margin:0 2px; border-radius:8px;
  border:2px dashed var(--border); background:transparent; cursor:pointer; color:var(--muted);
  font-size:.66rem; font-weight:800; line-height:1.05; padding:2px}
.gate-btn:hover{border-color:var(--accent); color:var(--accent)}
.gate-btn[aria-pressed="true"]{border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--good)}

/* ------------------------------------------------------------------- SVGs */
.figwrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
svg.fig{display:block; width:100%; height:auto; max-width:100%}
svg.fig text{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  fill:var(--text)}
svg.fig text.dim{fill:var(--muted); font-weight:600}
.layer-toggles{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.node{cursor:pointer}
.node circle{transition:.13s}
.node:hover circle{stroke:var(--accent); stroke-width:3}
.node.picked circle{stroke:var(--accent); stroke-width:4}
.node.right circle{stroke:var(--good); stroke-width:4}
.node.miss circle{stroke:var(--bad); stroke-width:4}
.site{cursor:pointer}
.site:hover rect,.site:hover circle{stroke:var(--accent); stroke-width:3}
.site.picked circle{stroke:var(--accent); stroke-width:4}

/* --------------------------------------------------------------- scoreboard */
.score-line{display:flex; align-items:center; gap:10px; margin:0 0 7px; font-size:.86rem}
.score-line .lbl{flex:0 0 auto; min-width:108px; font-weight:700}
.score-line .bar{flex:1; height:9px; border-radius:99px; background:var(--panel-2);
  border:1px solid var(--border-soft); overflow:hidden; min-width:70px}
.score-line .bar i{display:block; height:100%; background:var(--accent)}
.score-line .bar i.ok{background:var(--good)}
.score-line .bar i.mid{background:var(--warn)}
.score-line .bar i.no{background:var(--bad)}
.score-line .val{flex:0 0 auto; font-variant-numeric:tabular-nums; font-weight:800; min-width:62px; text-align:right}
.ledger{font-size:.85rem}
.ledger li{margin:6px 0}
.ledger li b{font-variant-numeric:tabular-nums}
.ending{text-align:center; padding:6px 0 2px}
.ending h2{margin:0 0 6px; font-size:1.5rem}
.ending .rank{font-size:.7rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}

/* ------------------------------------------------------------------ misc */
.facts{display:grid; gap:7px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:10px 0}
.fact{background:var(--panel-2); border:1px solid var(--border-soft); border-radius:10px; padding:8px 10px}
.fact b{display:block; font-size:.62rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.fact span{font-size:.92rem; font-weight:700; font-variant-numeric:tabular-nums}
.hr{height:1px; background:var(--border-soft); margin:16px 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.nowrap{white-space:nowrap}
ul.tight{margin:0 0 9px; padding-left:20px} ul.tight li{margin:4px 0}
.hidden{display:none !important}

@media (max-width:640px){
  .stage{padding:12px 12px 36px}
  .panel{padding:15px 14px; border-radius:13px}
  .brief{padding:15px 14px}
  .hero h1{font-size:1.5rem}
  .brand span{display:none}
  .meter{padding:3px 8px}
  .meter b{font-size:.84rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
@media print{
  .topbar,.rail,.center-row,.right-row,.foot{display:none !important}
  .panel,.brief{box-shadow:none; border:1px solid #999}
  .brief{background:#fff; color:#000}
  .brief p,.brief .from{color:#333}
}
/* ============================================================================
   COMPONENTS THIS GAME ADDS

   Chapter 8 is about things that do not talk to each other being made to talk,
   so almost every board here is a picture of a flow: a process laid end to end,
   a value chain with its support layers underneath, four tiers of a supply
   network, a customer arriving down five different channels. These are the
   parts those boards are built from.
   ========================================================================== */

/* -------------------------------------------------------- the process line
   A business process drawn as its subprocesses, left to right. Each step is a
   button when the round asks the reader to do something to it. */
.flowline{display:flex; align-items:stretch; gap:0; overflow-x:auto;
  padding:4px 0 10px; -webkit-overflow-scrolling:touch}
.flowstep{flex:0 0 auto; min-width:116px; max-width:170px; text-align:left;
  background:var(--panel-2); border:1px solid var(--border-soft); border-radius:11px;
  padding:9px 11px; font-size:.78rem; line-height:1.35; color:var(--text)}
.flowstep b{display:block; font-size:.62rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
button.flowstep{cursor:pointer; transition:border-color .13s, background .13s}
button.flowstep:hover{border-color:var(--accent-line)}
button.flowstep[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent)}
.flowstep.ok{border-color:var(--good); background:var(--good-soft)}
.flowstep.bad{border-color:var(--bad); background:var(--bad-soft)}
.flowstep.ghost{border-style:dashed; color:var(--muted); background:transparent}
.flowjoin{flex:0 0 auto; align-self:center; width:20px; text-align:center;
  color:var(--muted); font-weight:800}
.flowjoin.broken{color:var(--bad)}
.flowjoin.broken::after{content:"\2715"}
.flowjoin::after{content:"\2192"}

/* ------------------------------------------------------------- the sequence
   Ordering without drag and drop, which is unusable on a phone and invisible
   to a screen reader: the reader presses the steps in the order they believe
   they happen, and can take the last one back. */
.seq{display:flex; flex-direction:column; gap:6px; margin:0 0 10px}
.seq-slot{display:flex; align-items:center; gap:10px; border:1px dashed var(--border);
  border-radius:10px; padding:8px 11px; background:var(--panel-2); font-size:.85rem;
  min-height:42px}
.seq-slot .n{flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--border);
  color:var(--text); font-size:.72rem; font-weight:800;
  display:flex; align-items:center; justify-content:center}
.seq-slot.filled{border-style:solid; border-color:var(--accent-line); background:var(--accent-soft)}
.seq-slot.filled .n{background:var(--accent); color:#fff}
.seq-slot.right{border-color:var(--good); background:var(--good-soft)}
.seq-slot.right .n{background:var(--good); color:#fff}
.seq-slot.wrong{border-color:var(--bad); background:var(--bad-soft)}
.seq-slot.wrong .n{background:var(--bad); color:#fff}
.seq-slot .said{margin-left:auto; font-size:.74rem; color:var(--muted); text-align:right}

/* ----------------------------------------------------------- the value chain
   Five core activities across the top, four support layers running the whole
   width underneath, exactly as the chapter's own figure draws it. */
.vchain{border:1px solid var(--border); border-radius:13px; padding:10px; background:var(--panel-2);
  margin:0 0 12px}
.vchain .vlabel{font-size:.62rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:0 0 5px}
.vc-core{display:grid; gap:6px; grid-template-columns:repeat(5,minmax(0,1fr)); margin:0 0 9px}
.vc-support{display:flex; flex-direction:column; gap:6px}
.vc-cell{width:100%; text-align:left; border:1px solid var(--border-soft); border-radius:10px;
  background:var(--panel); padding:8px 9px; font-size:.76rem; line-height:1.3; cursor:pointer;
  transition:border-color .13s, background .13s; color:var(--text)}
.vc-cell:hover{border-color:var(--accent-line)}
.vc-cell b{display:block; font-size:.76rem; margin-bottom:2px}
.vc-cell .cost{display:block; font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums}
.vc-cell[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent)}
.vc-cell.right{border-color:var(--good); background:var(--good-soft)}
.vc-cell.miss{border-color:var(--bad); background:var(--bad-soft)}
.vc-cell.support{background:var(--panel-2)}
.vc-cell[disabled]{cursor:default}
.vc-cell .badge{display:inline-block; font-size:.6rem; font-weight:800; letter-spacing:.05em;
  text-transform:uppercase; border-radius:99px; padding:1px 7px; margin-top:4px;
  background:var(--accent); color:#fff}
@media (max-width:640px){
  .vc-core{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------------------------------------------------------------- the silos
   Five standalone systems, then the same five wired to one database. */
.silos{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); margin:0 0 10px}
.silo{border:1px solid var(--border-soft); border-radius:11px; padding:9px 11px;
  background:var(--panel-2); font-size:.79rem}
.silo b{display:block; font-size:.8rem; margin-bottom:2px}
.silo span{color:var(--muted); font-size:.73rem}
.silo.linked{border-color:var(--good); background:var(--good-soft)}
.silo.stranded{border-color:var(--warn); background:var(--warn-soft)}

/* ------------------------------------------------------------- bar readouts
   Used for the bullwhip, for the order backlog and for anything where the
   point is that one number is several times another. */
.bars{margin:0 0 10px}
.bar-row{display:flex; align-items:center; gap:9px; margin:0 0 6px; font-size:.8rem}
.bar-row .blabel{flex:0 0 auto; min-width:104px; font-weight:700}
.bar-row .btrack{flex:1; height:14px; border-radius:5px; background:var(--panel-2);
  border:1px solid var(--border-soft); overflow:hidden; min-width:60px}
.bar-row .bfill{display:block; height:100%; background:var(--accent); transition:width .2s}
.bar-row .bfill.warn{background:var(--warn)}
.bar-row .bfill.bad{background:var(--bad)}
.bar-row .bfill.good{background:var(--good)}
.bar-row .bval{flex:0 0 auto; min-width:76px; text-align:right; font-weight:800;
  font-variant-numeric:tabular-nums}

/* --------------------------------------------------------- the supply tiers */
.tiers{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:0 0 10px}
.tier{border:1px solid var(--border-soft); border-radius:11px; padding:9px 11px;
  background:var(--panel-2); font-size:.79rem}
.tier b{display:block; font-size:.66rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.tier .big{font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums}
.tier.hot{border-color:var(--bad); background:var(--bad-soft)}
.tier.calm{border-color:var(--good); background:var(--good-soft)}

/* ---------------------------------------------------------------- switches
   A labelled on/off control that is a real button, so it is reachable by
   keyboard and announced by a screen reader. */
.switches{display:flex; flex-direction:column; gap:7px; margin:0 0 11px}
.switch{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  border:1px solid var(--border-soft); border-radius:11px; background:var(--panel-2);
  padding:9px 11px; cursor:pointer; transition:border-color .13s, background .13s; color:var(--text)}
.switch:hover{border-color:var(--accent-line)}
.switch .knob{flex:0 0 auto; width:34px; height:19px; border-radius:99px; background:var(--border);
  position:relative; margin-top:2px; transition:background .13s}
.switch .knob::after{content:""; position:absolute; top:2px; left:2px; width:15px; height:15px;
  border-radius:50%; background:var(--panel); transition:transform .13s}
.switch[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.switch[aria-pressed="true"] .knob{background:var(--accent)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(15px)}
.switch .stext{min-width:0}
.switch .stext b{display:block; font-size:.86rem; margin-bottom:2px}
.switch .stext span{font-size:.79rem; color:var(--text-dim)}
.switch .price{margin-left:auto; font-size:.76rem; font-weight:800; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:8px}
.switch[disabled]{cursor:default}

/* -------------------------------------------------------------- the budget
   A running total that turns red the moment the reader is over it. */
.budget{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:9px 13px;
  border-radius:11px; background:var(--panel-2); border:1px solid var(--border);
  margin:0 0 11px; font-size:.85rem}
.budget b{font-variant-numeric:tabular-nums; font-size:1.02rem}
.budget.over{border-color:var(--bad); background:var(--bad-soft)}
.budget.over b{color:var(--bad)}
.budget .cap{margin-left:auto; color:var(--muted); font-size:.78rem}

/* --------------------------------------------------------------- the inbox
   A stack of message cards that have to be routed somewhere. */
.msg{border:1px solid var(--border-soft); border-left:4px solid var(--accent);
  border-radius:11px; padding:10px 13px; background:var(--panel-2); margin:0 0 10px}
.msg .who{font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); margin:0 0 4px}
.msg .body{font-size:.9rem; margin:0 0 8px}

/* ------------------------------------------------------------ a small grid
   Used where two or three readouts belong side by side inside a card. */
.readouts{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); margin:9px 0}
.readout-box{border:1px solid var(--border-soft); border-radius:10px; padding:8px 10px;
  background:var(--panel)}
.readout-box b{display:block; font-size:.61rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted)}
.readout-box span{font-size:1.02rem; font-weight:800; font-variant-numeric:tabular-nums}
.readout-box span.good{color:var(--good)}
.readout-box span.bad{color:var(--bad)}
.readout-box span.warn{color:var(--warn)}

/* ------------------------------------------------------ the five forces row */
.forces{display:grid; gap:7px; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); margin:0 0 10px}
.force{border:1px solid var(--border-soft); border-radius:11px; padding:9px 11px;
  background:var(--panel-2); font-size:.79rem; text-align:left; width:100%; cursor:pointer; color:var(--text)}
.force:hover{border-color:var(--accent-line)}
.force b{display:block; font-size:.82rem; margin-bottom:2px}
.force[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent)}
.force.right{border-color:var(--good); background:var(--good-soft)}
.force.miss{border-color:var(--bad); background:var(--bad-soft)}
.force[disabled]{cursor:default}

/* ------------------------------------------------- the tray and the chips
   The pick-up / put-down gesture assignBoard() implements. A held card is
   outlined so the reader can see what is in their hand. */
.flowstep.held{border-color:var(--accent); background:var(--accent-soft);
  box-shadow:inset 0 0 0 2px var(--accent)}
.chips{display:flex; gap:4px; flex-wrap:wrap; margin-top:5px}
.chip{display:inline-block; font-size:.68rem; font-weight:700; line-height:1.25;
  padding:2px 8px; border-radius:99px; background:var(--accent); color:#fff; cursor:pointer;
  max-width:100%; overflow-wrap:anywhere}
.chip:hover{background:var(--accent-strong)}
.chip.right{background:var(--good)}
.chip.miss{background:var(--bad)}
.chip:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ------------------------------------------------------------- chart legend */
.legend{display:flex; gap:12px; flex-wrap:wrap; margin:4px 0 0; font-size:.75rem; color:var(--text-dim)}
.lgd{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.lgd i{width:14px; height:3px; border-radius:2px; display:inline-block}
.lgd i.dash{background:var(--muted); height:0; border-top:2px dashed var(--muted)}

/* ============================================================================
   TELLING THE READER WHAT TO PRESS

   The first version of this page explained the controls in a list at the top
   of each round and then put the controls four screens further down. That is
   not an explanation, it is a memory test. Everything below moves the
   instruction to the thing it is about, and makes the page visibly change
   when the reader is holding something, so the next press is shown rather
   than described.
   ========================================================================== */

/* -------------------------------------------------- the bar along the bottom
   Always visible while a round is being played, always one line, and always
   about the next physical press rather than about the lesson. */
.nextbar{position:sticky; bottom:0; z-index:7; margin-top:auto;
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  padding:9px 16px; background:var(--console); color:var(--console-text);
  border-top:1px solid rgba(255,255,255,.14); box-shadow:0 -6px 18px rgba(0,0,0,.13)}
.nextbar b{flex:0 0 auto; font-size:.61rem; font-weight:800; letter-spacing:.11em;
  text-transform:uppercase; color:#8fd0f5}
.nextbar .what{flex:1 1 260px; font-size:.9rem; min-width:0}
.nextbar .what em{font-style:normal; font-weight:800; color:#fff;
  border-bottom:2px solid #8fd0f5; padding-bottom:1px}
.nextbar .tally{flex:0 0 auto; font-size:.74rem; color:var(--console-dim);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.nextbar.ready{background:var(--good)}
.nextbar.ready b{color:#eafff5}
.nextbar.ready .tally{color:#d6f7e9}
@media (max-width:640px){
  /* On a phone this bar is permanent furniture, so it earns its height with
     the instruction alone: the label is redundant next to a bar that is
     always in the same place, and the question chips already carry progress. */
  .nextbar{padding:7px 12px; gap:6px}
  .nextbar b{display:none}
  .nextbar .tally{display:none}
  .nextbar .what{font-size:.82rem; flex:1 1 auto; line-height:1.35}
}

/* --------------------------------------------------- a jump past the reading
   For a reader who wants to start pressing things and read the fiction after. */
.qbar .jump{margin-left:auto; border:1px solid var(--accent); background:transparent;
  color:var(--accent); border-radius:99px; padding:4px 13px; font-size:.78rem;
  font-weight:700; cursor:pointer; white-space:nowrap}
.qbar .jump:hover{background:var(--accent); color:#fff}

/* ------------------------------------------------ which question you are on */
.qnum{display:inline-flex; align-items:center; gap:6px; font-size:.62rem; font-weight:800;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border:1px solid var(--border-soft); border-radius:99px; padding:2px 9px; margin:0 0 7px}
.qnum.done{color:var(--good); border-color:var(--good); background:var(--good-soft)}
.qnum.done::after{content:"\2713"; font-size:.78rem}
.qcard.current{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}

/* ------------------------------------------------- the tray and the gesture
   The strip above a tray says what to do with the tray, and changes the moment
   a card is in hand. While a card is held every place that will take it is
   outlined, so the destination is shown rather than named. */
.traybar{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:11px;
  padding:8px 12px; margin:0 0 8px; font-size:.86rem}
.traybar .step{flex:0 0 auto; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:.72rem; font-weight:800;
  display:flex; align-items:center; justify-content:center}
.traybar b{font-weight:800}
.traybar.holding{border-color:var(--accent); background:var(--accent);
  color:#fff; box-shadow:var(--shadow)}
.traybar.holding .step{background:#fff; color:var(--accent)}
.traybar.holding b{color:#fff}
.traybar.done{border-color:var(--good); background:var(--good-soft)}
.traybar.done .step{background:var(--good)}

/* every place that will accept the held card, while it is held */
.bin-armed{border-color:var(--accent) !important;
  box-shadow:0 0 0 2px var(--accent-soft), inset 0 0 0 1px var(--accent) !important;
  animation:binpulse 1.6s ease-in-out infinite}
@keyframes binpulse{
  0%,100%{box-shadow:0 0 0 2px var(--accent-soft), inset 0 0 0 1px var(--accent)}
  50%{box-shadow:0 0 0 5px var(--accent-soft), inset 0 0 0 1px var(--accent)}
}
@media (prefers-reduced-motion:reduce){ .bin-armed{animation:none} }

/* the one-card, one-place rehearsal on the opening screen */
.gesture{border:2px dashed var(--accent-line); border-radius:14px; padding:14px 16px;
  margin:13px 0 0; background:var(--panel-2)}
.gesture h3{margin:0 0 4px; font-size:.95rem}
.gesture p{margin:0 0 9px; font-size:.86rem; color:var(--text-dim)}
.gesture .slots{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gesture .slot{border:1px solid var(--border); border-radius:11px; background:var(--panel);
  padding:9px 11px; font-size:.82rem; text-align:left; width:100%; cursor:pointer; color:var(--text)}
.gesture .slot b{display:block; font-size:.84rem; margin-bottom:2px}
.gesture .done{border-color:var(--good); background:var(--good-soft)}

/* --------------------------------------------------------------- the repair
   A second instance of the same idea, shown only to a reader who got the first
   one wrong. It sits inside the question it belongs to, under the explanation
   that is meant to be used on it. */
.repair{margin:11px 0 0; border:2px dashed var(--accent-line); border-radius:12px;
  padding:12px 14px; background:var(--accent-soft)}
.repair .rhead{margin:0 0 9px; font-size:.88rem}
.repair .rtag{display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; color:#fff; background:var(--accent); padding:2px 9px;
  border-radius:99px; margin-right:8px}
.repair .rintro{margin:0 0 9px; font-size:.88rem}
.repair .facts{margin:8px 0}
.repair.won{border-style:solid; border-color:var(--good); background:var(--good-soft)}

    <span>Chapter&nbsp;8</span>
  </div>

    page. Your best run is saved in this browser only.</span>
  <a href="decision-engine.html">Chapter 7 game</a>
  <a href="../five-forces-and-value-chain.html">Strategy workshop</a>
  <a href="../module-06-managing-data-and-business-intelligence.html">Module 6</a>
</footer>
