/* ============================================================================
   ROUND 4 — THE PROMISE DESK

   The enterprise system went live last month. This is the first round where
   somebody actually uses it, on the phone, with a buyer waiting.

   Two things happen here. The first is a filing question that looks trivial
   and is not: five ordinary enquiries, and which component of the enterprise
   system owns each one. The chapter's own list of order-to-cash modules is
   split down the middle between financial management and operations
   management, and the split is not where most people would put it.

   The second is the round's real subject. The order desk reads a number off a
   screen and says it out loud to a customer. Whether that number is true was
   decided in round two, when the reader chose how what shipped gets back to
   the order desk, and in round one, if stock was ever set aside against an
   order that did not exist yet. Neither decision looked like it was about a
   phone call. Both of them were.

   The page never tells the reader the figure is wrong. It tells them how old
   it is, which is the only thing the system itself actually knows.
   ========================================================================== */

/* ------------------------------------------------------------ the stock
   The truth, which is on a rack in bay 12 and is not on any screen: sixty
   three cabinets are physically in the depot and forty two of them are
   genuinely set aside for other orders. Twenty one are free. Everything the
   promise desk can see is derived from those two numbers plus whatever has
   gone wrong on the way to the screen. */
var R4_ON_HAND = 63;          /* cabinets physically in bay 12 */
var R4_ALLOCATED = 42;        /* of those, set aside against real orders */
var R4_ASKED = 40;            /* what the buyer wants, on the date they want it */
var R4_ASK_DAYS = 9;          /* how far away that date is */
var R4_DRIFT_PER_HOUR = 0.34; /* allocations an hour that the desk has not been told about */
var R4_REPAIR_LATENCY = 14;   /* how stale the second call's figure is, when it is */
var R4_REPAIR_WANTED  = 30;   /* what the second buyer asks for. It must exceed what the
                                 screen shows on BOTH branches of the repair (21 live, 26
                                 stale), or "confirm all of it" and "confirm what the screen
                                 shows" become the same answer wearing two labels. */
var R4_SHORT_COST = 1520;     /* what one cabinet promised and not delivered costs */

/* What is genuinely available to promise, whatever the screen says. */
function r4TrueAvailable(){ return R4_ON_HAND - R4_ALLOCATED; }

/* How many cabinets were spoken for since the snapshot the desk is reading.
   Round two decided this: a live link is 0 hours old, a nightly file is 20,
   re-keying by hand is 6. */
function r4Drift(latencyHours){
  return Math.round((latencyHours || 0) * R4_DRIFT_PER_HOUR);
}

/* The on-hand figure the system prints. Round one's phantom allocation, if it
   fired, left fourteen cabinets booked into the depot that are physically on a
   trailer, so the system counts them and the rack does not have them. */
function r4OnHandShown(phantom){ return R4_ON_HAND + (phantom || 0); }

/* The allocated figure the system prints. It is short by however many
   allocations have not reached the order desk yet. */
function r4AllocatedShown(latencyHours){ return R4_ALLOCATED - r4Drift(latencyHours); }

/* What the promise desk sees: on hand less allocated, both of them wrong in
   the same direction, which is why the error compounds instead of cancelling. */
function r4Displayed(latencyHours, phantom){
  return r4OnHandShown(phantom) - r4AllocatedShown(latencyHours);
}

/* Whether the figure on the screen is standing for something older than now.
   The page says this and only this. It never says the figure is wrong,
   because the system has no way of knowing that it is. */
function r4Stale(latencyHours, phantom){
  return (latencyHours || 0) > 0 || (phantom || 0) > 0;
}

/* How many cabinets each answer actually commits the company to. Option d
   declines the date and quotes all forty off the next production run, which is
   a promise for cabinets that will be built rather than cabinets that exist. */
function r4Confirmed(optId, displayed){
  if(optId === "a") return R4_ASKED;
  if(optId === "b") return displayed;
  if(optId === "d") return R4_ASKED;
  return null;
}

/* How many of those do not exist on the date they were promised for. */
function r4Shortfall(optId, displayed){
  if(optId === "a") return Math.max(0, R4_ASKED - r4TrueAvailable());
  if(optId === "b") return Math.max(0, displayed - r4TrueAvailable());
  return 0;
}
function r4ShortCost(shortfall){ return shortfall * R4_SHORT_COST; }

/* Marking. Which answer is right depends entirely on whether the figure is
   standing for now or for some hours ago, which is the whole lesson. */
function r4PromisePoints(optId, stale){
  if(stale){
    if(optId === "c") return 4;
    if(optId === "b") return 1;
    if(optId === "d") return 1;
    return 0;
  }
  if(optId === "b") return 4;
  if(optId === "c") return 1;
  return 0;
}

/* What the buyer thinks of you afterwards. A shortfall is the only thing here
   that anybody outside the company ever finds out about. */
function r4Trust(shortfall, points){
  if(shortfall > 0) return -Math.min(10, 2 + Math.ceil(shortfall / 3));
  return points === 4 ? 3 : 1;
}

function r4DeskPoints(answers){

  for(i = 0; i < R4_ENQUIRIES.length; i++){
    if(answers[R4_ENQUIRIES[i].id] === R4_ENQUIRIES[i].answer) got++;

/* The enquiry as a screen reader should hear it: the bold is emphasis on the
   page and noise in an aria-label, and there are ten identically worded
   buttons on that card, so each row has to say which enquiry it belongs to. */
function r4PlainText(html){
  return String(html).replace(/<[^>]*>/g, "")
    .replace(/&rsquo;/g, "’").replace(/&ldquo;/g, "“").replace(/&rdquo;/g, "”")
    .replace(/&mdash;/g, "—").replace(/&amp;/g, "&");
}

/* An English list: one, two and three. Used where the number of items is
   whatever the reader got wrong, which can be anything from one to five. */
function r4List(parts){
  if(parts.length <= 1) return parts.join("");
  if(parts.length === 2) return parts[0] + " and " + parts[1];
  return parts.slice(0, parts.length - 1).join(", ") + " and " + parts[parts.length - 1];
}

var R4_RELEASES = 4;
function r4ReprogramPerRelease(){ return Math.round(R4_REPROGRAM_SHARE * R4_CUSTOMIZE_BUILD); }
function r4CustomizeFiveYear(){ return R4_CUSTOMIZE_BUILD + R4_RELEASES * r4ReprogramPerRelease(); }

/* ============================================================================
   ROUND 5 — THE WHIP

   Four tiers, twelve weeks, and one wobble. A warm spell makes cabinets work
   harder, so ten per cent more condensing units come off a buying group's
   spares shelf for four weeks and then it stops. The reader decides how much
   safety stock each tier holds and who is allowed to see what actually came
   off that shelf, and then watches that ten per cent arrive at a copper mill
   several times its original size.

   The whole round is one arithmetic rule, printed on the page in words and in
   symbols so that nothing here has to be taken on trust:

       order(t) = incoming(t) + k x (incoming(t) - incoming(t-1))

   The trap is the slider's starting position. 1.4 is the cautious setting, the
   one a careful person picks, and it is the setting that produces a 412.9 per
   cent swing at the far end of the chain. Caution at every tier separately is
   not caution; it is four people each multiplying the same wobble.

   Round six reads the flows along this same chain, and round seven reads what
   the two buying groups do with the leverage they have. What this round writes
   forward is the amplification the chain ended on, whether the demand signal
   was shared, and which competitive strategy the reader matched.
   ========================================================================== */

/* --------------------------------------------------------------- constants
   Everything printed on this screen is computed from these. Nothing below is
   a figure typed in because it looked right. */

/* What the buying groups' own maintenance teams actually drew off the spares
   shelf, in condensing units a week. A condensing unit holds the compressor;
   the compressor holds the copper tube; so this one number is the thing the
   whole chain is ultimately working for.
   Four weeks ten per cent up, then back to normal, then one week of 118. The
   shelf never moves more than eighteen units in a week, and that is the whole
   disturbance this round has. */
var WHIP_DEMAND = [100, 100, 100, 100, 110, 110, 110, 110, 100, 100, 118, 100];
var WHIP_BASE   = WHIP_DEMAND[0];
var WHIP_WEEKS  = WHIP_DEMAND.length;

/* The four tiers, in the chapter's own order: the shelf is the downstream end
   where the customer is, the mill is the upstream end where the raw material
   is. Each tier's line on the chart is the order THAT tier places on its own
   supplier. */
var WHIP_TIERS = [
  { id:"shelf", name:"Northbrae spares shelf", shortName:"Spares shelf", rank:"the customer end",
    buys:"draws condensing units off its spares shelf and reorders from " + FIRM.name },
  { id:"plant", name:FIRM.name + " plant", shortName:"Aldervane plant", rank:"you",
    buys:"orders compressors from the compressor maker" },
  { id:"comp",  name:"Compressor maker", shortName:"Compressor maker", rank:"tier 1 supplier",
    buys:"orders copper tube from the mill" },
  { id:"mill",  name:"Copper tube mill", shortName:"Copper tube mill", rank:"tier 2 supplier",
    buys:"orders copper billet from the smelter" }
];

/* Holding costs a little every week. Being caught short costs a lot, once. */
var WHIP_HOLD_PER_UNIT_WEEK  = 34;
var WHIP_SHORT_PER_TIER_WEEK = 41000;

/* The slider. WHIP_K_START is where the chain arrives, and is deliberately the
   cautious setting rather than a sensible one. */
var WHIP_K_MIN = 0, WHIP_K_MAX = 2, WHIP_K_STEP = 0.1, WHIP_K_START = 1.4;

/* Settings the explanation compares the reader's own run against. */
var WHIP_K_TIGHT  = 0.3;                    /* safety stock cut hard */
var WHIP_K_STEADY = 0.5;                    /* a modest buffer */
var WHIP_K_LADDER = [0.2, 0.3, 0.3, 0.4];   /* less near the shelf, more further up */

/* What the round is marked against, printed on screen before anybody commits,
   because a target nobody can see is not a target. */
var WHIP_FULL = 85000, WHIP_PART = 95000, WHIP_SOFT = 150000;

/* Where the readout stops calling the far end calm and starts calling it rough.
   Colour only: no figure on the screen depends on these. */
var WHIP_CALM_PCT = 60, WHIP_ROUGH_PCT = 130;

/* ------------------------------------------------------------ pure helpers */
function whipFlat(k){ return [k, k, k, k]; }
function whipAll(v){ return [v, v, v, v]; }
function whipEveryShared(shared){
  for(var i = 0; i < shared.length; i++) if(!shared[i]) return false;
  return true;
}
function whipSharedCount(shared){
  var n = 0, i;
  for(i = 0; i < shared.length; i++) if(shared[i]) n++;
  return n;
}
function whipNum(v){ return String(Math.round(v * 10) / 10); }
function whipPctText(a){ return (a > 0 ? "+" : "") + (Math.round(a * 10) / 10) + "%"; }
function whipWeekLabels(){
  var out = [], i;
  for(i = 0; i < WHIP_WEEKS; i++) out.push(String(i + 1));
  return out;
}

/* One run of the chain, with everything the screen prints derived from it. */
function whipScene(ks, shared){
  var run  = whipRun(WHIP_DEMAND, ks, shared);
  var cost = whipCost(run, ks, WHIP_BASE, WHIP_HOLD_PER_UNIT_WEEK, WHIP_SHORT_PER_TIER_WEEK, WHIP_WEEKS);
  var peaks = [], troughs = [], amps = [], i;
  for(i = 0; i < ks.length; i++){
    peaks.push(whipPeak(run, i));
    troughs.push(whipTrough(run, i));
    amps.push(Math.round((whipPeak(run, i) - WHIP_BASE) / WHIP_BASE * 1000) / 10);
  }
  return { run:run, cost:cost, peaks:peaks, troughs:troughs, amps:amps,
           shortWeeks:run.shortWeeks, amp:whipAmplification(run, WHIP_BASE) };
}

/* The settings the chain arrives on, which is also the run round five is
   compared against: every tier cautious, nobody sharing anything. */
function whipToday(){ return whipScene(whipFlat(WHIP_K_START), whipAll(false)); }

/* How many times its normal week a tier is asked for, on the chain as it
   arrives. Used in the briefing, where a figure nobody can check is worthless. */
function whipTimesNormal(tier){
  return whipNum(Math.round(whipToday().peaks[tier] / WHIP_BASE * 10) / 10);
}

/* The marking rule, in the order the board stated it. */
function whipScore(ks, shared){
  var s = whipScene(ks, shared), total = s.cost.total;
  if(total <= WHIP_FULL && whipEveryShared(shared)) return 6;
  if(total <= WHIP_PART) return 4;
  if(whipEveryShared(shared)) return 3;
  if(total < WHIP_SOFT) return 2;
  if(total < whipToday().cost.total) return 1;
  return 0;
}

/* The total buffer a set of sliders holds, and the weeks in which a tier's
   order book falls to nothing. Both are read off the run rather than typed in,
   so the sentences built from them cannot drift away from the chart. */
function whipSum(ks){
  var t = 0, i;
  for(i = 0; i < ks.length; i++) t += ks[i];
  return Math.round(t * 10) / 10;
}
function whipZeroWeeks(scene, tier){
  var out = [], i, row = scene.run.series[tier];
  for(i = 0; i < row.length; i++) if(row[i] === 0) out.push(i + 1);
  return out;
}

/* Small numbers are written as words in this game, and a run of week numbers
   is written the way a person would say it. Both are built here rather than
   typed into a sentence, because the model decides how many there are. */
function whipCountWord(n){
  var words = ["no", "one", "two", "three", "four", "five", "six"];
  return words[n] || String(n);
}
function whipCap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function whipWeekList(weeks){
  if(!weeks.length) return "";
  if(weeks.length === 1) return String(weeks[0]);
  return weeks.slice(0, weeks.length - 1).join(", ") + " and " + weeks[weeks.length - 1];
}

/* What a tier was asked for, week by week: the shelf for the first tier, and
   the tier below's order book for every other one. */
function whipIncoming(scene, tier){
  return tier === 0 ? WHIP_DEMAND.slice() : scene.run.series[tier - 1].slice();
}
/* The biggest week-on-week rise a tier has to absorb. This is what decides
   whether its buffer was enough, so it is the number the explanation compares
   a slider against rather than comparing a multiplier with a count of units. */
function whipBiggestJump(scene, tier){
  var inc = whipIncoming(scene, tier), mx = 0, i;
  for(i = 1; i < inc.length; i++) if(inc[i] - inc[i - 1] > mx) mx = inc[i] - inc[i - 1];
  return Math.round(mx * 10) / 10;
}
/* One week of one tier's arithmetic, so the page can show its working. */
function whipTrace(scene, ks, tier, week){
  var inc  = whipIncoming(scene, tier);
  var cur  = inc[week], prev = week ? inc[week - 1] : inc[0];
  var raw  = Math.round((cur + ks[tier] * (cur - prev)) * 10) / 10;
  return { cur:cur, prev:prev, k:ks[tier], raw:raw, out:scene.run.series[tier][week] };
}

/* The full week-by-week picture of one run, used by the second question so the
   reader can check a zero by hand. */
function whipSeriesTableHtml(scene){
  var head = '<tr><th>Line</th>', i, t;

           reader's hand is the middle one. Everything printed here is read off
           whipScene, so nothing on this panel is a figure typed in because it
           sounded right. */
        var meTier     = 1;
        var millTier   = WHIP_TIERS.length - 1;
        var shelfK     = WHIP_K_STEADY;
        var darkK      = WHIP_K_START;
        var darkShared = [true, true, false, false];

        var kThin = 0.2, kSteady = WHIP_K_STEADY, kCautious = WHIP_K_START, kMax = WHIP_K_MAX;

        function rScene(k){ return whipScene([shelfK, k, darkK, darkK], darkShared); }
        /* One tier's twelve weeks. The other three sliders are not the
           reader's this spring, so quoting the whole chain's bill would be
           quoting somebody else's decisions back at them. */
        function rCarry(k){

        var myJump    = whipNum(whipBiggestJump(rScene(kSteady), meTier));
        var shelfJump = whipNum(whipBiggestJump(rScene(kSteady), 0));
        var millJumpC = whipNum(whipBiggestJump(rScene(kCautious), millTier));
        var millJumpM = whipNum(whipBiggestJump(rScene(kMax), millTier));

        host.appendChild(el("div", { class:"msg" },
          '<p class="who">Dominic Ferreira, supply chain manager</p>' +
          '<p class="body">&ldquo;The compressor maker has been bought by a group with a policy of ' +

          { id:"steady", label:"k = " + whipNum(kSteady),

        ];

        repairPills(host,

          opts, "steady",
          function(ok, label, why){
            done(ok, "You said &ldquo;" + esc(label) + "&rdquo;.",

              "have.</p>");
          });
      }
    });

    redraw();

    /* ------------------------------------------------- reading the chart
       Fixed reference data: the chain as it arrived, whatever the reader has
       since done to the sliders. */
    var todayScene = whipToday();
    var toldToShip = 2;                                   /* the compressor maker's order book */
    var deadWeeks = whipZeroWeeks(todayScene, toldToShip);
    var readCard = el("div", { class:"qcard" });
    /* The heading and the stem count the zeros the model actually produced

    readCard.innerHTML =
      "<p><b>" + whipCap(whipCountWord(deadWeeks.length)) +

      "arrived on &mdash; every k at " + whipNum(WHIP_K_START) + ", nobody sharing anything &mdash; the " +
      "order placed on the copper tube mill is <b>zero</b> in week" +

      whipSeriesTableHtml(todayScene);
    board.appendChild(readCard);

    /* Four options of roughly one length. A reader who has learned that the

    var readOpts = [
    { id:"stop",  label:"Demand at the shelf collapsed, and the chain simply passed that on" },

        label:"Everyone upstream over-ordered in week 5 and is now working the excess off" },

  ];
    var readGroup = pillGroup(readCard, readOpts, "", function(v){ if(v) q.mark("read"); });
    q.register("read", readCard, 3, function(){
      var v = readGroup.value, ok = v === "work";
      var ksToday = whipFlat(WHIP_K_START);
      var dead1 = deadWeeks[0] - 1;                    /* the first zero week, as an index */
      var t2 = whipTrace(todayScene, ksToday, 2, dead1);   /* the compressor maker */
      var t3 = whipTrace(todayScene, ksToday, 3, dead1);   /* the mill's own order */

      var why =
        "<p><b>Week 5 is the whole answer.</b> The shelf went from " + whipNum(WHIP_DEMAND[3]) + " to " +
        whipNum(WHIP_DEMAND[4]) + " &mdash; " + whipNum(WHIP_DEMAND[4] - WHIP_DEMAND[3]) +
        " units. The shelf ordered " +
        whipNum(todayScene.run.series[0][4]) + ". The plant, seeing its own order book jump by " +
        whipNum(todayScene.run.series[0][4] - todayScene.run.series[0][3]) + ", ordered " +
        whipNum(todayScene.run.series[1][4]) + ". The compressor maker ordered " +
        whipNum(todayScene.run.series[2][4]) + ". Every one of them is now holding stock against a " +
        "wobble that has already finished.</p>" +

        "<p><b>Here is week " + deadWeeks[0] + ", in full.</b> The compressor maker was asked for " + whipNum(t2.cur) +
        " having been asked for " + whipNum(t2.prev) + " the week before, so the rule gives " +
        whipNum(t2.cur) + " + " + whipNum(t2.k) + " &times; (" + whipNum(t2.cur) + " &minus; " +
        whipNum(t2.prev) + ") = <b>" + whipNum(t2.raw) + "</b>. You cannot order a negative number of " +
        "copper tubes, so it is floored at <b>" + whipNum(t2.out) + "</b>. The mill is told to ship " +
        "nothing, and passes the same thing on: " + whipNum(t3.cur) + " + " + whipNum(t3.k) +
        " &times; (" + whipNum(t3.cur) + " &minus; " + whipNum(t3.prev) + ") = " + whipNum(t3.raw) +
        ", floored at " + whipNum(t3.out) + ". Nobody decided this. The arithmetic did.</p>" +

        "<p><b>Week " + deadWeeks[1] + " is the same event on the way down.</b> The shelf goes back to " +
        whipNum(WHIP_DEMAND[8]) + " after four weeks at " + whipNum(WHIP_DEMAND[7]) +
        ", every order book falls, and each tier subtracts " + whipNum(WHIP_K_START) +
        " times that fall from an order that was already smaller. The mill is told to ship nothing " +
        "again.</p>" +

        "<p><b>And week " + deadWeeks[2] + " has a cause of its own, which is the cheapest of the " +

        whipNum(WHIP_DEMAND[10] - WHIP_DEMAND[9]) + " units above normal, for one week. That alone is " +

        (deadWeeks[2] - 1) + ". When the shelf drops back to " + whipNum(WHIP_DEMAND[11]) +

        "<p>That is what the far end of a bullwhip looks like from inside: an order book that goes " +
        "from " + whipNum(todayScene.run.series[2][10]) + " to " +
        whipNum(todayScene.run.series[2][11]) + " in consecutive weeks, for a product whose customers " +
        "never bought fewer than " + Math.min.apply(null, WHIP_DEMAND) + " in any week of the quarter. " +
        "It is why suppliers at the top of a chain keep excess capacity they cannot bill for, and why " +

        (v === "stop"
          ? "<p><b>Demand at the shelf did not collapse.</b> The printed series is right there: " +
            WHIP_DEMAND.join(", ") + ". It never goes below " + Math.min.apply(null, WHIP_DEMAND) +
            ". The zeros are four tiers of ordering behaviour, not four tiers of failing cabinets.</p>"
          : v === "miss"
          ? "<p><b>Nothing in this model is about delivery.</b> There is no lead time, no lorry and no " +

          : v === "round"
          ? "<p><b>The zeros are exactly what the rule produces</b>, and the arithmetic above is the " +

            " &minus; " + whipNum(t2.prev) + ") = " + whipNum(t2.raw) + ", and an order cannot be " +

        '<p class="chapter-note">The chapter\'s warning about this is blunt: when firms in a network do ' +

    });

    /* ------------------------------------------- the strategy the board set */
    var stratCard = el("div", { class:"qcard" });
    stratCard.innerHTML =
      "<p><b>The board has declared a strategy.</b> Which supply chain fits it?</p>" +
      '<div class="msg"><p class="who">Board minute, item 4</p>' +
      '<p class="body">&ldquo;We will win the spare parts business on next-day availability, and we ' +

      '<p class="small muted">' + FIRM.name + " carries a " + FIRM.spares.toLocaleString() +

    board.appendChild(stratCard);

    var stratOpts = [
      { id:"effic",  title:"Build for efficiency",
        note:"A single inventory source and less inventory &middot; special-purpose facilities, fewer " +

      { id:"effect", right:true, title:"Build for effectiveness",
        note:"More inventory and several sources for each part &middot; general-purpose facilities, " +

      { id:"both",   title:"Build for both",
        note:"Take the cheap option in procurement and the responsive one in transportation, so the " +

    ];

      if(chosen.length) q.mark("strategy");
    }});
    q.register("strategy", stratCard, 3, function(){
      var v = stratStack.chosen[0], ok = v === "effect";
      var why =
        "<p><b>The two words, defined.</b> <b>Supply chain effectiveness</b> is the extent to which a " +
        "company's supply activities meet the requirements of the external partners involved &mdash; can " +
        "the dealer have the part tomorrow morning. <b>Supply chain efficiency</b> is the extent to " +
        "which the company optimizes the use of resources in those activities &mdash; what the part cost " +
        "to hold, move and handle. Focusing on one at the expense of the other produces either excessive " +
        "cost or needs that go unmet, so the chain has to be matched to the competitive strategy rather " +
        "than picked on its own merits.</p>" +

        "<p><b>Next-day availability, and not competing on price, is a differentiation strategy.</b> A " +
        "firm pursuing superior customer service builds for <b>effectiveness</b>: more inventory and " +
        "multiple inventory sources so a part is never one supplier away from being unavailable; " +
        "general-purpose facilities, more facilities and higher excess capacity so an unusual order can " +
        "be absorbed; more warehouses and faster delivery times so the part is already near the dealer. " +

        "<p><b>The other column is not a worse supply chain.</b> A single inventory source, less " +

        "The error is never which column you chose in the abstract; it is choosing a column that does " +

        (v === "effic"

          : "") +
        (v === "both"
          ? "<p>This is the answer that sounds sophisticated and is the trap. The chapter does invite " +

            "procurement to save money is exactly what makes next-day availability fail, because the " +

    /* ------------------------------------------------- the deal on the table */

             "guessing." }
  ];
    var dealStack = optionStack(dealCard, dealOpts, { onChange: function(chosen){
      if(chosen.length) q.mark("deal");
    }});
    q.register("deal", dealCard, 4, function(){
      var v = dealStack.chosen[0];
      var points = v === "take" ? 4 : v === "risk" ? 2 : v === "data" ? 1 : 0;
      var mill = WHIP_TIERS.length - 1;
      var steady = whipScene(whipFlat(WHIP_K_STEADY), whipAll(true));

      var why =
        "<p><b>What they are describing has a name.</b> <b>Vendor-managed inventory</b> is an " +
        "arrangement in which the supplier manages the customer's inventory on the customer's behalf, " +
        "based on <b>negotiated service levels</b>. It is made possible by the customer allowing the " +
        "supplier to monitor stock levels and ongoing sales data. That is this deal, word for word.</p>" +

        "<p><b>Both ends gain, which is why it exists.</b> The retailer optimises its inventory &mdash; " +

/* The register itself: deterministic, so every run of the page and every run of

function r6Register(){

  var total = 0;

var R6_WELD_WEEKS = [5, 6];

function r6WeldRows(){
  var out = [], i;
  for(i = 0; i < R6_REG.length; i++){

/* The compressor lots those cabinets happen to have been built out of, biggest

function r6WeldLots(){
  var rows = r6WeldRows(), counts = {}, out = [], i;
  var k;
  for(i = 0; i < rows.length; i++) counts[rows[i].lot] = (counts[rows[i].lot] || 0) + 1;
  for(k in counts){ if(counts.hasOwnProperty(k)) out.push({ lot:k, n:counts[k] }); }
  out.sort(function(a, b){ return b.n - a.n; });

/* How the names on the register divide across the welder's two weeks. If the

function r6WeldCustomers(){
  var rows = r6WeldRows(), inside = {}, all = {}, out = { names:0, mixed:0 }, i, k;

/* What one cabinet costs to bring back: collect it, replace the compressor,

var R6_PER_UNIT = 1940;
var R6_GOODWILL = 260;

  manual: {
    title: "Supply chain execution: three flows, three doors",
    body:
      "<p><b>Supply chain planning</b> is deciding what should happen. <b>Supply chain execution</b> is " +
      "putting that plan into motion, and it manages three key elements: <b>product flow</b>, " +
      "<b>information flow</b> and <b>financial flow</b>.</p>" +
      "<ul class=\"tight\">" +
      "<li><b>Product flow</b> is the movement of goods from the supplier to production, from production " +
      "to distribution, and from distribution to the consumer. Products mostly flow one way, but an " +
      "effective system also supports returns. <b>Reverse logistics</b> is the processes in place to " +
      "efficiently receive products back from the point of consumption &mdash; so valuable materials can " +
      "be recycled, hazardous ones properly disposed of, and, where goods arrive excessive or defective, " +
      "replacements shipped or accounts credited.</li>" +
      "<li><b>Information flow</b> is the movement of information along the chain: order processing, " +
      "delivery status updates, and so on. Like product, it can move up or down the chain as needed. The " +
      "key element is the complete removal of paper documents &mdash; sharing orders, fulfilment and " +
      "billing electronically saves paperwork, time and money, and everybody needs continuous access to " +
      "current data. <b>EDI</b> is computer-to-computer communication to an agreed standard, once run " +
      "over dedicated networks and now over the internet, which is why a small firm can do it at all. " +
      "<b>XML</b> tags data so an application at the other end knows what each value means.</li>" +
      "<li><b>Financial flow</b> is primarily the movement of financial assets along the chain, plus the " +
      "information attached to it: payment schedules, consignment, who owns what. Business-to-business " +
      "payment is slower and older than consumer payment; letters of credit are common on large " +
      "international purchases because they reduce credit risk.</li>" +
      "</ul>" +
      "<p><b>Portals</b> are access points &mdash; front doors &mdash; through which a business partner " +
      "reaches secured, proprietary information, usually over an extranet, and unlike a consumer shop " +
      "the partner is prescreened before they are given a key. A <b>supplier portal</b> is owned by a " +
      "downstream company and automates purchasing from many suppliers: one buyer, many suppliers. A " +
      "<b>customer portal</b> is owned by an upstream company and automates selling to many buyers: one " +
      "supplier, many buyers. A <b>B2B marketplace</b> is run by a third party, brings many buyers and " +
      "many sellers together, often inside one industry &mdash; a <b>vertical market</b> &mdash; and " +
      "earns a commission on each transaction.</p>" +
      "<p>Running underneath all of it is <b>supply chain visibility</b>: being able to track goods as " +
      "they move and to foresee events that will disturb them. Sensors on a trailer reporting position " +
      "and temperature are visibility; so is knowing which parts went into which finished product.</p>" +
      "<p>The chapter takes that last point somewhere specific: <b>product recalls</b>. A supply network " +
      "has tens or hundreds or thousands of players in it, so there are countless places a shortcut can " +
      "be taken or a standard missed, and sometimes nobody notices until the product is in front of the " +
      "person who bought it. What saves a company then is having the information to <b>trace back the " +
      "movement of products through the supply chain</b> and single out the problematic link. Usually " +
      "only some <b>batches</b> are affected &mdash; one component, from one supplier, on one run. A " +
      "company that cannot clearly identify the affected batches has to make the recall much broader, " +
      "and that costs it much more, in goodwill as well as in money, than recalling the affected " +
      "batches would have. Which is why the chapter's advice is to store the data now, against a " +
      "problem you have not had yet.</p>" +
      "<p><b>How the information actually moves.</b> Before the web, companies exchanged business documents by <b>electronic data interchange</b> (EDI): computer-to-computer communication, with no human in the middle, following a standard set by a national or international standards body. It ran over dedicated telecommunication networks, which meant only large corporations could afford it. The internet made it cheap, so small and mid-sized firms use it too, and large retailers now simply require their suppliers to send things like advance shipping notices over web-based EDI.</p>" +
      "<p>Today the data inside those messages is usually <b>XML</b> or <b>JSON</b>. XML uses tags, like the HTML of a web page but for data rather than layout: a tag says how the thing between it should be interpreted, so an item number arrives labelled as an item number. JSON uses key and value pairs instead; it is simpler, faster to process and more common between apps. Both travel through <b>application programming interfaces</b>, which are how one piece of software offers its data and its functions to another.</p>" +
      "<p><b>Seeing and measuring.</b> <b>Supply chain visibility</b> is being able to track products as they move and to foresee outside events: where a shipment is right now, where a supplier's factory is and whether a typhoon is heading for it, when a key supplier's labour contracts expire. Sensors and on-board telematics have made a lot of this routine &mdash; a temperature log proves a chilled load stayed chilled, a tamper alert says a container was opened. <b>Supply chain analytics</b> is the use of key performance indicators to monitor the whole chain, sourcing to distribution: which suppliers keep missing promised dates, where the bottleneck is, whether to spread an order over two suppliers. Both require a level of information sharing that requires real trust between the partners, which is the thing that most often stops them.</p>"
  },

function ltvMerged(){ return LTV.asTradingName + LTV.asSiteAddress; }
function ltvClears(merged){
  /* How many of the records on file clear the top-twenty line. */
  if(merged) return ltvMerged() >= LTV.topTwentyLine ? 1 : 0;
  var n = 0;
  if(LTV.asTradingName >= LTV.topTwentyLine) n++;

function deskLever(id){
  for(var i = 0; i < DESK_LEVERS.length; i++) if(DESK_LEVERS[i].id === id) return DESK_LEVERS[i];

function deskPreset(ids){
  var on = {}, i;

  return on;
}

/* The whole console, as one pure function.

   The first argument is a map of lever id to true. mergeNeeded says whether
   the biggest account is on file twice, and merged says whether the reader
   paid to fix it.
   A 360-degree view of a customer who is two customers is not a 360-degree
   view, so on that combination the lever is bought and does nothing. */
function deskModel(on, mergeNeeded, merged){
  var fcr = DESK.baseFCR, self = DESK.baseSelf, abandon = DESK.baseAbandon;
  var spend = 0, blocked = false;

  if(on.kb){ fcr += 0.07; self += 0.22; spend += deskLever("kb").cost; }
  if(on.bot){
    self += 0.14;
    /* A chatbot with a knowledge base behind it can answer. Without one it can
       only deflect, which adds a hop and sends the caller back round. */
    fcr += on.kb ? 0.04 : -0.03;
    spend += deskLever("bot").cost;
  }
  if(on.agents){ abandon -= 0.06; spend += deskLever("agents").cost; }
  if(on.callback){ abandon -= 0.07; spend += deskLever("callback").cost; }
  if(on.oneview){
    spend += deskLever("oneview").cost;
    if(mergeNeeded && !merged) blocked = true;
    else fcr += 0.09;
  }

  fcr = Math.min(fcr, DESK.fcrCap);
  self = Math.min(self, DESK.selfCap);
  abandon = Math.max(abandon, DESK.abandonFloor);

  var selfIssues = DESK.issues * self;
  /* A problem that is not resolved comes back. That is the whole round: at 61
     per cent resolution, 42,000 problems make nearly 62,000 contacts. */
  var assisted = (DESK.issues - selfIssues) / fcr;
  var monthly = assisted * DESK.assistedCost + selfIssues * DESK.selfCost;
  var abandoned = assisted * abandon;
  var lostOrders = abandoned * DESK.lostShare;
  var lostValue = lostOrders * DESK.lostOrderValue;
  var annual = monthly * DESK.months + lostValue * DESK.months + spend;

  return {
    fcr: fcr, self: self, abandon: abandon, spend: spend, blocked: blocked,
    selfIssues: selfIssues, assisted: assisted, monthly: monthly,
    abandoned: abandoned, lostOrders: lostOrders, lostValue: lostValue,
    annual: annual
  };
}

/* Today, before anything is switched on. Every saving on the page is measured

        '<div class="row"><span>Handling cost</span><b>' + dollars(m.monthly) + " a month</b></div>" +
        '<div class="row"><span>Callers who give up waiting</span><b>' +
          Math.round(m.abandoned).toLocaleString() + " &middot; " + pct(m.abandon * 100) + "</b></div>" +
        '<div class="row"><span>Orders lost with them</span><b>' +
          Math.round(m.lostOrders).toLocaleString() + " a month &middot; " + dollars(m.lostValue) +
          "</b></div>" +
        '<div class="row"><span>Committed to the desk</span><b>' + dollars(m.spend) + "</b></div>" +
        (merged ? '<div class="row"><span>Merging the duplicate records</span><b>' + dollars(MERGE_COST) +
          "</b></div>" : "") +
        '<div class="row"><span>Against today</span><b>' +
          (saving >= 0 ? money(saving) + " a year saved" : money(-saving) + " a year worse") + "</b></div>";
      if(m.blocked){
        html += '<div class="row"><span>One view of the customer</span><b>bought, and blind</b></div>';
      }
      cons.innerHTML = html;
    }
    drawConsole();

    var lockRow = el("div", { class:"right-row" });
    var lockBtn = el("button", { type:"button", class:"btn" }, "Mark this answer");
    lockBtn.addEventListener("click", function(){
      if(deskLocked) return;
      q.mark("desk2");
    });
    lockRow.appendChild(lockBtn);
    dCard.appendChild(lockRow);

    q.register("desk2", dCard, 4, function(){
      deskLocked = true;
      lockBtn.disabled = true;
      for(var k in swNodes){ if(swNodes.hasOwnProperty(k)) swNodes[k].disabled = true; }

      var m = deskModel(deskOn, mergeNeeded, merged);
      var today = deskToday();
      var pts = deskScore(m.annual);
      self.deskFinal = m;

      var kbOnly = deskModel(deskPreset(["kb"]), mergeNeeded, merged);
      var botOnly = deskModel(deskPreset(["bot"]), mergeNeeded, merged);
      var agentsOnly = deskModel(deskPreset(["agents"]), mergeNeeded, merged);
      var cbOnly = deskModel(deskPreset(["callback"]), mergeNeeded, merged);
      var bothOnly = deskModel(deskPreset(["kb", "bot"]), mergeNeeded, merged);
      var best = deskModel(deskPreset(["kb", "bot", "oneview", "callback"]), mergeNeeded, true);
      var everything = deskModel(deskPreset(["kb", "bot", "oneview", "callback", "agents"]), mergeNeeded, true);

      var why =
        "<p><b>First-contact resolution is a multiplier on volume, not a satisfaction score.</b> A " +
        "problem that is not resolved comes back, so at " + pct(today.fcr * 100) + " resolution the " +
        DESK.issues.toLocaleString() + " problems that arrive each month generate about <b>" +
        Math.round(today.assisted).toLocaleString() + " contacts</b>. That gap is the whole bill. " +
        "Raising resolution does not make each call cheaper; it deletes the second and third call " +
        "entirely.</p>" +
        "<p><b>Do nothing: " + money(today.annual) + " a year.</b> Every other line on this page is " +
        "measured against that.</p>" +
        "<p><b>Twelve more agents: " + money(agentsOnly.annual) + ".</b> The instinctive answer, and it " +
        "does not touch the problem. Resolution is unchanged, so the number of contacts is unchanged at " +
        Math.round(agentsOnly.assisted).toLocaleString() + " &mdash; you have shortened the queue for a " +
        "call that should not have been made twice, and paid " + money(deskLever("agents").cost) +
        " to do it. It is the most expensive switch on the console, and the one rate it does move " +
        "&mdash; callers who give up waiting, " + pct(today.abandon * 100) + " down to " +
        pct(agentsOnly.abandon * 100) + " &mdash; is the same rate keep-your-place call-back takes to " +
        pct(cbOnly.abandon * 100) + " for " + money(deskLever("callback").cost) + ".</p>" +
        "<p><b>The knowledge base alone: " + money(kbOnly.annual) + ".</b> Resolution goes to " +
        pct(kbOnly.fcr * 100) + " and the self-service share to " + pct(kbOnly.self * 100) + ", and " +
        "contacts fall to " + Math.round(kbOnly.assisted).toLocaleString() + " a month. The chapter's " +
        "version of this is a customer engagement centre with self-service diagnostic tools that guide " +
        "customers to the information they need.</p>" +
        "<p><b>The chatbot alone: " + money(botOnly.annual) + ", and resolution falls to " +
        pct(botOnly.fcr * 100) + ".</b> This is the trap on the console. A chatbot deflects contacts " +
        "whether or not it can resolve them, so on its own it adds a hop and sends people back round. " +
        "The chapter states the job precisely: a chatbot initiates the conversation and gathers " +
        "preliminary information <b>in order to solve issues directly or route the user to the relevant " +
        "human</b>. Deflection is not resolution. With a knowledge base behind it the same switch is " +
        "worth " + pct((bothOnly.fcr - kbOnly.fcr) * 100) + " of resolution instead of costing " +
        pct((today.fcr - botOnly.fcr) * 100) + ", and the pair comes to " + money(bothOnly.annual) +
        ".</p>" +
        "<p><b>The best plan on this console is " + money(best.annual) + ":</b> knowledge base, chatbot, " +
        "one view of the customer and keep-your-place call-back. Resolution " + pct(best.fcr * 100) +
        ", contacts " + Math.round(best.assisted).toLocaleString() + " a month, " +
        money(today.annual - best.annual) + " a year better than doing nothing. Add the twelve agents " +
        "to it and the bill goes <i>up</i> to " + money(everything.annual) + ", because their whole " +
        "contribution is to a number &mdash; abandoned calls &mdash; that call-back has already taken " +
        "most of.</p>" +
        "<p>Call-back is the cheapest switch here for a reason. The chapter gives the example of an " +
        "airline whose callers could choose between holding and being rung back when an agent was free: " +
        "it " +
        "saved millions of toll minutes in a year, cut abandoned calls, and every call that was not " +
        "abandoned was another chance to sell a ticket. That last part is why abandoned contacts carry " +
        "an order value on this console at all.</p>";

      if(mergeNeeded){
        if(m.blocked){
          why += "<p><b>You bought one view of the customer and it is blind.</b> " + BUYERS.groups[0] +
            " is still two records, so the 360-degree view shows you " + dollars(LTV.asTradingName) +
            " of a customer, and " + dollars(LTV.asSiteAddress) + " of the same customer, and never " +
            dollars(ltvMerged()) + " of one. The " + money(deskLever("oneview").cost) +
            " bought nothing. The chapter's line is that " +
            "modern systems merge identities precisely because one person, or one company, arrives down " +
            "many channels under many names. Merging was " + money(MERGE_COST) + ".</p>";
        } else if(merged){
          why += "<p><b>You merged the records.</b> " + BUYERS.groups[0] + " is one customer worth " +
            dollars(ltvMerged()) + " instead of two that clear nothing, and every report that asks for " +
            "the top twenty can see the biggest buyer in the company again. " + money(MERGE_COST) +
            ", caused by one step run in the wrong order in round one.</p>";
        } else {
          why += "<p><b>The duplicate is still there.</b> It cost you nothing today because you did not " +
            "buy the one view that would have tripped over it. It costs you every time somebody asks " +
            "what " + BUYERS.groups[0] + " is worth, and gets " + dollars(LTV.asTradingName) + ".</p>";
        }
      } else {
        why += "<p>One thing you never had to pay for: every buying group is one record on your customer " +
          "list, so the 360-degree view is a view of a whole customer. That is round one, still paying " +
          "out six rounds later.</p>";
      }

      why += "<p>And the reason " +
        (m.spend > 0 ? "any of this is worth " + money(m.spend)
                     : "leaving every switch off is not the safe choice it looks like") +
        ": marketing researchers have found that winning back a customer who has gone elsewhere can " +
        "cost <b>" + WINBACK.low + " to " + WINBACK.high + " times</b> as much as keeping a current one " +
        "satisfied. Not a percentage. A multiple, and a large one. Every caller who gives up waiting is " +
        "somebody you may have to buy back at that rate.</p>";

      var chose;
      if(pts === 4) chose = "Annual bill " + money(m.annual) + ", resolution " + pct(m.fcr * 100) + ".";
      else chose = "Annual bill " + money(m.annual) + " against today's " + money(today.annual) +
        ", resolution " + pct(m.fcr * 100) + ".";

      return item("The service desk", chose, pts === 4, pts, 4, why, "8.5");
    });

    /* ------------------------------------------------------- the commit */
    self.refreshCommit = function(){
      var left = q.remaining();
      var note;
      if(left === 0) note = "All four answered";
      else if(!q.isAnswered("forces") && fBoard.remaining() > 0){
        note = fBoard.remaining() + " exhibit" + (fBoard.remaining() === 1 ? "" : "s") + " still in the tray";
      } else note = left + " question" + (left === 1 ? "" : "s") + " left";
      enableCommit(left === 0, note);
    };
    self.deskState = function(){
      return { on: deskOn, merged: merged, mergeNeeded: mergeNeeded };
    };
  },

  submit: function(){
    var st = this.deskState ? this.deskState() : { on:{}, merged:false, mergeNeeded:false };
    var m = this.deskFinal || deskModel(st.on, st.mergeNeeded, st.merged);
    var today = deskToday();
    var saving = today.annual - m.annual;
    var outlay = m.spend + (st.merged ? MERGE_COST : 0);

    game.carry.fcr = m.fcr;

    var summary =
      "Your service desk resolves <b>" + pct(m.fcr * 100) + "</b> of problems on the first contact, " +
      "which turns " + DESK.issues.toLocaleString() + " problems a month into <b>" +
      Math.round(m.assisted).toLocaleString() + "</b> contacts somebody has to handle. All in, that is " +
      "<b>" + money(m.annual) + "</b> a year against today's " + money(today.annual) + " &mdash; " +
      (saving > 0 ? money(saving) + " better." : saving === 0 ? "no change." : money(-saving) + " worse.");

    return {
      items: this.q.items(),
      live: true,
      summary: summary,
      cash: -outlay,
      trust: Math.round((m.fcr - DESK.baseFCR) * 40),
      integration: m.blocked ? 2 : (st.on.oneview ? 8 : 3),
      moveWhy: "Cash is what you committed once: " + dollars(m.spend) + " on the desk" +
        (st.merged ? " and " + dollars(MERGE_COST) + " to make your biggest customer one customer" : "") +
        ". The annual figure above is what the desk then costs to run, every year, and nobody charges " +
        "you for it in one go.",
      after: {
        title: "What the three systems were for",
        body:
          "<p>Seven rounds, and the shape of the chapter is now visible from the end of it. A " +
          "<b>business process</b> is an order of operations that runs across departments. A " +
          "<b>value chain</b> says which activity owns which cost. <b>Enterprise resource planning</b> " +
          "puts one integrated database under the internal activities &mdash; the core components: " +
          "financial management, operations management, human resource management. The two <b>extended " +
          "components</b> face outward: <b>supply chain management</b> upstream, towards the people you " +
          "buy from, and <b>customer relationship management</b> downstream, towards the people who buy " +
          "from you.</p>" +
          "<p>Line the five pressures up against them and the fit is not decorative. New entrants and " +
          "supplier power land upstream, where a supply chain system lives. Buyer power lands " +
          "downstream, where customer relationship management lives. Rivalry is answered by whatever " +
          "you are faster or better at than the firm next door, which is what the integrated database " +
          "and the one module you were right to customize are for.</p>" +
          "<p><b>And one of them is answered by none of your systems.</b> Refrigeration as a service is " +
          "a <b>substitute</b>: a different way of getting the same job done. No module on any of the " +
          "three quotes you read in round three cuts that off. It is a decision about what business " +
          "Aldervane is in, taken by people, and the only thing the systems give you is the customer " +
          "data to take it with.</p>" +
          (game.carry.fcr != null
            ? "<p>The board meets next. It will read the score, and it will read the list of what " +
              "followed you here from every round you have played: the stale figure, the customized " +
              "module, the recall, the promise, and a service desk that now resolves <b>" +
              pct(game.carry.fcr * 100) + "</b> of problems the first time somebody asks.</p>"
            : "")
      }
    };
  }
});
/* ============================================================================
   4. THE BOARD'S VERDICT
   ========================================================================== */
function verdictFor(percent){
  for(var i = 0; i < ENDINGS.length; i++) if(percent >= ENDINGS[i].min) return ENDINGS[i];
  return ENDINGS[ENDINGS.length - 1];
}

function showReview(){
  game.done = true;
  refreshMeters();
  clearStage();

  var byLo = {};
  Object.keys(LOS).forEach(function(k){ byLo[k] = { got:0, max:0 }; });
  var misses = [];
  game.ledger.forEach(function(it){
    var lo = byLo[it.lo] ? it.lo : "8.2";
    byLo[lo].got += it.points;
    byLo[lo].max += it.max;
    if(it.points < it.max) misses.push(it);
  });
  var total = scoreSoFar();
  var percent = total.max ? Math.round(total.got / total.max * 100) : 0;
  var ending = verdictFor(percent);

  var head = el("div", { class:"brief" });
  head.innerHTML =
    '<p class="from">The board, at the end of the programme</p>' +
    '<div class="ending"><span class="rank">' + esc(ending.rank) + "</span>" +
    "<h2>" + esc(ending.title) + "</h2></div>" +
    "<p>" + esc(ending.body) + "</p>" +
    "<p>You scored <b>" + total.got + " out of " + total.max + " points</b> &mdash; " + percent + "% &mdash; " +
    "finishing with " + money(game.cash) + " of the " + money(START.cash) + " you were given, trust at " +
    game.trust + " out of 100, and integration at " + game.integration + ".</p>" +
    (game.cash < 0 ? "<p><b>You finished over budget.</b> Every dollar of that was a decision, and the ledger below says which.</p>" : "");
  stage.appendChild(head);

  var lo = el("div", { class:"panel" });
  var loHtml = "<h2>Where you stand, by objective</h2>" +
    "<p class=\"small muted\">Reported per objective rather than as one number, because an average hides " +
    "the one you should reread.</p>";
  Object.keys(LOS).forEach(function(k){
    var b = byLo[k];
    var p = b.max ? Math.round(b.got / b.max * 100) : 0;
    var cls = b.max === 0 ? "" : p >= 80 ? "ok" : p >= 55 ? "mid" : "no";
    var verdict = b.max === 0 ? "Not reached" : p >= 80 ? "Solid" : p >= 55 ? "Shaky" : "Reread";
    loHtml += '<div class="score-line"><span class="lbl">Objective ' + k + '</span>' +
      '<span class="bar"><i class="' + cls + '" style="width:' + p + '%"></i></span>' +
      '<span class="val">' + b.got + "/" + b.max + " &middot; " + verdict + "</span></div>" +
      '<p class="small muted" style="margin:0 0 10px 0">' + esc(LOS[k]) + "</p>";
  });
  lo.innerHTML = loHtml;
  stage.appendChild(lo);

  var carryPanel = el("div", { class:"panel" });
  carryPanel.innerHTML = "<h2>What followed you</h2>" +
    "<p>Nothing in this programme reset. This is the chain:</p>" +
    '<ul class="tight ledger">' + carryLines().join("") + "</ul>";
  stage.appendChild(carryPanel);

  if(misses.length){
    var m = el("div", { class:"panel" });
    var mh = "<h2>Every decision that cost you, and why</h2>" +
      "<p class=\"small muted\">" + misses.length + " of " + game.ledger.length +
      " decisions scored less than full marks.</p>";
    misses.forEach(function(it){
      mh += '<div class="qcard"><p><span class="tag ' + (it.points === 0 ? "no" : "mid") + '">Round ' +
        it.round + " &middot; " + it.points + "/" + it.max + "</span> <b>" + it.label + "</b></p>" +
        '<p class="small">' + it.chose + "</p>" +
        '<p class="qwhy">' + it.why + "</p></div>";
    });
    m.innerHTML = mh;
    stage.appendChild(m);
  } else {
    var perfect = el("div", { class:"panel" });
    perfect.innerHTML = "<h2>Nothing to reread</h2><p>Every decision scored full marks. " +
      "Play it again with different choices to see what the other branches cost &mdash; several of them are " +
      "more instructive than the right answer.</p>";
    stage.appendChild(perfect);
  }

  var run = { percent:percent, got:total.got, max:total.max, cash:game.cash,
              trust:game.trust, ending:ending.title };
  var isBest = saveBest(run);
  var best = loadBest();

  var close = el("div", { class:"panel" });
  var claimRows = "";
  for(var c = 0; c < CLAIMS.length; c++){
    claimRows += '<tr><td class="num"><b>' + CLAIMS[c].n + "</b></td><td>" + CLAIMS[c].claim + "</td></tr>";
  }
  close.innerHTML = "<h2>What you were actually practising</h2>" +
    "<p>Every round was one claim from the chapter, put somewhere it could cost you something:</p>" +
    '<div class="tblwrap"><table class="data"><thead><tr><th class="num">Round</th><th>The claim</th></tr></thead><tbody>' +
    claimRows + "</tbody></table></div>" +
    (isBest ? "<p><b>That is your best run.</b> It is saved in this browser only.</p>"
            : best ? "<p>Your best run remains " + best.percent + "% (" + best.got + " of " + best.max + ").</p>" : "");
  stage.appendChild(close);

  /* The question the reader answered before they had read anything comes back,
     and this time the answer is computed from what they built. That is the
     whole argument of the chapter in one panel: an integrated company can say
     out loud, on the first call, a number that four departments used to hold
     between them. */
  var loop = el("div", { class:"panel" });
  var c = game.carry;
  var wired = c.latency === 0;
  var clean = !c.phantomStock;
  var owns = c.modules !== null;
  loop.innerHTML =
    "<h2>The question you answered before you read anything</h2>" +
    '<div class="msg"><p class="who">' + esc(DEMO.from) + "</p>" +
    '<p class="body">&ldquo;' + esc(DEMO.text) + "&rdquo;</p></div>" +
    "<p>At the start of this you had one system's number and no way to check it, and the honest answers " +
    "were either to under-promise or to ring somebody back. Here is what the same desk can say now.</p>" +
    (wired && clean
      ? '<div class="callout good"><b class="tagline">&ldquo;Twenty-one now, the rest off Thursday\u2019s ' +
        'run \u2014 I can see it from here.&rdquo;</b><p>You wired what shipped back to the order desk as ' +
        'a live link and you never allocated stock against an order that did not exist, so the figure on ' +
        'the screen is the figure in the building. The chapter has a name for that one line in a table: ' +
        '<b>order promising</b> \u2014 answering a query about availability, cost and delivery date. It ' +
        'is the whole job of an order desk, and it is only possible when the four facts behind it live in ' +
        'one place.</p></div>'
      : '<div class="callout warn"><b class="tagline">&ldquo;Let me check and call you back.&rdquo;</b>' +
        "<p>Still the right answer, and still the wrong situation. " +
        (c.latency > 0
          ? "The stock figure on that desk is <b>" + c.latency + " hours old</b>, because the crossing " +
            "that carries what shipped back to the order desk is " +
            (c.wiring && c.wiring["tail-quote"] === "file" ? "a file that runs overnight" : "a person re-typing it") +
            ". "
          : "") +
        (c.phantomStock
          ? "And " + c.phantomStock + " cabinets still show as free that are on a trailer, because of a " +
            "step that ran out of order in round one. "
          : "") +
        "A person who cannot trust the number in front of them is right to stop, and an enterprise system " +
        "is the arrangement in which they do not have to.</p></div>") +
    "<p class=\"small muted\">Play it again and wire that one crossing differently. It is the cheapest " +
    "thing on this page to change and it is the difference between those two sentences.</p>";
  stage.appendChild(loop);

  /* The two frameworks the rest of this course is built on both appear in this
     chapter, and a reader who has met them elsewhere should be told exactly
     where they turned up rather than left to notice. */
  var fw = el("div", { class:"panel" });
  fw.innerHTML = "<h2>Where the two frameworks turned up</h2>" +
    "<p>This chapter is not a strategy chapter, but both of the frameworks the rest of the course is " +
    "built on run right through it.</p>" +
    "<h3>The value chain</h3>" +
    '<ul class="tight">' +
      "<li><b>Round two</b> was the value chain itself: five core activities and five support " +
      "activities, and eight departmental systems that had to be put on the right one. The activity " +
      "carrying the most money carried almost none of the avoidable cost, which is the thing the chain " +
      "is for.</li>" +
      "<li><b>Round three</b> was the same chain from the other side. The chapter's own note is that " +
      "operations management enables the <i>core</i> activities while financial management and human " +
      "resource management sit with the <i>support</i> ones.</li>" +
      "<li><b>Rounds five and six</b> left the company altogether. When one firm's chain is wired to the " +
      "next firm's chain you have a <b>value system</b>, and the information running up it to suppliers " +
      "and down it to customers is what supply chain management and customer relationship management " +
      "are respectively for.</li>" +
    "</ul>" +
    "<h3>The five competitive forces</h3>" +
    "<p>Round seven was the chapter's own argument, not an import. In five consecutive sentences it " +
    "says the internet lowered the barriers to entry for potential rivals, replaced products with " +
    "digital substitutes, raised the power of buyers who can compare prices instantly, raised the power " +
    "of employees as a source of supply, and handed competitors as much information about your products " +
    "as you have. That is all five forces, and it never once uses the word.</p>" +
    "<p>What the round asked on top of that is the question this whole course keeps asking: <b>which " +
    "force is the system you just bought actually answering?</b> Supply chain management answers " +
    "upstream pressure. Customer relationship management answers downstream pressure. An enterprise " +
    "resource planning system answers neither directly — it makes you cheaper and faster inside, " +
    "which is worth having and is not the same thing.</p>";
  stage.appendChild(fw);

  var row = el("div", { class:"center-row" });
  var again = el("button", { class:"btn primary" }, "Run the programme again");
  again.addEventListener("click", function(){ game = newGame(); showRound(0); });
  row.appendChild(again);
  var home = el("button", { class:"btn" }, "Back to the start");
  home.addEventListener("click", showIntro);
  row.appendChild(home);
  stage.appendChild(row);

  announce("Final result: " + percent + " per cent. " + ending.title + ".");
}

/* ============================================================================
   BOOT
   ========================================================================== */
showIntro();

</script>
