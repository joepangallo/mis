<script>
/* ============================================================================
   ROCKS IN THE RIVER — a learning game for Chapter 8, Enterprise Systems.

   The chapter's own picture of a company that cannot share its data is a river
   with too many rocks in it: the water is there, it just cannot get past the
   obstruction. Seven rounds of taking rocks out, and finding out what each one
   was holding back.

   The whole game is one file with no network of any kind. Everything below is
   plain ES5-flavoured JavaScript so the page runs from a flash drive, a hard
   drive or a static host without a build step.

   Reading order:
     1. DATA    — the objectives, the firm, and the numbers every round runs on.
     2. ENGINE  — meters, the rail, screen routing, marking, the ledger.
     3. ROUNDS  — one builder and one grader per round.
     4. REVIEW  — the board's verdict.

   Nothing on this page asserts a number it did not compute. The contract test
   beside it recomputes every one of them from first principles, so a constant
   tuned to make a screen look better fails the build.
   ========================================================================== */

/* ============================================================================
   1. DATA
   ========================================================================== */

/* The chapter's own five learning objectives. A miss is reported against these
   because they are what a reader goes back and rereads. */
var LOS = {
  "8.1": "Core business processes, and the value chain they run across",
  "8.2": "The role and evolution of enterprise-wide information systems",
  "8.3": "How enterprise resource planning systems improve internal processes",
  "8.4": "How supply chain management systems improve external interactions",
  "8.5": "How customer relationship management systems improve engagement"
};

/* The course objectives this chapter can honestly claim, and the ones it
   cannot. Stated on the opening screen rather than quietly implied. */
var COURSE_OBJECTIVES = {
  claimed: [
    { n: 2, text: "How companies use information systems to manage internal operations and to make decisions." },
    { n: 3, text: "How companies use information technology for competitive advantage by changing their marketplace." },
    { n: 5, text: "How businesses use internet technology for electronic commerce and for working with business partners." },
    { n: 7, text: "Recognising a business problem that information technology could solve, then working with the technical team to deliver it." },
    { n: 8, text: "The individual and organizational consequences of using information technology." }
  ],
  notClaimed: [
    { n: 1, text: "What an MIS department does." },
    { n: 4, text: "Hardware, software, database technology and networks as a working skill." },
    { n: 6, text: "The life cycle of an information system — this game buys and installs one, but how a system is developed and acquired is the next chapter's subject." },
    { n: 9, text: "Security breaches and computer crimes — round three prices an update that cannot be applied, which is a consequence of a decision rather than the subject itself." },
    { n: 10, text: "Building a database application in SQLite." },
    { n: 11, text: "Building a decision support system in a spreadsheet." }
  ]
};

/* --------------------------------------------------------------- the firm
   Every organization, person and figure in this game is invented. Nothing here
   reports the affairs of a real company. */
var FIRM = {
  name: "Aldervane Cold Systems",
  what: "a maker of commercial refrigeration",
  staff: 640,
  plants: 1,
  depots: 2,
  suppliers: 214,
  spares: 1900,
  revenue: 180000000,
  cycleDays: 71,
  ordersMonth: 2400
};

/* The two supermarket buying groups that are most of the order book. They are
   the evidence for round seven's reading of the competitive forces, and they
   are why round five's demand series wobbles at all. */
var BUYERS = {
  share: 61,
  groups: ["Northbrae Markets", "Halverson Foods"]
};

var START = { cash: 4200000, trust: 55, integration: 10 };

var THEME_KEY = "mis-rocks-river-theme-v1";
var BEST_KEY = "mis-rocks-river-best-v1";

/* What each round was really about, printed at the end beside the score. */
var CLAIMS = [
  { n: 1, claim: "A business process is an order of operations, not a matter of taste. Every step that runs early is paid for by a step that runs late — and your selling process is somebody else's buying process." },
  { n: 2, claim: "The value chain says which activity owns a cost. What it does not say is where the data crosses between them, and the crossings are where the money goes." },
  { n: 3, claim: "The vendor quotes the licence. Training, ongoing customization, the process study and governance are the four lines nobody quotes and a third of what you spend — and every module you changed has to be written again at every release." },
  { n: 4, claim: "On hand and available to promise are two different numbers, and which one you can see is decided by how your systems were wired, not by how careful you are." },
  { n: 5, claim: "A small wobble in what customers buy becomes a huge wobble in what suppliers are asked for. You damp it by sharing the demand signal, not by holding more stock." },
  { n: 6, claim: "Goods flow one way, money flows the other, and information has to flow both. A recall is only ever as narrow as your records are precise." },
  { n: 7, claim: "Winning a customer back costs many times what keeping one costs, and every force the chapter says the internet turned up is answered by one of the three systems you just bought — or by none of them." }
];

var ENDINGS = [
  { min:85, rank:"Adopted", title:"The board adopts the programme as the way the company runs",
    body:"Seven rounds of decisions that survived being checked by the people who have to live with them. The systems are no longer an IT project. They are how an order gets from a buyer's phone call to money in the bank." },
  { min:70, rank:"Renewed", title:"The programme is funded for a second phase",
    body:"Not everything worked, and the parts that did not were visible early enough to be stopped before they got expensive. That is what the board was actually buying." },
  { min:52, rank:"Retained", title:"You keep the programme, and gain a steering committee",
    body:"Enough went right that the work continues, and enough went wrong that somebody else now signs the next module off. Both of those are fair." },
  { min:34, rank:"Under review", title:"The programme is placed under review",
    body:"An outside firm has been engaged to look at how these decisions were made. You will be asked about the ones you cannot defend on paper." },
  { min:0, rank:"Halted", title:"The programme is halted and the old systems are kept",
    body:"The licences were bought, the consultants were paid, and an order is still typed in four times between the phone call and the invoice. The chapter's warning holds: an enterprise system is a change to the way a company works, and a company that does not change gets the cost without the benefit." }
];

/* What one round hands to the next. Nothing in this game resets. */
function newCarry(){
  return {
    misordered: 0,        /* round 1: steps run out of sequence */
    duplicateCustomer: false, /* round 1: an order created before an account existed */
    phantomStock: 0,      /* round 1: stock set aside against no order */
    latency: null,        /* round 2: how stale the stock figure is, in hours */
    wiring: null,         /* round 2: the mode chosen for each crossing */
    traceable: false,     /* round 2: whether build records carry the lot number */
    rekeyCost: null,      /* round 2: what the crossings cost a year */
    architecture: null,   /* round 3: "suite" or "best-of-breed" */
    customized: 0,        /* round 3: modules changed rather than configured */
    trained: false,       /* round 3: whether training survived the budget */
    tcoGap: null,         /* round 3: what the submitted budget missed */
    patched: null,        /* round 3: whether the security update could be applied */
    promised: null,       /* round 4: what was promised against a stale figure */
    shortfall: 0,         /* round 4: what could not be delivered */
    shareSignal: false,   /* round 5: point-of-sale data shared upstream */
    safety: null,         /* round 5: the safety multiplier settled on */
    whip: null,           /* round 5: the amplification the chain ended with */
    strategy: null,       /* round 5: efficiency or effectiveness */
    recallUnits: null,    /* round 6: how many cabinets had to come back */
    fcr: null             /* round 7: first-contact resolution reached */
  };
}

/* The closing "what followed you" list, built from what actually happened.
   Every line is conditional: a run that avoided a mistake is told so. */
function carryLines(){
  var c = game.carry, out = [];

  out.push(c.misordered > 0
    ? "<li><b>Round one</b> &mdash; " + c.misordered + " step" + (c.misordered === 1 ? "" : "s") +
      " run out of order on a single order." +
      (c.duplicateCustomer ? " One of them created an order before the account existed, and " +
        BUYERS.groups[0] + " has been two customers ever since." : "") +
      (c.phantomStock ? " Another set " + c.phantomStock + " cabinets aside against no order, which is " +
        "why the figure on the promise desk was wrong before anybody touched it." : "") + "</li>"
    : "<li><b>Round one</b> &mdash; you ran the order the way it actually runs, so nothing downstream had to be unpicked.</li>");

  if(c.latency != null){
    out.push("<li><b>Round two</b> &mdash; your wiring left the stock figure <b>" + c.latency +
      " hours</b> old" + (c.rekeyCost ? " and " + money(c.rekeyCost) + " a year of re-typing in place" : "") +
      ". " + (c.latency === 0
        ? "Nothing on the promise desk was out of date."
        : "That is the number round four was answering the phone with.") + "</li>");
  }
  if(c.traceable != null && c.wiring){
    out.push("<li><b>Round two, again</b> &mdash; the build record " +
      (c.traceable ? "carried the compressor lot, which is why the recall was the size it was."
                   : "did not carry the compressor lot, which is why the recall could not be narrowed.") +
      " Nothing on that screen told you that was what you were deciding.</li>");
  }
  if(c.architecture){
    out.push("<li><b>Round three</b> &mdash; " + (c.architecture === "suite" ? "one suite" : "a best-of-breed portfolio") +
      ", " + c.customized + " module" + (c.customized === 1 ? "" : "s") + " customized rather than configured, " +
      "training " + (c.trained ? "budgeted" : "cut") + "." +
      (c.patched === false ? " When the security update came, it could not be applied." :
       c.patched === true ? " When the security update came, it went on over a weekend." : "") + "</li>");
  }
  if(c.promised != null){
    out.push("<li><b>Round four</b> &mdash; you promised <b>" + c.promised + "</b> cabinets. " +
      (c.shortfall > 0
        ? "<b>" + c.shortfall + "</b> of them did not exist, and the buyer found out on the Friday."
        : "Every one of them existed.") + "</li>");
  }
  if(c.whip != null){
    out.push("<li><b>Round five</b> &mdash; a 10 per cent change at the till reached your copper mill as a " +
      "<b>" + c.whip + "% </b>swing" +
      (c.shareSignal ? ", damped because the tiers could see what customers actually bought"
                     : ", undamped because every tier was guessing from the tier below") + ".</li>");
  }
  if(c.recallUnits != null){
    out.push("<li><b>Round six</b> &mdash; <b>" + c.recallUnits + "</b> cabinets came back. " +
      (c.recallUnits <= 96 ? "That is the number that were actually affected."
                           : "Only 96 of them had the failing compressor in.") + "</li>");
  }
  if(c.fcr != null){
    out.push("<li><b>Round seven</b> &mdash; first-contact resolution ended at <b>" + Math.round(c.fcr * 100) +
      "%</b>, which decides how many times the same customer has to explain the same problem to a different person.</li>");
  }
  return out;
}
/* ============================================================================
   2. ENGINE
   ========================================================================== */

var $ = function(id){ return document.getElementById(id); };
var stage = $("stage");

function el(tag, attrs, html){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){ if(attrs.hasOwnProperty(k)){
    if(k === "class") n.className = attrs[k];
    else if(k === "text") n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }}
  if(html != null) n.innerHTML = html;
  return n;
}
function money(n){
  var sign = n < 0 ? "-" : "";
  var a = Math.abs(Math.round(n));
  if(a >= 1000000) return sign + "$" + (a / 1000000).toFixed(a % 1000000 === 0 ? 1 : 2) + "m";
  if(a >= 1000) return sign + "$" + Math.round(a / 1000) + "k";
  return sign + "$" + a;
}
function dollars(n){ return (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString(); }
function pct(n){ return Math.round(n) + "%"; }
function announce(t){ $("liveStatus").textContent = t; }
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------------------------------------------------------- the theme
   This page's own saved choice wins; failing that it inherits whatever theme
   the reader last set on a study module, so the game does not flip back to
   light after a dark reading session. */
function applyTheme(theme){
  var dark = theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("themeBtn").textContent = dark ? "Light" : "Dark";
  $("themeBtn").setAttribute("aria-label", dark ? "Switch to the light theme" : "Switch to the dark theme");
}
(function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved === "dark" || saved === "light"){ applyTheme(saved); return; }
  var moduleTheme = null;
  try{ moduleTheme = localStorage.getItem("mis-ch1-theme-v1"); }catch(e){}
  applyTheme(moduleTheme === "dark" ? "dark" : "light");
})();
$("themeBtn").addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});

/* ------------------------------------------------------------- the best run */
function loadBest(){
  var raw = null;
  try{ raw = localStorage.getItem(BEST_KEY); }catch(e){}
  if(!raw) return null;
  try{
    var o = JSON.parse(raw);
    if(o && typeof o.percent === "number") return o;
  }catch(e){}
  return null;
}
function saveBest(run){
  var best = loadBest();
  if(best && best.percent >= run.percent) return false;
  try{ localStorage.setItem(BEST_KEY, JSON.stringify(run)); }catch(e){}
  return true;
}

/* ------------------------------------------------------------- game state */
var game = null;

function newGame(){
  return {
    round: 0,
    cash: START.cash,
    trust: START.trust,
    integration: START.integration,
    ledger: [],
    events: [],
    carry: newCarry(),
    done: false
  };
}

function spend(amount, why){
  game.cash -= amount;
  if(why) game.events.push({ kind:"cash", amount:-amount, why:why });
}
function moveTrust(delta, why){
  game.trust = clamp(game.trust + delta, 0, 100);
  if(why) game.events.push({ kind:"trust", amount:delta, why:why });
}
function moveIntegration(delta, why){
  game.integration = clamp(game.integration + delta, 0, 100);
  if(why) game.events.push({ kind:"integration", amount:delta, why:why });
}

function scoreSoFar(){
  var got = 0, max = 0;
  for(var i = 0; i < game.ledger.length; i++){ got += game.ledger[i].points; max += game.ledger[i].max; }
  return { got: got, max: max };
}

function refreshMeters(){
  var m = $("meters");
  if(!game){ m.hidden = true; $("restartBtn").hidden = true; return; }
  m.hidden = false;
  $("restartBtn").hidden = false;
  /* Cash, trust and integration still move, and every round's results report
     what they did. They are not in the top bar because they read as three more
     things the reader is being marked on, and only the score is. */
  var s = scoreSoFar();
  $("mScore").querySelector("b").textContent = s.got + "/" + s.max;
  $("mScore").className = "meter";
}

/* ------------------------------------------------------------------ the rail */
function renderRail(currentIndex, phase){
  var rail = el("div", { class:"rail", "aria-label":"The rounds of the programme" });
  for(var i = 0; i < ROUNDS.length; i++){
    var cls = "rail-step";
    if(i < currentIndex) cls += " done";
    else if(i === currentIndex) cls += " now";
    var step = el("div", { class: cls },
      "<b>" + (i + 1) + "</b>" + esc(ROUNDS[i].railName));
    if(i === currentIndex && phase) step.setAttribute("aria-current", "step");
    rail.appendChild(step);
  }
  return rail;
}

/* -------------------------------------------------------------- the briefing */
function renderBrief(m){
  var b = el("div", { class:"brief" });
  var html = '<p class="from">' + esc(m.brief.from) + "</p>" +
             '<span class="eyebrow">Round ' + m.round + " &middot; Objective " + m.lo + "</span>" +
             "<h2>" + esc(m.brief.title) + "</h2>";
  for(var i = 0; i < m.brief.body.length; i++) html += "<p>" + m.brief.body[i] + "</p>";
  /* A briefing may carry a paragraph that depends on what earlier rounds did. */
  if(typeof m.brief.dynamic === "function") html += m.brief.dynamic();
  html += '<div class="ask"><b>What the board needs from you:</b> ' + m.brief.ask + "</div>";
  b.innerHTML = html;
  return b;
}

/* ---------------------------------------------------------- the field manual
   The concept, one fold away. A reader who can reason their way through never
   opens it; a reader who is stuck gets the chapter rather than a hint. */
function renderManual(m){
  if(!m.manual) return null;
  var d = el("details", { class:"manual" });
  d.innerHTML = "<summary>Field manual &mdash; " + esc(m.manual.title) + "</summary>" +
    '<div class="manual-body">' + m.manual.body + "</div>";
  return d;
}

/* ============================================================================
   SCREENS
   ========================================================================== */
function clearStage(){
  while(stage.firstChild) stage.removeChild(stage.firstChild);
  var bar = $("nextBar");
  if(bar) bar.hidden = true;          /* only a round in progress has a next press */
  window.scrollTo(0, 0);
}

var liveRound = null;   /* the live round object while one is being played */

function showRound(index){
  game.round = index;
  var m = ROUNDS[index];
  liveRound = m;
  refreshMeters();
  clearStage();

  stage.appendChild(renderRail(index, "play"));

  /* The job, in one sentence, before a word of scenario. A reader who reads
     nothing else on the screen should still know what they are being asked. */
  if(m.task){
    var bar = el("div", { class:"qbar" });
    bar.innerHTML = "<b>Round " + m.round + " of " + ROUNDS.length + "</b>" +
      "<span>" + esc(m.task) + "</span>";
    var jump = el("button", { type:"button", class:"jump",
      "aria-label":"Skip the briefing and go straight to the work" }, "Start pressing \u2193");
    jump.addEventListener("click", function(){
      var work = $("work");
      if(work) window.scrollTo(0, work.getBoundingClientRect().top + window.pageYOffset - 12);
    });
    bar.appendChild(jump);
    stage.appendChild(bar);
  }

  stage.appendChild(renderBrief(m));

  var work = el("div", { class:"panel" });
  work.id = "work";
  work.innerHTML = '<span class="eyebrow">Your desk</span><h2>' + esc(m.name) + "</h2>";
  stage.appendChild(work);

  if(m.howTo && m.howTo.length){
    var steps = el("div", { class:"howto" });
    steps.innerHTML = "<h3>What to do on this screen</h3><ol>" +
      m.howTo.map(function(t){ return "<li>" + t + "</li>"; }).join("") + "</ol>";
    work.appendChild(steps);
  }

  var manual = renderManual(m);
  if(manual) work.appendChild(manual);

  var board = el("div", { id:"roundBody" });
  work.appendChild(board);

  /* A builder that draws its opening state before it has finished wiring up
     would otherwise call this before it exists, and take the rest of the round
     down with it. A no-op until build replaces it. */
  m.refreshCommit = function(){};
  m.q = new Questions();
  m.build(board);

  var row = el("div", { class:"right-row" });
  var note = el("span", { class:"todo", id:"commitNote" }, m.commitNote || "");
  row.appendChild(note);
  var commit = el("button", { class:"btn primary", id:"commitBtn" }, m.commitLabel || "Submit my answers");
  commit.addEventListener("click", function(){
    if(commit.disabled) return;
    commit.disabled = true;
    showDebrief(index, m.submit());
  });
  row.appendChild(commit);
  work.appendChild(row);

  numberQuestions(m.q);
  if(m.refreshCommit) m.refreshCommit();
  announce("Round " + m.round + ". " + m.name + ".");
}

/* Each question says which one of how many it is, and grows a tick when it is
   answered. A reader who cannot see how much is left reads a long screen as an
   indefinite one. */
function numberQuestions(q){
  if(!q) return;
  var total = q.total(), i;
  for(i = 0; i < total; i++){
    var spec = q.spec[q.order[i]];
    if(!spec || !spec.card) continue;
    if(spec.card.querySelector(".qnum")) continue;
    var chip = el("span", { class:"qnum" }, "Question " + (i + 1) + " of " + total);
    spec.card.insertBefore(chip, spec.card.firstChild);
  }
}

/* A round's result: a list of scored items, the meter movements it caused,
   and the narrative the board will read. */
function showDebrief(index, result){
  var m = ROUNDS[index];
  var i;

  for(i = 0; i < result.items.length; i++){
    var it = result.items[i];
    it.round = m.round;
    if(!it.lo) it.lo = m.lo;
    /* Anything marked as the reader worked is already in the ledger. */
    if(!result.live) game.ledger.push(it);
  }
  if(result.cash) spend(-result.cash, null);
  if(result.trust) moveTrust(result.trust, null);
  if(result.integration) moveIntegration(result.integration, null);

  refreshMeters();
  clearStage();
  stage.appendChild(renderRail(index, "debrief"));

  var got = 0, max = 0, right = 0;
  for(i = 0; i < result.items.length; i++){
    got += result.items[i].points;
    max += result.items[i].max;
    if(result.items[i].points === result.items[i].max) right++;
  }
  var asked = result.items.length;
  var running = scoreSoFar();

  var head = el("div", { class:"brief" });
  var band = got === max ? "Every call was right." :
             got >= max * 0.7 ? "Most of it was right." :
             got >= max * 0.4 ? "About half of it was right." : "This one went badly.";
  head.innerHTML =
    '<p class="from">Round ' + m.round + " results</p>" +
    "<h2>" + esc(band) + "</h2>" +
    "<p>You got <b>" + right + " of " + asked + "</b> right this round, worth <b>" + got +
    " out of " + max + " points</b>. Running total: <b>" + running.got + " of " + running.max +
    "</b>.</p>" +
    "<p>" + result.summary + "</p>";
  stage.appendChild(head);

  var moves = [];
  if(result.cash) moves.push((result.cash > 0 ? "+" : "") + money(result.cash) + " cash");
  if(result.trust) moves.push((result.trust > 0 ? "+" : "") + result.trust + " trust");
  if(result.integration) moves.push((result.integration > 0 ? "+" : "") + result.integration + " integration");
  if(moves.length){
    var mv = el("div", { class:"panel" });
    mv.innerHTML = "<h2>What it moved</h2><p>" + moves.join(" &nbsp;&middot;&nbsp; ") + "</p>" +
      (result.moveWhy ? '<p class="small muted">' + result.moveWhy + "</p>" : "");
    stage.appendChild(mv);
  }

  var p = el("div", { class:"panel" });
  var html = "<h2>Every call, and why</h2>" +
    '<p class="small muted">Each one is marked out of the points it was worth &mdash; the harder calls ' +
    "are worth more. Green is full marks, amber is partial, red is none. The explanation under every " +
    "card is the part worth reading, whether you got it right or not.</p>";
  for(i = 0; i < result.items.length; i++){
    var it2 = result.items[i];
    var tagClass = it2.points === it2.max ? "ok" : it2.points === 0 ? "no" : "mid";
    html += '<div class="qcard"><p><span class="tag ' + tagClass + '">' + it2.points + "/" + it2.max +
            "</span> <b>" + it2.label + "</b></p>" +
            '<p class="small">' + it2.chose + "</p>" +
            '<p class="qwhy">' + it2.why + "</p></div>";
  }
  p.innerHTML = html;
  stage.appendChild(p);

  if(result.after){
    var a = el("div", { class:"panel" });
    a.innerHTML = "<h2>" + esc(result.after.title) + "</h2>" + result.after.body;
    stage.appendChild(a);
  }

  var row = el("div", { class:"center-row" });
  var next = el("button", { class:"btn primary" },
    index + 1 < ROUNDS.length ? "Start round " + (index + 2) : "Face the board");
  next.addEventListener("click", function(){
    if(index + 1 < ROUNDS.length) showRound(index + 1);
    else showReview();
  });
  row.appendChild(next);
  stage.appendChild(row);
  announce("Round " + m.round + " scored " + got + " of " + max + ".");
}

$("restartBtn").addEventListener("click", function(){
  if(game && !game.done && game.ledger.length > 0){
    if(!window.confirm("Start again from round one? This run will be lost.")) return;
  }
  showIntro();
});

/* ============================================================================
   3. SHARED BUILDERS
   ========================================================================== */
var ROUNDS = [];

/* A row of mutually exclusive pills. Returns a handle whose .value is the
   chosen id, or null. */
function pillGroup(parent, options, cls, onChange){
  var row = el("div", { class:"pills", role:"group" });
  var handle = { value:null, buttons:{}, row:row };
  options.forEach(function(o){
    var b = el("button", { type:"button", class:"pill " + (cls || ""), "aria-pressed":"false" }, o.label);
    b.addEventListener("click", function(){
      handle.value = handle.value === o.id ? null : o.id;
      for(var k in handle.buttons){ if(handle.buttons.hasOwnProperty(k)){
        handle.buttons[k].setAttribute("aria-pressed", k === handle.value ? "true" : "false");
      }}
      if(onChange) onChange(handle.value);
    });
    handle.buttons[o.id] = b;
    row.appendChild(b);
  });
  parent.appendChild(row);
  return handle;
}

/* A stack of option cards. multi:true allows several, with an optional cap. */
function optionStack(parent, options, opts){
  opts = opts || {};
  var handle = { chosen:[], buttons:{} };
  options.forEach(function(o){
    var b = el("button", { type:"button", class:"opt", "aria-pressed":"false" });
    b.innerHTML = '<span class="tick"></span><span class="otext"><b>' + o.title + "</b>" +
      (o.note ? "<span>" + o.note + "</span>" : "") + "</span>" +
      (o.price ? '<span class="price">' + o.price + "</span>" : "");
    b.addEventListener("click", function(){
      var at = handle.chosen.indexOf(o.id);
      if(at >= 0) handle.chosen.splice(at, 1);
      else if(opts.multi){
        if(opts.max && handle.chosen.length >= opts.max) return;
        handle.chosen.push(o.id);
      } else handle.chosen = [o.id];
      for(var k in handle.buttons){ if(handle.buttons.hasOwnProperty(k)){
        handle.buttons[k].setAttribute("aria-pressed", handle.chosen.indexOf(k) >= 0 ? "true" : "false");
      }}
      if(opts.onChange) opts.onChange(handle.chosen);
    });
    handle.buttons[o.id] = b;
    parent.appendChild(b);
  });
  return handle;
}

function enableCommit(on, note){
  /* An open repair is unfinished business, whatever the round thinks. */
  if(on && liveRound && liveRound.q && liveRound.q.repairPending()){
    on = false;
    note = "One to put right first";
  }
  var b = $("commitBtn");
  if(b) b.disabled = !on;
  var n = $("commitNote");
  if(n && note != null){
    n.textContent = note;
    n.className = "todo" + (on ? " ready" : "");
  }
  refreshNext(on, note);
}

/* ------------------------------------------------- the bar along the bottom
   A reader who is lost does not need to be told what the round is about. They
   need to be told which thing to press. This works it out from the state of
   the page itself, so a round does not have to say anything for it to be
   right: a tray with cards in it means the next press is a card, a live
   in-question button means the next press is that button, an unanswered
   question means the next press is inside that question.

   It also marks the question the reader is on, because "answer the next
   question" is only useful if you can see which one that is. */
function nextAction(){
  var body = $("roundBody");
  if(!body) return null;

  /* Something is in hand, so the only sensible next press is a destination,
     wherever on the screen it is. */
  var held = body.querySelector(".flowstep.held");
  if(held){
    /* the card's own text runs its department into its name, so the plain
       label travels on the element rather than being scraped back out */
    var label = held.getAttribute("data-label") || held.textContent;
    return { html: "Now press where <em>" + esc(label) + "</em> belongs. " +
                   "The outlined boxes are the ones that will take it.", mark: null };
  }

  /* Otherwise: work down the screen in the order the reader reads it, and
     describe the next press inside the first question that has no verdict on
     it yet. Following the DOM rather than guessing is what stops the bar
     pointing at the bottom of the screen while the top of it is unanswered. */
  /* An open repair outranks everything: it is the thing on screen waiting. */
  var open = body.querySelectorAll(".repair");
  for(var r = 0; r < open.length; r++){
    if(open[r].className.indexOf("won") < 0 && open[r].className.indexOf("lost") < 0){
      return { html: "Answer the second one, under the explanation. " +
                     "Getting it right takes back all but one of the points.",
               mark: open[r].closest ? open[r].closest(".qcard") : null };
    }
  }

  var cards = body.querySelectorAll(".qcard"), i;
  for(i = 0; i < cards.length; i++){
    var card = cards[i];
    /* a card with a verdict but an unfinished repair is not done */
    if(card.querySelector(".mark") && !card.querySelector(".repair")) continue;
    if(card.querySelector(".mark") && card.querySelector(".repair")) continue;

    /* a button inside the question may carry its own wording */
    var btn = card.querySelector("button.btn:not([disabled]), button.pill.commit:not([disabled])");
    if(btn && btn.getAttribute("data-hint")){
      return { html: btn.getAttribute("data-hint"), mark: card };
    }

    /* a tray with cards still in it */
    var tray = card.querySelector(".flowline");
    if(tray && tray.querySelector("button.flowstep:not([disabled])")){
      var strip = card.querySelector(".traybar .msgtext");
      return { html: strip ? strip.innerHTML
                           : "Press a card in the tray, then press where it belongs.", mark: card };
    }
    /* a sequence with empty slots */
    var seq = card.querySelector(".seq");
    if(seq && seq.querySelector(".seq-slot:not(.filled)")){
      return { html: "Press the steps in the order they happen. " +
                     "Press a slot you have filled to take that card back.", mark: card };
    }
    if(btn){
      return { html: "Press <em>" + esc(btn.textContent) + "</em>.", mark: card };
    }
    return { html: "Answer the highlighted question.", mark: card };
  }
  return null;
}

function refreshNext(ready, note){
  var bar = $("nextBar"), what = $("nextWhat"), tally = $("nextTally");
  if(!bar || !what) return;
  /* Picking a card up is not a change of answer, so no round tells us about
     it. The board calls this directly, without arguments, and we work out for
     ourselves whether the round is finished. */
  if(ready === undefined){
    var cb = $("commitBtn");
    ready = !!(cb && !cb.disabled);
  }
  if(!liveRound || !game || game.done){ bar.hidden = true; return; }
  bar.hidden = false;

  var body = $("roundBody"), i;
  if(body){
    var marked = body.querySelectorAll(".qcard.current");
    for(i = 0; i < marked.length; i++) marked[i].classList.remove("current");
  }

  var q = liveRound.q;
  if(tally && q) tally.textContent = q.answeredCount() + " of " + q.total() + " answered";

  if(ready){
    bar.className = "nextbar ready";
    what.innerHTML = "Everything on this screen is answered. Press <em>Submit my answers</em> at the " +
                     "bottom right to see how it went.";
    return;
  }
  bar.className = "nextbar";
  var step = nextAction();
  what.innerHTML = step ? step.html : esc(note || "Work through the screen.");
  if(step && step.mark && step.mark.classList) step.mark.classList.add("current");
}

function item(label, chose, ok, points, max, why, lo){
  return { label:label, chose:chose, ok:!!ok, points:points, max:max, why:why, lo:lo || null };
}

/* ============================================================================
   MARKING AS YOU GO

   Every scored question registers itself here. The moment it is answered it is
   marked, explained and locked: the first choice is the one that counts, which
   is the only arrangement under which the score means anything, and the reader
   never makes ten decisions before finding out how the first one went.
   ========================================================================== */
function Questions(){
  this.order = [];
  this.spec = {};
  this.marked = {};
}
/* A question may carry a REPAIR: a second, different instance of the same idea,
   built only if the first answer was wrong. See the long note above
   openRepair() for why. */
Questions.prototype.register = function(key, card, worth, grade, repair){
  if(this.order.indexOf(key) < 0) this.order.push(key);
  this.spec[key] = { card:card, grade:grade, worth:worth, repair:repair, entry:null };
  if(card && worth){
    var h = card.querySelector("p");
    if(h && !card.querySelector(".worth")){
      h.appendChild(el("span", { class:"worth" }, worth + (worth === 1 ? " point" : " points")));
    }
  }
};
Questions.prototype.isAnswered = function(key){
  return Object.prototype.hasOwnProperty.call(this.marked, key);
};
Questions.prototype.answeredCount = function(){
  var n = 0;
  for(var k in this.marked){ if(this.marked.hasOwnProperty(k)) n++; }
  return n;
};
Questions.prototype.total = function(){ return this.order.length; };
Questions.prototype.remaining = function(){ return this.total() - this.answeredCount(); };
Questions.prototype.mark = function(key){
  if(this.isAnswered(key)) return;
  var spec = this.spec[key];
  if(!spec) return;
  var it = spec.grade();
  if(!it) return;
  this.marked[key] = it;

  if(spec.card){
    spec.card.classList.add("answered");
    var cls = it.points === it.max ? "" : it.points === 0 ? " no" : " partial";
    var box = el("div", { class:"mark" + cls });
    box.innerHTML =
      '<p class="verdictline"><span class="pts">' + it.points + " / " + it.max + '</span>' +
      "<b>" + (it.points === it.max ? "Right" : it.points === 0 ? "Not this one" : "Partly right") + "</b>" +
      "<span>" + it.chose + "</span></p>" +
      '<div class="whytext">' + it.why + "</div>";
    spec.card.appendChild(box);
    /* Lock every control inside the card: the first answer counts. */
    var controls = spec.card.querySelectorAll(
      "button.pill, button.opt, button.flowstep, button.vc-cell, button.switch, button.force, " +
      "button.seq-slot, input, select, tr.pickable");
    for(var i = 0; i < controls.length; i++){
      var c = controls[i];
      if(c.tagName === "TR"){ c.classList.remove("pickable"); c.setAttribute("tabindex", "-1"); }
      else c.disabled = true;
    }
  }
  var entry = { round: liveRound.round, lo: it.lo || liveRound.lo, points: it.points,
                max: it.max, label: it.label, chose: it.chose, why: it.why, ok: it.ok,
                live: true };
  game.ledger.push(entry);
  spec.entry = entry;
  refreshMeters();
  if(spec.card){
    var chip = spec.card.querySelector(".qnum");
    if(chip) chip.className = "qnum done";
  }
  announce(it.points === it.max ? "Right. " + it.points + " points." :
           "Marked. " + it.points + " of " + it.max + " points.");
  if(it.points < it.max && spec.repair && spec.card) this.openRepair(key);
  if(liveRound && liveRound.refreshCommit) liveRound.refreshCommit();
};

/* ============================================================================
   THE REPAIR

   The ordinary shape of a page like this is: meet an idea, answer once, read
   why you were wrong, move on. The mark then records what the reader knew
   BEFORE the teaching, which is a strange thing for a teaching page to
   measure, and it makes the explanation something you read rather than
   something you use.

   So a question may carry a repair: a second instance of the same idea,
   different in its particulars, built only when the first answer was wrong.
   The first answer still stands and still cost whatever it cost inside the
   fiction. What the repair changes is the mark, and only partly: getting it
   right the second time recovers all but one point, and the page says plainly
   that this is the difference between knowing it on arrival and learning it
   here.

   A reader who was right first time never sees any of this, so knowing the
   material does not make the game longer. That is the whole design: the
   practice appears exactly where it is needed.
   ========================================================================== */
Questions.prototype.openRepair = function(key){
  var spec = this.spec[key], self = this;
  if(!spec || !spec.repair || spec.repairOpen) return;
  spec.repairOpen = true;

  var host = el("div", { class:"repair" });
  host.innerHTML =
    '<p class="rhead"><span class="rtag">Put it right</span>' +
    (spec.repair.lead ||
     "Here is the same idea again, on a different one. Get this one right and you take back all " +
     "but one of the points.") + "</p>";
  spec.card.appendChild(host);

  var body = el("div");
  host.appendChild(body);

  spec.repair.build(body, function(ok, chose, why){
    self.resolveRepair(key, ok, chose, why);
  });
  announce("A second one, on the same idea.");
  if(liveRound && liveRound.refreshCommit) liveRound.refreshCommit();
};

Questions.prototype.resolveRepair = function(key, ok, chose, why){
  var spec = this.spec[key];
  if(!spec || spec.repairDone) return;
  spec.repairDone = true;

  var it = this.marked[key], entry = spec.entry;
  var before = it.points;
  /* All but one point back. Never fewer than the first answer earned, and
     never the full marks a reader who knew it already would have had. */
  var after = ok ? Math.max(before, Math.max(1, it.max - 1)) : before;
  it.points = after;
  if(entry) entry.points = after;

  var host = spec.card.querySelector(".repair");
  if(host){
    var box = el("div", { class:"mark" + (ok ? "" : " no") });
    box.innerHTML =
      '<p class="verdictline"><span class="pts">' +
        (ok ? "+" + (after - before) : "+0") + '</span><b>' +
        (ok ? "Right this time" : "Still not it") + "</b><span>" + (chose || "") + "</span></p>" +
      '<div class="whytext">' + (why || "") +
      (ok ? "<p><b>" + before + " \u2192 " + after + " out of " + it.max + ".</b> You did not know " +
            "that when you arrived and you know it now, which is the only thing this page was built " +
            "to do. The point you did not take back is the difference between the two.</p>"
          : "<p>The mark stays at <b>" + before + " of " + it.max + "</b>. The explanation above the " +
            "second one is the part worth rereading before the next round.</p>") + "</div>";
    host.appendChild(box);
    var ctl = host.querySelectorAll("button.pill, button.opt, button.flowstep, button.vc-cell, " +
                                    "button.switch, button.force, input, select");
    for(var i = 0; i < ctl.length; i++) ctl[i].disabled = true;
    host.className = "repair " + (ok ? "won" : "lost");
  }
  refreshMeters();
  announce(ok ? "Right this time. " + (after - before) + " points back." : "Still not it.");
  if(liveRound && liveRound.refreshCommit) liveRound.refreshCommit();
};

/* A question is only finished when its repair, if it opened one, is done. */
Questions.prototype.repairPending = function(){
  for(var k in this.spec){
    if(!this.spec.hasOwnProperty(k)) continue;
    if(this.spec[k].repairOpen && !this.spec[k].repairDone) return true;
  }
  return false;
};
Questions.prototype.items = function(){
  var out = [], self = this;
  this.order.forEach(function(k){ if(self.marked[k]) out.push(self.marked[k]); });
  return out;
};

/* Most repairs are one question with a row of choices, so that shape is
   written once. `options` is [{id, label, why}], `right` is the id that earns
   the points back, and `intro` is the new situation. */
function repairPills(host, intro, options, right, done){
  if(intro) host.appendChild(el("p", { class:"rintro" }, intro));
  var group = pillGroup(host, options.map(function(o){ return { id:o.id, label:o.label }; }), "",
    function(v){
      if(v == null) return;
      var picked = null, i;
      for(i = 0; i < options.length; i++) if(options[i].id === v) picked = options[i];
      if(!picked) return;
      done(v === right, picked.label, picked.why);
    });
  return group;
}

/* A scored question card with a row of pills. The first press marks it. */
function pillQuestion(q, parent, key, worth, prompt, options, grade, cls){
  var card = el("div", { class:"qcard" });
  card.innerHTML = "<p><b>" + prompt + "</b></p>";
  parent.appendChild(card);
  var group = pillGroup(card, options, cls || "", function(v){
    if(v == null) return;
    q.mark(key);
  });
  q.register(key, card, worth, function(){ return grade(group.value); });
  return group;
}

/* A scored question card with a stack of option cards, marked on first press. */
function choiceQuestion(q, parent, key, worth, prompt, options, grade, note){
  var card = el("div", { class:"qcard" });
  card.innerHTML = "<p><b>" + prompt + "</b></p>" + (note ? '<p class="small muted">' + note + "</p>" : "");
  parent.appendChild(card);
  var stack = optionStack(card, options, { onChange: function(chosen){
    if(!chosen.length) return;
    q.mark(key);
  }});
  q.register(key, card, worth, function(){ return grade(stack.chosen[0]); });
  return stack;
}
/* ============================================================================
   ASSIGNING CARDS TO PLACES

   Three rounds need the same gesture: a tray of cards, a set of places, and a
   reader deciding which card goes where. It is written once, here.

   Deliberately NOT drag and drop. A drag is invisible to a screen reader, it is
   hostile on a phone, and it is the single most common way an otherwise good
   teaching page becomes unusable. Instead: press a card to pick it up, press a
   place to put it down, press it again to take it back. That is three key
   presses, works at any width, and announces itself.
   ========================================================================== */
function assignBoard(opts){
  /* opts: { tray, cards:[{id,label,note}], bins:[{id,node,label,cap}],
             onChange, cardClass } */
  var placement = {};        /* cardId -> binId */
  var held = null;           /* the card currently picked up */
  var trayNodes = {}, chipNodes = {};
  var locked = false;

  /* The strip that sits directly above the tray and says what the next press
     is. It is here rather than in the round's instructions because that is
     four screens away by the time the reader reaches the tray. */
  var bar = el("div", { class:"traybar" });
  bar.innerHTML = '<span class="step">1</span><span class="msgtext">' +
    (opts.prompt || "Press a card below, then press where it belongs.") + "</span>";
  if(opts.tray.parentNode) opts.tray.parentNode.insertBefore(bar, opts.tray);

  function say(){
    var t = bar.querySelector(".msgtext"), n = bar.querySelector(".step");
    var leftInTray = opts.cards.length - placedCount();
    if(locked){
      bar.className = "traybar done";
      n.textContent = "\u2713";
      t.innerHTML = opts.donePrompt || "Placed and marked.";
      return;
    }
    if(held){
      var c = cardOf(held);
      bar.className = "traybar holding";
      n.textContent = "2";
      t.innerHTML = "Holding <b>" + esc(c.label) + "</b> \u2014 now press " +
        (opts.placePrompt || "where it belongs") + ". The outlined boxes are the ones that will take it.";
      return;
    }
    bar.className = "traybar";
    n.textContent = "1";
    t.innerHTML = leftInTray === 0
      ? (opts.fullPrompt || "All placed. Press a chip to take one back if you want to change it.")
      : (opts.prompt || "Press a card below, then press where it belongs.") +
        " <b>" + leftInTray + " left.</b>";
  }

  /* Every destination lights up while something is in hand, so the second
     press is shown rather than described. */
  function arm(on){
    var i;
    for(i = 0; i < opts.bins.length; i++){
      if(on) opts.bins[i].node.classList.add("bin-armed");
      else opts.bins[i].node.classList.remove("bin-armed");
    }
  }

  function placedCount(){
    var n = 0, k;
    for(k in placement){ if(placement.hasOwnProperty(k)) n++; }
    return n;
  }

  function binOf(id){
    for(var i = 0; i < opts.bins.length; i++) if(opts.bins[i].id === id) return opts.bins[i];
    return null;
  }
  function cardOf(id){
    for(var i = 0; i < opts.cards.length; i++) if(opts.cards[i].id === id) return opts.cards[i];
    return null;
  }
  function countIn(binId){
    var n = 0;
    for(var k in placement){ if(placement.hasOwnProperty(k) && placement[k] === binId) n++; }
    return n;
  }

  function draw(){
    say();
    arm(!!held && !locked);
    /* the tray */
    while(opts.tray.firstChild) opts.tray.removeChild(opts.tray.firstChild);
    trayNodes = {};
    var any = false;
    opts.cards.forEach(function(c){
      if(placement[c.id]) return;
      any = true;
      var b = el("button", { type:"button",
        class:"flowstep " + (opts.cardClass || "") + (held === c.id ? " held" : ""),
        "aria-pressed": held === c.id ? "true" : "false",
        "aria-label": (held === c.id ? "Holding " : "Pick up ") + c.label,
        "data-label": c.label });
      b.innerHTML = (c.note ? "<b>" + esc(c.note) + "</b>" : "") + esc(c.label);
      b.addEventListener("click", function(){
        if(locked) return;
        held = held === c.id ? null : c.id;
        draw();
        announce(held ? "Holding " + c.label + ". Now press where it goes." : "Put down.");
      });
      opts.tray.appendChild(b);
      trayNodes[c.id] = b;
    });
    if(!any) opts.tray.appendChild(el("div", { class:"flowstep ghost" }, "tray empty"));

    /* the chips inside each place */
    opts.bins.forEach(function(bin){
      var holder = bin.node.querySelector(".chips");
      if(!holder){
        holder = el("span", { class:"chips" });
        bin.node.appendChild(holder);
      }
      while(holder.firstChild) holder.removeChild(holder.firstChild);
      opts.cards.forEach(function(c){
        if(placement[c.id] !== bin.id) return;
        var chip = el("span", { class:"chip" + (chipNodes[c.id] && chipNodes[c.id].mark ? " " + chipNodes[c.id].mark : "") },
          esc(c.label));
        chip.setAttribute("role", "button");
        chip.setAttribute("tabindex", locked ? "-1" : "0");
        chip.setAttribute("aria-label", "Take " + c.label + " back to the tray");
        function take(){
          if(locked) return;
          delete placement[c.id];
          held = null;
          draw();
          if(opts.onChange) opts.onChange(placement);
          announce(c.label + " back in the tray.");
        }
        chip.addEventListener("click", function(e){ e.stopPropagation(); take(); });
        chip.addEventListener("keydown", function(e){
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); take(); }
        });
        holder.appendChild(chip);
      });
      bin.node.setAttribute("aria-label", bin.label + ", " + countIn(bin.id) + " placed");
    });

    /* The bar along the bottom reads the page, so it has to be told after the
       tray has been rebuilt rather than before. */
    if(typeof refreshNext === "function") refreshNext();
  }

  /* wire the places once */
  opts.bins.forEach(function(bin){
    bin.node.addEventListener("click", function(){
      if(locked || !held) return;
      if(bin.cap && countIn(bin.id) >= bin.cap && placement[held] !== bin.id) return;
      var c = cardOf(held);
      placement[held] = bin.id;
      held = null;
      draw();
      if(opts.onChange) opts.onChange(placement);
      announce(c.label + " placed on " + bin.label + ".");
    });
  });

  draw();

  return {
    placement: placement,
    placedCount: placedCount,

/* ============================================================================
   A LINE CHART, DRAWN AS SVG, WITH NO LIBRARY

   Used by the supply-chain round, where the whole lesson is the shape of four
   lines that started as the same line. Inline SVG rather than canvas so that
   the theme's colours apply, the text scales, and the whole thing survives
   being printed.
   ========================================================================== */
var SERIES_COLOURS = ["var(--accent)", "var(--teal)", "var(--plum)", "var(--bad)"];

function lineChart(opts){
  /* opts: { series:[{name, values:[]}], labels:[], height, baseline, caption } */
  var W = 720, H = opts.height || 230;
  var padL = 44, padR = 12, padT = 14, padB = 30;
  var n = opts.labels.length;
  var all = [];
  opts.series.forEach(function(s){ all = all.concat(s.values); });
  var max = Math.max.apply(null, all.concat([opts.baseline || 0]));
  var min = 0;
  var top = Math.ceil(max / 50) * 50 || 50;

  function x(i){ return padL + (n <= 1 ? 0 : (W - padL - padR) * i / (n - 1)); }
  function y(v){ return padT + (H - padT - padB) * (1 - (v - min) / (top - min)); }

  var svg = '<svg class="fig" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc(opts.caption || "Orders by week") + '">';

  /* grid and y labels */
  var step = top / 4, g;
  for(g = 0; g <= 4; g++){
    var v = g * step;
    svg += '<line x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + y(v).toFixed(1) + '" stroke="var(--grid-line)" stroke-width="1"/>';
    svg += '<text class="dim" x="' + (padL - 6) + '" y="' + (y(v) + 4).toFixed(1) +
      '" text-anchor="end">' + Math.round(v) + "</text>";
  }
  /* the baseline everything started at */
  if(opts.baseline){
    svg += '<line x1="' + padL + '" y1="' + y(opts.baseline).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + y(opts.baseline).toFixed(1) + '" stroke="var(--muted)" stroke-width="1.5" ' +
      'stroke-dasharray="5 4"/>';
  }
  /* x labels, every other one so they never collide */
  for(g = 0; g < n; g++){
    if(n > 8 && g % 2 === 1) continue;
    svg += '<text class="dim" x="' + x(g).toFixed(1) + '" y="' + (H - 9) +
      '" text-anchor="middle">' + esc(opts.labels[g]) + "</text>";
  }
  /* the lines */
  opts.series.forEach(function(s, si){
    var d = "", i;
    for(i = 0; i < s.values.length; i++){
      d += (i ? " L" : "M") + x(i).toFixed(1) + " " + y(s.values[i]).toFixed(1);
    }
    svg += '<path d="' + d + '" fill="none" stroke="' + SERIES_COLOURS[si % SERIES_COLOURS.length] +
      '" stroke-width="' + (si === s.length - 1 ? 3 : 2.4) + '" stroke-linejoin="round" ' +
      'stroke-linecap="round"/>';
    for(i = 0; i < s.values.length; i++){
      svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(s.values[i]).toFixed(1) +
        '" r="2.6" fill="' + SERIES_COLOURS[si % SERIES_COLOURS.length] + '"/>';
    }
  });
  svg += "</svg>";

  var wrap = el("div", { class:"figwrap" });
  wrap.innerHTML = svg;

  var legend = el("div", { class:"legend" });
  var lh = "";
  opts.series.forEach(function(s, si){
    lh += '<span class="lgd"><i style="background:' + SERIES_COLOURS[si % SERIES_COLOURS.length] +
      '"></i>' + esc(s.name) + "</span>";
  });
  if(opts.baseline) lh += '<span class="lgd"><i class="dash"></i>steady demand, ' + opts.baseline + "</span>";
  legend.innerHTML = lh;

  var out = el("div");
  out.appendChild(wrap);
  out.appendChild(legend);
  if(opts.caption) out.appendChild(el("p", { class:"small muted", style:"margin:4px 0 0" }, opts.caption));
  return out;
}
/* ============================================================================
   THE SUPPLY CHAIN, AS ARITHMETIC

   The bullwhip effect is the one thing in this chapter that nobody believes
   until they watch it happen, so the rule is printed on the page in words and
   in symbols and then run in front of the reader:

       order(t) = incoming(t) + k x (incoming(t) - incoming(t-1))

   Each tier orders what it was asked for, plus k times however much that has
   moved since last week. k is its safety-stock multiplier. Nothing more than
   that, and it is enough: a small change at the till, passed through four
   tiers each of which only ever sees the tier below, arrives at the far end
   several times its original size.

   Sharing point-of-sale data changes exactly one term. A tier that can see
   what customers actually bought reacts to THAT change instead of to the
   change in its own order book, which is where the multiplication was coming
   from. Everything else stays the same, so the reader can see that the fix is
   information rather than inventory.
   ========================================================================== */

/* A tier stocks out in a week when what it is asked for exceeds what it had
   put aside: its previous order plus its safety buffer. Cheap to state and
   cheap for the reader to check, which is why it is stated this way. */
function whipRun(demand, ks, shared){
  var T = demand.length, N = ks.length;
  var incoming = demand.slice();
  var series = [], shortWeeks = [], i, t;
  for(i = 0; i < N; i++){
    var out = [], short = 0;
    for(t = 0; t < T; t++){
      var prev = t ? incoming[t - 1] : incoming[0];
      var delta = shared[i] ? (t ? demand[t] - demand[t - 1] : 0) : (incoming[t] - prev);
      var o = incoming[t] + ks[i] * delta;
      if(o < 0) o = 0;
      out.push(Math.round(o * 10) / 10);
      /* A tier is caught short in a week when the jump in what it is asked for
         is bigger than the buffer it chose to hold. That is the trade-off the
         slider is really setting: a small k is cheap until the week the order
         book moves more than k. */
      var jump = t ? incoming[t] - incoming[t - 1] : 0;
      if(jump > ks[i] * demand[0] + 0.0001) short++;
    }
    series.push(out);
    shortWeeks.push(short);
    incoming = out;
  }
  return { series: series, shortWeeks: shortWeeks };
}

/* The single number the round is about: how much bigger the swing is at the
   far end of the chain than it was at the till. */
function whipAmplification(run, baseline){
  var last = run.series[run.series.length - 1];
  var peak = Math.max.apply(null, last);
  return Math.round((peak - baseline) / baseline * 1000) / 10;   /* per cent above steady */
}
function whipPeak(run, tier){
  return Math.max.apply(null, run.series[tier]);
}
function whipTrough(run, tier){
  return Math.min.apply(null, run.series[tier]);
}

/* Carrying what you set aside costs money every week; running out costs more,
   once. Both are per tier, so the reader can see that their own tier is not
   the only place their decision lands. */
function whipCost(run, ks, baseline, holdPerUnitWeek, shortPerTierWeek, weeks){
  var carry = 0, short = 0, i;
  for(i = 0; i < ks.length; i++){
    carry += ks[i] * baseline * holdPerUnitWeek * weeks;
    short += run.shortWeeks[i] * shortPerTierWeek;
  }
  return { carry: Math.round(carry), short: Math.round(short), total: Math.round(carry + short) };
}

/* ============================================================================
   ROUND 1 — SEVEN STONES

   Order-to-cash, procure-to-pay and the two ways of making a thing, done
   rather than defined. The reader lays the seven subprocesses out in the order
   they happen, and then the page runs one real order down the order they chose
   and prices every step that arrived too early.

   Two of those faults do not only cost money here. Creating the order before
   the customer record exists leaves the buying group on file twice, which is
   what round seven cannot assemble a single view of; setting stock aside
   before there is an order to set it aside for leaves stock allocated to
   nothing, which is what round four's promise desk is reading when it lies.
   ========================================================================== */

/* The chapter's own seven subprocesses, plus two from procure-to-pay that do
   not belong in this process at all. Which department owns each one matters
   from round two onward, so it is recorded here. */
var O2C_STEPS = [
  { id:"cust",    label:"Create the customer record",   owner:"Sales",     detail:"Name, delivery sites, payment terms, tax status" },
  { id:"credit",  label:"Check credit",                 owner:"Finance",   detail:"How much this buyer may owe us at once" },
  { id:"order",   label:"Create the order",             owner:"Sales",     detail:"Models, quantities, price, promised date" },
  { id:"alloc",   label:"Check and allocate stock",     owner:"Warehouse", detail:"Set specific cabinets aside for this order" },
  { id:"ship",    label:"Pick, pack and ship",          owner:"Warehouse", detail:"Off the rack, onto the trailer" },
  { id:"invoice", label:"Prepare and send the invoice", owner:"Finance",   detail:"The bill, on the terms agreed" },
  { id:"collect", label:"Collect the payment",          owner:"Finance",   detail:"Money in the bank, order closed" }
];
var O2C_ORDER = ["cust","credit","order","alloc","ship","invoice","collect"];

var P2P_DECOYS = [
  { id:"po",      label:"Issue a purchase order",       owner:"Purchasing", detail:"Ask a supplier for compressors" },
  { id:"receive", label:"Receive the goods",            owner:"Warehouse",  detail:"Book a supplier's delivery in" }
];

/* Ordering rules, each with the thing that actually goes wrong when the pair
   runs the wrong way round, and what it costs on one order. */
var O2C_RULES = [
  { id:"custOrder", before:"cust", after:"order", cost:1100, flag:"duplicateCustomer",
    what:"An order was created before there was an account to put it on, so the buyer was set up " +
         "afterwards from a note. " + BUYERS.groups[0] + " is now on file twice, once as a trading name " +
         "and once as a site address." },
  { id:"creditShip", before:"credit", after:"ship", cost:5400,
    what:"Six cabinets went out before anybody looked at the account. This buying group has been over " +
         "its limit since March, and $5,400 of it is now on a trailer." },
  { id:"orderAlloc", before:"order", after:"alloc", cost:900, flag:"phantomStock",
    what:"Stock was set aside against a phone call, and then the order was written for a different " +
         "quantity. Nobody released the first allocation. Fourteen cabinets now show as free that are " +
         "physically on a trailer, and every availability figure from here on is fourteen too high." },
  { id:"allocShip", before:"alloc", after:"ship", cost:3400,
    what:"The picker walked to bay 12 and the pallet was already labelled for a pharmacy chain. One " +
         "backorder, one apology, one part-shipment nobody planned for." },
  { id:"shipInvoice", before:"ship", after:"invoice", cost:2200,
    what:"The buyer has a bill for cabinets they have not seen. Their accounts team put it in dispute, " +
         "and a disputed invoice is paid late if it is paid at all." },
  { id:"invoiceCollect", before:"invoice", after:"collect", cost:1500,
    what:"You chased the money before you sent the document that says what the money is for." }
];

var STRAY_COST = 2600;

/* Given a sequence of step ids, which rules it breaks. Pure, so the test can
   recompute the cost of any sequence from first principles. */
function o2cViolations(seq){
  var pos = {}, i;
  for(i = 0; i < seq.length; i++) pos[seq[i]] = i;
  var out = [];
  for(i = 0; i < O2C_RULES.length; i++){
    var r = O2C_RULES[i];
    var a = pos[r.before], b = pos[r.after];
    if(a == null || b == null) continue;     /* a step left out is caught separately */
    if(a > b) out.push(r);
  }
  return out;
}
function o2cStrays(seq){
  var out = [], i;
  for(i = 0; i < seq.length; i++) if(O2C_ORDER.indexOf(seq[i]) < 0) out.push(seq[i]);
  return out;
}
function o2cMissing(seq){
  var out = [], i;
  for(i = 0; i < O2C_ORDER.length; i++) if(seq.indexOf(O2C_ORDER[i]) < 0) out.push(O2C_ORDER[i]);
  return out;
}
function o2cCost(seq){
  var total = 0, v = o2cViolations(seq), i;
  for(i = 0; i < v.length; i++) total += v[i].cost;
  total += o2cStrays(seq).length * STRAY_COST;
  return total;
}
function o2cStep(id){
  var i;
  for(i = 0; i < O2C_STEPS.length; i++) if(O2C_STEPS[i].id === id) return O2C_STEPS[i];
  for(i = 0; i < P2P_DECOYS.length; i++) if(P2P_DECOYS[i].id === id) return P2P_DECOYS[i];
  return null;
}

/* ============================================================================
   ROUND 2 — ROCKS IN THE RIVER

   Round one showed one process changing hands five times. This round asks two
   different questions about the same picture.

   First: which activity of the value chain does each of the eight departmental
   systems actually serve? That is the chapter's framework applied to a real
   list of applications rather than recited, and four of the ten cells are
   designed to catch a plausible reading — procurement against inbound
   logistics, administration against firm infrastructure, human resources
   against administration, and customer service against marketing and sales.

   Second: the rocks are not in the activities, they are in the crossings
   between them. Six crossings, three ways of getting data across each, and a
   panel that prices all of it while the reader presses.

   Two of those choices are load-bearing later and nothing on the screen says
   so. The mode chosen for Tailgate into Quotebook decides how old the stock
   figure on the promise desk is — which is the number round four answers the
   phone with. The mode chosen for Plantline into Casefile decides whether a
   build record carries the compressor lot — which is how wide round six's
   recall has to be.
   ========================================================================== */

/* ------------------------------------------------------ the activity costs
   What each activity costs to run for a year, and the part of that cost the
   firm would not be carrying if the re-typing and the disputes were not there.
   Printed inside the cells by renderChainBoard, so the reader has to read the
   exhibit rather than be told about it. */
var CHAIN_COSTS = {
  inbound:    { annual: 6200000,  avoidable: 210000 },
  operations: { annual: 48500000, avoidable: 260000 },
  outbound:   { annual: 9100000,  avoidable: 340000 },
  marketing:  { annual: 7400000,  avoidable: 290000 },
  service:    { annual: 4300000,  avoidable: 380000 },
  admin:      { annual: 5600000,  avoidable: 120000 },
  infra:      { annual: 3100000,  avoidable: 40000 },
  hr:         { annual: 2700000,  avoidable: 60000 },
  tech:       { annual: 1900000,  avoidable: 30000 },
  procure:    { annual: 2200000,  avoidable: 180000 }
};

/* The eight standalone applications the company runs today, each with the one
   value chain activity it serves. They recur from here to the end of the game,
   so the list is the single place they are described. */
var SYSTEMS = [
  { id:"yardhand",    name:"Yardhand",    dept:"Goods in",
    does:"Scans pallets at the goods-in dock and books supplier deliveries in",
    activity:"inbound" },
  { id:"plantline",   name:"Plantline",   dept:"Plant",
    does:"Work orders, production scheduling, the aisle-run configurator, build records",
    activity:"operations" },
  { id:"tailgate",    name:"Tailgate",    dept:"Despatch",
    does:"Picking, loading and proof of delivery",
    activity:"outbound" },
  { id:"quotebook",   name:"Quotebook",   dept:"Sales",
    does:"Contacts, campaigns, the sales pipeline, the order book and dealer history",
    activity:"marketing" },
  { id:"casefile",    name:"Casefile",    dept:"Service",
    does:"Warranty calls, complaints, returns and service history",
    activity:"service" },
  { id:"buyplan",     name:"Buyplan",     dept:"Purchasing",
    does:"Consolidates requisitions from every department into purchase orders",
    activity:"procure" },
  { id:"roster",      name:"Roster",      dept:"People",
    does:"Hiring, shifts and payroll",
    activity:"hr" },
  { id:"ledgerworks", name:"Ledgerworks", dept:"Finance",
    does:"General ledger, payables, receivables, month end",
    activity:"admin" }
];

/* A fixed, deliberately unhelpful tray order: not the answer order, and not
   the reverse of it either, so the board looks the same to every reader and to
   the contract test. */
var SYSTEM_TRAY = ["ledgerworks","plantline","buyplan","casefile","yardhand","roster","tailgate","quotebook"];

function systemById(id){
  for(var i = 0; i < SYSTEMS.length; i++) if(SYSTEMS[i].id === id) return SYSTEMS[i];
  return null;
}
/* Every number the chain panel prints comes out of these three. */
function chainTotal(key){
  var t = 0;
  for(var k in CHAIN_COSTS){ if(CHAIN_COSTS.hasOwnProperty(k)) t += CHAIN_COSTS[k][key]; }
  return t;
}
function chainShare(id, key){
  return CHAIN_COSTS[id][key] / chainTotal(key) * 100;
}
/* The ten activities ranked by one of the two cost columns, dearest first, and
   the sum of any group of them. Pure, so the results panel never asserts an
   order the exhibit on the board does not actually show. */
function chainRanked(key){
  var ids = [], k;
  for(k in CHAIN_COSTS){ if(CHAIN_COSTS.hasOwnProperty(k)) ids.push(k); }
  ids.sort(function(a, b){
    if(CHAIN_COSTS[b][key] !== CHAIN_COSTS[a][key]) return CHAIN_COSTS[b][key] - CHAIN_COSTS[a][key];
    return a < b ? -1 : 1;
  });
  return ids;
}
function chainSum(ids, key){
  var t = 0, i;
  for(i = 0; i < ids.length; i++) t += CHAIN_COSTS[ids[i]][key];
  return t;
}
function chainNames(ids){
  var out = [], i;
  for(i = 0; i < ids.length; i++) out.push(chainActivity(ids[i]).name.toLowerCase());
  if(out.length < 2) return out.join("");
  return out.slice(0, out.length - 1).join(", ") + " and " + out[out.length - 1];
}
/* One point per system standing on the activity it serves. */
function placeScore(placement){
  var n = 0;
  for(var i = 0; i < SYSTEMS.length; i++){
    if(placement[SYSTEMS[i].id] === SYSTEMS[i].activity) n++;
  }
  return n;
}
/* Which systems the reader put on a given activity, in the tray's own order,
   so that the marking of the ten cells is reproducible. */
function placedOn(placement, activityId){
  var out = [], i;
  for(i = 0; i < SYSTEM_TRAY.length; i++){
    if(placement[SYSTEM_TRAY[i]] === activityId) out.push(SYSTEM_TRAY[i]);
  }
  return out;
}

/* ------------------------------------------------------------ the crossings
   Three ways for a record to get from one application to another.

     re-key      a person reads one screen and types into another
     nightly file  one system writes a file at close of business, the other
                   reads it at the start of the next day
     live link   the two applications talk as it happens

   Cost per record is what the crossing costs to operate. On top of that sits
   the cost of the mistakes: an error rate times what one error costs to find
   and put right. Both are per record, so the whole thing is arithmetic the
   reader can check by hand. */
var WIRE_DAYS = 250;                 /* working days in a year */
var WIRE_ERROR_COST = 112;           /* what one wrong record costs to find and fix */
var WIRE_ERRORS = { rekey:0.032, file:0.009, live:0.0005 };
var WIRE_CAP = 300000;               /* the one-off money the board has released */
/* How stale the number is at the far end of the crossing, in hours. The
   counter-intuitive one is the middle row and it is the point of the round: a
   person re-typing does it inside the shift, a nightly file waits for the
   night. */
var WIRE_LATENCY = { rekey:6, file:20, live:0 };
var WIRE_MODES = ["rekey","file","live"];
var WIRE_MODE_LABEL = { rekey:"Re-key by hand", file:"Nightly file", live:"Live link" };

var CROSSINGS = [
  { id:"quote-plant",  from:"Quotebook",  to:"Plantline",
    carries:"the order reaches the plant",
    perDay:38, rekey:4.10, file:1.30, live:0.05, oneOff:140000 },
  { id:"plant-tail",   from:"Plantline",  to:"Tailgate",
    carries:"what was built reaches despatch",
    perDay:38, rekey:3.40, file:1.10, live:0.05, oneOff:88000 },
  { id:"tail-quote",   from:"Tailgate",   to:"Quotebook",
    carries:"what shipped reaches the order desk",
    perDay:38, rekey:5.20, file:1.70, live:0.05, oneOff:120000 },
  { id:"buy-yard",     from:"Buyplan",    to:"Yardhand",
    carries:"what was ordered reaches goods-in",
    perDay:46, rekey:2.10, file:0.70, live:0.05, oneOff:60000 },
  { id:"plant-case",   from:"Plantline",  to:"Casefile",
    carries:"the build record's compressor lot reaches the cabinet's service record",
    perDay:38, rekey:2.90, file:0.95, live:0.05, oneOff:82000 },
  { id:"roster-plant", from:"Roster",     to:"Plantline",
    carries:"who is on shift reaches the schedule",
    perDay:14, rekey:1.80, file:0.60, live:0.05, oneOff:40000 }
];

function crossingById(id){
  for(var i = 0; i < CROSSINGS.length; i++) if(CROSSINGS[i].id === id) return CROSSINGS[i];
  return null;
}
function wireRecords(c){ return c.perDay * WIRE_DAYS; }
function wireAnnual(c, mode){
  return wireRecords(c) * c[mode] + wireRecords(c) * WIRE_ERRORS[mode] * WIRE_ERROR_COST;
}
function wireBill(modes){
  var t = 0, i;
  for(i = 0; i < CROSSINGS.length; i++) t += wireAnnual(CROSSINGS[i], modes[CROSSINGS[i].id]);
  return t;
}
function wireCapital(modes){
  var t = 0, i;
  for(i = 0; i < CROSSINGS.length; i++){
    if(modes[CROSSINGS[i].id] === "live") t += CROSSINGS[i].oneOff;
  }
  return t;
}
/* How long the capital takes to come back, measured against the cheap option
   rather than against today: the honest comparison, because the nightly file
   costs nothing to put in. */
function wirePayback(c){
  return c.oneOff / (wireAnnual(c, "file") - wireAnnual(c, "live"));
}
function wirePaybackRange(){
  var lo = null, hi = null, i, p;
  for(i = 0; i < CROSSINGS.length; i++){
    p = wirePayback(CROSSINGS[i]);
    if(lo === null || p < lo) lo = p;
    if(hi === null || p > hi) hi = p;
  }
  return { lo: lo, hi: hi };
}
function wireAllOn(mode){
  var o = {}, i;
  for(i = 0; i < CROSSINGS.length; i++) o[CROSSINGS[i].id] = mode;
  return o;
}
function wireMovedOff(modes){
  var n = 0, i;
  for(i = 0; i < CROSSINGS.length; i++) if(modes[CROSSINGS[i].id] !== "rekey") n++;
  return n;
}
/* Integration is a measure of how much of the company's data moves without a
   person carrying it, so a file counts and a live link counts more. */
function wireIntegration(modes){

  for(i = 0; i < CROSSINGS.length; i++){

/* ============================================================================
   ROUND 3 — THE BACKBONE

   What an enterprise system is, what it replaces, how far to change it, and
   what five years of it actually costs once the four lines the vendor did not
   quote are put back in.

   Three of the decisions on this screen are read out again later. A module
   that was customized rather than configured has to be reprogrammed at every
   release, which is why the update that closes a payment vulnerability either
   goes on over a weekend or never goes on at all. Training that was cut is the
   productivity collapse round four is standing in the middle of. And the
   architecture chosen here decides whether the person who answers the phone in
   round four is reading one database or eight.

   Nothing on this screen is a number somebody typed in to make it look bad.
   Every figure the reader sees comes out of the pure functions below, from the
   quote on the table and the three switches they set themselves.
   ========================================================================== */

/* -------------------------------------------------------------- the quote
   Both vendors quoted the same two lines, which is the point of the round.
   Hardware is zero because the system is hosted on the provider's servers:
   low upfront cost, and a subscription instead. */
var ERP_QUOTE = { licence: 980000, implementation: 620000, hardware: 0 };

function erpQuoteTotal(){ return ERP_QUOTE.licence + ERP_QUOTE.implementation + ERP_QUOTE.hardware; }

/* ------------------------------------------- what changing a module costs
   A customization is written once and then reprogrammed at every release,
   because subsequent releases of the software do not include it. Four
   releases fall inside the five years the board is being shown. */
var ERP_CUSTOMIZE_BUILD = 210000;
var ERP_REPROGRAM_SHARE = 0.35;
var ERP_RELEASES = 4;
var ERP_CONFIG_DAYS = 45;
var ERP_CONFIG_RATE = 1450;

function erpReprogramPerRelease(){ return Math.round(ERP_CUSTOMIZE_BUILD * ERP_REPROGRAM_SHARE); }
function erpCustomizeFiveYear(){ return ERP_CUSTOMIZE_BUILD + ERP_RELEASES * erpReprogramPerRelease(); }
function erpConfigureFiveYear(){ return ERP_CONFIG_DAYS * ERP_CONFIG_RATE; }
function erpModeFiveYear(mode){
  if(mode === "customize") return erpCustomizeFiveYear();
  if(mode === "configure") return erpConfigureFiveYear();
  return 0;                       /* vanilla: you change how you work instead */
}

/* The three modules the firm's own people argue about. One of them is the only
   thing on the list this company wins on. */
var ERP_MODULES = [
  { id:"config", name:"The aisle-run configurator", home:"Operations management",
    what:"Cuts a run to a supermarket&rsquo;s floor plan, its livery and a refrigerant chosen per site, " +

/* The chapter's argument, as a score. The configurator is the one thing this
   firm is better at than its competitors, and no vanilla module cuts a cabinet
   to somebody's floor plan. Month end and the warranty workflow are ordinary,
   and the vendor's version of an ordinary process is a best practice. */
function erpCustomScore(modes){
  var cfg = modes.config;
  var ordCustom = 0, ordConfig = 0, i, v;
  for(i = 0; i < ERP_MODULES.length; i++){
    if(ERP_MODULES[i].id === "config") continue;
    v = modes[ERP_MODULES[i].id];
    if(v === "customize") ordCustom++;
    if(v === "configure") ordConfig++;
  }
  if(cfg === "customize"){
    if(ordConfig === 2) return 4;        /* exactly the call the chapter argues for */
    if(ordCustom === 2) return 2;        /* right about the one, wrong about both others */
    if(ordCustom === 1) return 3;        /* right about the one, wrong about one other */
    return 3;                            /* right about the one, ordinary work left as it ships */
  }
  if(ordCustom > 0) return 0;            /* paid to change something ordinary, not the thing you win on */
  if(cfg === "configure" && ordConfig === 2) return 2;
  return 1;
}

/* A customized estate is the estate that cannot take an update: the update
   would overwrite the modules somebody wrote, so applying it means rewriting
   and retesting every one of them first.

   One customization is a weekend of work somebody can schedule, and the update
   still goes on. Two or more is the estate the chapter describes: the rewrite
   is big enough that the update gets put off, and then put off again. It is
   the count that decides it, not which module — a firm that customized month
   end and the warranty workflow is in exactly the same position as one that
   customized the configurator and the month end. */
function erpPatchable(modes){
  return erpCountMode(modes, "customize") < 2;
}
